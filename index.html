/* ==========================================================================
   NOTA PARA A PRÓXIMA INSTÂNCIA DO CLAUDE — leia antes de editar este arquivo
   ==========================================================================
   Este é um assistente de criação de personagem D&D 2024 (estilo Roll20):
   passo a passo, só libera "Avançar" quando a etapa está completa, com foco
   automático (scroll + destaque) na primeira seleção faltante.

   ESCOPO ATUAL (funcionando): Bruxo, Tiferino, Pequenino, Charlatão.
   FALTAM: as outras 11 classes, 8 espécies, 15 antecedentes do PHB 2024.

   NOTA SOBRE PEQUENINO (Halfling): diferente do Tiferino, essa espécie NÃO
   tem nenhuma escolha própria no PHB 2024 (sem subraça, sem legado, sem
   atributo de conjuração) — todos os traços são fixos (Corajoso, Agilidade
   Pequenina, Sorte, Furtividade Natural). Por isso o step 1 pra essa espécie
   é só informativo e canAdvance()/findFirstMissingGroup() retornam sempre
   liberado quando data.especie==='Pequenino'. Serve de modelo pra outras
   espécies "simples" (Humano, Anão, Elfo, Gnomo, Orc também têm poucas ou
   nenhuma escolha — só Aasimar e Draconato têm escolhas parecidas com o
   legado do Tiferino).

   O usuário provavelmente vai subir de novo, neste novo chat:
   1. O PDF do Livro do Jogador D&D 5e 2024
   2. A planilha "Magias_PHB2024_Completo.xlsx" (abas "Magias PHB 2024 + UA
      Psion" e "Talentos") — já tem TODAS as magias/truques/talentos do
      livro condensados (efeito + escalonamento em português, parafraseado,
      não copiado cru do livro). É a fonte mais rápida pra alimentar
      SPELL_DETAILS de qualquer classe nova.
   3. (Só se for mexer em Psiônico) o PDF do Unearthed Arcana Psiônico 2025

   ONDE MEXER PRA ADICIONAR CONTEÚDO NOVO:
   - Antes de ir atrás no PDF: tem um índice de páginas (por classe/espécie/
     antecedente/talentos) logo depois da declaração de CLASSES/SPECIES/
     BACKGROUNDS, uns 70 linhas abaixo desta nota. Confere ali primeiro.
   - CLASSES / SPECIES / BACKGROUNDS: arrays com os nomes oficiais (12/10/16).
     ENABLED_CLASSES / ENABLED_SPECIES / ENABLED_BACKGROUNDS controlam o que
     já é clicável na tela de seleção (resto fica cinza, "em breve").
   - Nova classe: criar objeto tipo BRUXO (skills, cantrips, spells1,
     equipmentA/B, weaponProf, armorProf...) + função renderXDetail() +
     handlers de toggle, no mesmo padrão do Bruxo. Adicionar entrada em
     CLASS_INFO (descrição + Atributo Principal + Dado de Vida + Complexidade
     — tirado da tabela "Visão Geral das Classes", página 33 do livro).
   - Nova espécie: objeto tipo TIEFLING com os traços/escolhas próprias.
   - Novo antecedente: objeto tipo CHARLATAO + entrada em BACKGROUND_INFO
     (nome do talento + descrição curta do QUE O TALENTO FAZ, não da
     "personalidade" do antecedente + perícias/ferramenta).
   - SPELL_DETAILS: nome -> {tempo, alcance, componentes, duracao, efeito,
     escalonamento}. Usado pelo botão "ⓘ" (spellChoiceList) nas listas de
     magia/truque. Puxar direto da planilha, mesmo texto já condensado.
   - SHOP: itens da loja final, filtrados por proficiência (campo filterProf
     bate com weaponProf/armorProf da classe). Kits com múltiplos itens usam
     o campo "cont" pra listar o conteúdo (evita duplicar comprando 2 kits
     parecidos, tipo Aventureiro + Explorador de Masmorras).
   - Ordem das etapas (mudar com cuidado, tudo sincronizado):
     0 Espécie -> 1 detalhe espécie -> 2 Antecedente -> 3 detalhe antecedente
     -> 4 Classe -> 5 detalhe classe -> 6 Atributos -> 7 Loja -> 8 Resumo.
     Se adicionar/mudar etapa, atualizar TOTAL_STEPS, render(), canAdvance()
     E findFirstMissingGroup() juntos (os 3 têm um switch/case por step).
   - findFirstMissingGroup(): cada grupo de escolha tem id="grp-{step}-nome"
     pra permitir o scroll+destaque automático. Grupo novo = id novo.
   - editSection(idx) / returnToSummary: sistema de "editar e voltar pro
     resumo" (usado nos links "Editar" da tela final).
   - ALL_SKILLS / ALL_TOOLS: catálogo oficial de perícias e FERRAMENTAS DE
     VERDADE (as que têm ficha de Atributo+Usar Objeto no livro). Cuidado:
     "Kit de Aventureiro", "Kit de Diplomata" etc. NÃO são ferramentas, são
     só pacotes de equipamento — não confundir na hora de montar talentos
     tipo Habilidoso pra outros antecedentes.

   PADRÕES A MANTER:
   - Nunca copiar parágrafo cru do livro — sempre parafrasear (mesma regra
     de direitos autorais usada nas outras conversas/planilha).
   - Todo texto em português, mesmo tom já usado no resto do arquivo.
   - Testar com Playwright headless (clicando o fluxo inteiro) depois de
     qualquer edição, antes de entregar — erro de sintaxe JS às vezes só
     aparece assim, o resto do app quebra silenciosamente.

   ATUALIZAÇÃO DE ARQUITETURA (reorganização em andamento, um arquivo por
   vez, com o usuário testando cada passo):
   - CSS já foi extraído para css/styles.css (linkado no <head>).
   - SPELL_DETAILS já foi extraído para data/spells.js (carregado via
     <script src="data/spells.js"> ANTES deste <script> principal, então a
     const SPELL_DETAILS já existe globalmente quando este arquivo roda).
   - Todas as 10 espécies do PHB 2024 já têm data/species/*.js: Tiferino,
     Pequenino, Aasimar, Anão, Orc, Humano (feitas) — Draconato, Elfo, Gnomo,
     Golias ainda faltam (têm "subespécie" com escalonamento por nível,
     seguir o molde do Tiferino). Padrão de dados: {nome, flavor, tipo,
     tamanho:{opcoes,alturas}, deslocamento, visaoNoEscuro, tracosFixos:
     [{nome,resumo,concede:[{tipo,nome}]}], subespecie:{nome,
     escolhidaNaCriacao,opcoes:[{nome,nivel1,nivel3,nivel5}]} ou null}.
   - data/feats.js (86 talentos) e data/skills.js (perícia->atributo) também
     já existem — usados pelo Humano (Hábil/Versátil) e pelo Habilidoso dos
     antecedentes, que agora agrupam perícias por atributo via
     skillGroupsByAbility()/groupedSinglePick().
   - PENDÊNCIA (avisada pelo usuário, resolver só quando revisarmos CLASSES,
     não mexer nisso fora dessa fase): a escolha de perícias do Bruxo
     (renderBruxoDetail) e a lista de perícias na Ficha Concluída
     (renderSummary) ainda mostram a lista "chapada", sem agrupar por
     atributo como já fizemos no Hábil/Habilidoso. Quando for a vez de
     revisar o Bruxo, aplicar groupedSinglePick/skillGroupsByAbility (ou
     uma variante multi-select, já que o Bruxo escolhe 2) nesses dois
     lugares também.
   - Próximos candidatos a extrair para data/: CHARLATAO, NOBRE, SHOP (cada
     um vira um <script src="data/nome.js"> adicional, na mesma ordem,
     antes deste script principal). Ainda não fazer isso sem confirmar com
     o usuário — está sendo feito devagar, um arquivo por vez.
   ========================================================================== */

let step = 0;
const TOTAL_STEPS = 9;
let data = {
  especie: null, antecedente: null, classe: null,
  tiefling: { tamanho: null, legado: null, atributoLegado: null },
  pequenino: {},
  anao: {},
  orc: {},
  humano: { tamanho: null, pericia: null, talento: null },
  draconato: { heranca: null },
  elfo: { pericia: null, linhagem: null },
  aasimar: { tamanho: null },
  charlatao: { abilityPlan: null, equipment: null, habilidoso: [] },
  nobre: { abilityPlan: null, equipment: null, habilidoso: [], kitJogos: null },
  bruxo: { skills: [], pactBoon: null, cantrips: [], tomoCantrips: [], spells1: [], tomoRituals: [], equipment: null },
  attrs: {},
  shop: { purchases: {} },
  returnToSummary: false
};

function mod(score){ return Math.floor((score-10)/2); }
function fmt(n){ return (n>=0?'+':'')+n; }
function fmtGold(n){ return (Math.round(n*100)/100).toString().replace('.',','); }

let saveTimer;
function persist(){
  clearTimeout(saveTimer);
  document.getElementById('saveText').textContent = 'salvando…';
  document.getElementById('saveDot').style.opacity='1';
  saveTimer = setTimeout(async ()=>{
    try{
      await window.storage.set('char_wizard_state', JSON.stringify({step, data}));
      document.getElementById('saveText').textContent='salvo';
      document.getElementById('saveDot').style.opacity='0.3';
    }catch(e){
      document.getElementById('saveText').textContent='—';
    }
  }, 400);
}
async function restore(){
  try{
    const r = await window.storage.get('char_wizard_state');
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      step = parsed.step || 0;
      data = Object.assign(data, parsed.data);
      if(!data.shop) data.shop = {purchases:{}};
      if(!data.pequenino) data.pequenino = {};
      if(!data.aasimar) data.aasimar = { tamanho: null };
      if(!data.anao) data.anao = {};
      if(!data.orc) data.orc = {};
      if(!data.humano) data.humano = { tamanho: null, pericia: null, talento: null };
      if(!data.draconato) data.draconato = { heranca: null };
      if(!data.elfo) data.elfo = { pericia: null, linhagem: null };
      if(!data.nobre) data.nobre = { abilityPlan: null, equipment: null, habilidoso: [], kitJogos: null };
      if(!data.charlatao.habilidoso) data.charlatao.habilidoso = [];
      if(!data.nobre.habilidoso) data.nobre.habilidoso = [];
      if(data.returnToSummary===undefined) data.returnToSummary = false;
    }
  }catch(e){}
}

function renderProgress(){
  const bar = document.getElementById('progressBar');
  bar.innerHTML='';
  for(let i=0;i<TOTAL_STEPS;i++){
    const seg = document.createElement('div');
    seg.className = 'seg' + (i<step?' done':'') + (i===step?' current':'');
    bar.appendChild(seg);
  }
}
function goTo(newStep){ step = newStep; persist(); render(); }
function next(){
  const missing = findFirstMissingGroup();
  if(!missing){ goTo(step+1); return; }
  scrollToMissing(missing);
}
function back(){ if(step>0) goTo(step-1); }

function findFirstMissingGroup(){
  switch(step){
    case 0: return data.especie ? null : 'grp-0-especie';
    case 1:
      if(data.especie==='Pequenino') return null;
      if(data.especie==='Anão') return null;
      if(data.especie==='Orc') return null;
      if(data.especie==='Humano'){
        if(!data.humano.tamanho) return 'grp-1-tamanho';
        if(!data.humano.pericia) return 'grp-1-pericia';
        if(!data.humano.talento) return 'grp-1-talento';
        return null;
      }
      if(data.especie==='Draconato') return data.draconato.heranca ? null : 'grp-1-heranca';
      if(data.especie==='Elfo'){
        if(!data.elfo.pericia) return 'grp-1-pericia';
        if(!data.elfo.linhagem) return 'grp-1-linhagem';
        return null;
      }
      if(data.especie==='Aasimar') return data.aasimar.tamanho ? null : 'grp-1-tamanho';
      if(!data.tiefling.tamanho) return 'grp-1-tamanho';
      if(!data.tiefling.legado) return 'grp-1-legado';
      if(!data.tiefling.atributoLegado) return 'grp-1-atributo';
      return null;
    case 2: return data.antecedente ? null : 'grp-2-antecedente';
    case 3: {
      const bg = activeBgData();
      const plan = bg.abilityPlan;
      const planOk = plan && (plan.type==='2-1' ? (!!plan.plus2 && !!plan.plus1) : (plan.plusOnes||[]).length===3);
      if(!planOk) return 'grp-3-abilityplan';
      if(data.antecedente==='Nobre' && !data.nobre.kitJogos) return 'grp-3-kitjogos';
      if(bg.habilidoso.length!==3) return 'grp-3-habilidoso';
      if(!bg.equipment) return 'grp-3-equipment';
      return null;
    }
    case 4: return data.classe ? null : 'grp-4-classe';
    case 5: {
      const b = data.bruxo;
      if(b.skills.length!==2) return 'grp-5-skills';
      if(!b.pactBoon) return 'grp-5-pact';
      if(b.cantrips.length!==2) return 'grp-5-cantrips';
      if(b.pactBoon==='Pacto do Tomo' && b.tomoCantrips.length!==3) return 'grp-5-tomocantrips';
      if(b.spells1.length!==2) return 'grp-5-spells1';
      if(b.pactBoon==='Pacto do Tomo' && b.tomoRituals.length!==2) return 'grp-5-tomorituals';
      if(!b.equipment) return 'grp-5-equipment';
      return null;
    }
    case 6: {
      const missingAbility = ABILITIES.find(a=>data.attrs[a]===undefined);
      return missingAbility ? 'grp-6-attr-'+missingAbility : null;
    }
    default: return null;
  }
}

function scrollToMissing(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.classList.remove('highlight-missing');
  void el.offsetWidth; // força reflow pra reiniciar a animação se já tiver rodado
  el.classList.add('highlight-missing');
  setTimeout(()=>el.classList.remove('highlight-missing'), 1600);
}

function nav(canNext){
  const summaryBtn = data.returnToSummary ? `<button class="btn primary" onclick="returnToSummaryNow()" style="margin-left:8px;">Voltar ao Resumo ✓</button>` : '';
  return `<div class="nav">
    <button class="btn" onclick="back()" ${step===0?'style="visibility:hidden"':''}>← Voltar</button>
    <div>
      <button class="btn primary" id="nextBtn" onclick="next()">${step===TOTAL_STEPS-1?'Concluir':'Avançar →'}</button>
      ${summaryBtn}
    </div>
  </div>`;
}
function editSection(idx){ data.returnToSummary=true; goTo(idx); }
function returnToSummaryNow(){
  const missing = findFirstMissingGroup();
  if(missing){ scrollToMissing(missing); return; }
  data.returnToSummary=false; goTo(8);
}

function canAdvance(){
  switch(step){
    case 0: return !!data.especie;
    case 1: return (data.especie==='Pequenino' || data.especie==='Anão' || data.especie==='Orc') ? true : (data.especie==='Humano' ? !!(data.humano.tamanho && data.humano.pericia && data.humano.talento) : (data.especie==='Draconato' ? !!data.draconato.heranca : (data.especie==='Elfo' ? !!(data.elfo.pericia && data.elfo.linhagem) : (data.especie==='Aasimar' ? !!data.aasimar.tamanho : !!(data.tiefling.tamanho && data.tiefling.legado && data.tiefling.atributoLegado)))));
    case 2: return !!data.antecedente;
    case 3: {
      const bg = activeBgData();
      const plan = bg.abilityPlan;
      const planOk = plan && (plan.type==='2-1' ? (!!plan.plus2 && !!plan.plus1) : (plan.plusOnes||[]).length===3);
      const kitOk = data.antecedente!=='Nobre' || !!data.nobre.kitJogos;
      return planOk && kitOk && !!bg.equipment && bg.habilidoso.length===3;
    }
    case 4: return !!data.classe;
    case 5: {
      const b = data.bruxo;
      return b.skills.length===2 && !!b.pactBoon &&
        b.cantrips.length===2 &&
        (b.pactBoon!=='Pacto do Tomo' || b.tomoCantrips.length===3) &&
        b.spells1.length===2 &&
        (b.pactBoon!=='Pacto do Tomo' || b.tomoRituals.length===2) &&
        !!b.equipment;
    }
    case 6: return ABILITIES.every(a=>data.attrs[a]!==undefined);
    case 7: return true;
    case 8: return true;
    default: return false;
  }
}

function render(){
  renderProgress();
  const c = document.getElementById('cardContent');
  let html = '';
  if(step===0) html = renderSpeciesStep();
  else if(step===1) html = (data.especie==='Pequenino') ? renderPequeninoDetail() : (data.especie==='Anão') ? renderAnaoDetail() : (data.especie==='Orc') ? renderOrcDetail() : (data.especie==='Humano') ? renderHumanoDetail() : (data.especie==='Draconato') ? renderDraconatoDetail() : (data.especie==='Elfo') ? renderElfoDetail() : (data.especie==='Aasimar') ? renderAasimarDetail() : renderTieflingDetail();
  else if(step===2) html = renderBackgroundStep();
  else if(step===3) html = (data.antecedente==='Nobre') ? renderNobreDetail() : renderCharlatanDetail();
  else if(step===4) html = renderClassStep();
  else if(step===5) html = renderBruxoDetail();
  else if(step===6) html = renderAttrs();
  else if(step===7) html = renderShop();
  else if(step===8) html = renderSummary();
  c.innerHTML = html;
  attachStepHandlers();
}

/* Lista de escolha de truques/magias, com botão "ⓘ" que expande um card de detalhe
   (tempo, alcance, componentes, duração, efeito, escalonamento) sem afetar a seleção. */
function spellChoiceList(items, selectedList, maxTotal, toggleFn){
  return `<div class="check-list" style="margin-bottom:6px;">${items.map(name=>{
    const sel = selectedList.includes(name);
    const disabled = !sel && selectedList.length>=maxTotal;
    const detail = SPELL_DETAILS[name];
    const isExpanded = expandedSpellInfo===name;
    return `<div class="spell-pill-wrap ${isExpanded?'expanded':''}">
      <span class="check-pill ${sel?'selected':''} ${disabled?'disabled':''}" ${disabled?'':`data-pick="${name}" data-fn="${toggleFn}"`}>${name}</span>
      ${detail?`<button class="info-btn ${isExpanded?'active':''}" data-pick="${name}" data-fn="toggleSpellInfo" title="Ver detalhes">ⓘ</button>`:''}
      ${isExpanded && detail ? renderSpellDetailCard(detail) : ''}
    </div>`;
  }).join('')}</div>`;
}

let expandedTraitInfo = null;
function toggleTraitInfo(name){
  expandedTraitInfo = (expandedTraitInfo===name) ? null : name;
  render();
}

/* Pills para itens ESPECÍFICOS concedidos de graça que existem numa lista
   nossa (magia/truque hoje — perícia/talento quando tivermos os bancos
   correspondentes). NÃO usar para o traço inteiro — só para o nome exato
   do item (ex: "Taumaturgia", "Rajada de Veneno"). O botão "ⓘ" só aparece
   se houver detalhe pra mostrar (hoje: banco de magias). */
function grantedItemList(items){
  if(!items || items.length===0) return '';
  return `<div class="check-list" style="margin:8px 0 2px;">${items.map(it=>{
    const isExpanded = expandedTraitInfo===it.nome;
    const spellDetail = SPELL_DETAILS[it.nome];
    return `<div class="spell-pill-wrap ${isExpanded?'expanded':''}">
      <span class="check-pill selected">${it.nome}</span>
      ${spellDetail?`<button class="info-btn ${isExpanded?'active':''}" data-pick="${it.nome}" data-fn="toggleTraitInfo" title="Ver detalhes">ⓘ</button>`:''}
      ${isExpanded && spellDetail ? renderSpellDetailCard(spellDetail) : ''}
    </div>`;
  }).join('')}</div>`;
}

/* Caixa de traço concedido (texto completo + pills dos itens específicos que
   ele concede, se houver). Usada tanto pros traços fixos quanto, dentro da
   escolha de subespécie, pra cada bloco de nível. */
function traitBox(nome, resumo, concede){
  return `<div class="option-block">
    <h3 style="color:var(--gold);margin-top:0;">${nome}</h3>
    ${resumo?`<p>${resumo}</p>`:''}
    ${grantedItemList(concede)}
  </div>`;
}

/* Lista de escolha ÚNICA de talento, filtrada por categoria (ex: só "Origem"
   pro Versátil do Humano), com botão "ⓘ" que mostra a ficha do banco de
   talentos (categoria, pré-requisito, benefícios, página). */
function featPickList(names, selected, pickFn){
  return `<div class="check-list" style="margin-bottom:6px;">${names.map(name=>{
    const sel = selected===name;
    const isExpanded = expandedTraitInfo===name;
    const detail = FEAT_DETAILS[name];
    return `<div class="spell-pill-wrap ${isExpanded?'expanded':''}">
      <span class="check-pill ${sel?'selected':''}" data-pick="${name}" data-fn="${pickFn}">${name}</span>
      ${detail?`<button class="info-btn ${isExpanded?'active':''}" data-pick="${name}" data-fn="toggleTraitInfo" title="Ver detalhes">ⓘ</button>`:''}
      ${isExpanded && detail ? renderFeatDetailCard(detail) : ''}
    </div>`;
  }).join('')}</div>`;
}

function choiceGrid(list, enabledList, selected, onClickName){
  return `<div class="choice-grid">${list.map(n=>{
    const enabled = enabledList.includes(n);
    const sel = selected===n;
    return `<div class="choice ${enabled?'':'disabled'} ${sel?'selected':''}" ${enabled?`data-pick="${n}" data-fn="${onClickName}"`:''}>
      ${n}${enabled?'':'<span class="note">em breve</span>'}
    </div>`;
  }).join('')}</div>`;
}

/* Renderiza uma lista de escolha (checkbox-pill) separada em mini-grupos com cabeçalho,
   pra quando o talento/recurso permite escolher entre categorias diferentes
   (ex: Atributos / Perícias / Ferramentas). Grupos vazios não aparecem. */
function groupedChoiceList(groups, selectedList, maxTotal, toggleFn){
  return groups.filter(g=>g.items.length>0).map(g=>`
    <div class="group-label">${g.label}</div>
    <div class="check-list" style="margin-bottom:10px;">
      ${g.items.map(item=>{
        const sel = selectedList.includes(item);
        const disabled = !sel && selectedList.length>=maxTotal;
        return `<div class="check-pill ${sel?'selected':''} ${disabled?'disabled':''}" ${disabled?'':`data-pick="${item}" data-fn="${toggleFn}"`}>${item}</div>`;
      }).join('')}
    </div>`).join('');
}

function choiceGridWithInfo(list, enabledList, selected, onClickName, infoMap){
  return `<div class="choice-grid">${list.map(n=>{
    const enabled = enabledList.includes(n);
    const sel = selected===n;
    const info = infoMap && infoMap[n];
    let infoHtml = '';
    if(info){
      const fields = [...(info.fields||[])];
      if(info.talentoNome){
        fields.unshift(["Talento", `${info.talentoNome} <i style="color:var(--parchment-dim);">(${info.talentoDesc})</i>`]);
      }
      if(info.descricao){
        infoHtml += `<span class="note" style="display:block;font-style:italic;text-align:left;margin-top:6px;">${info.descricao}</span>`;
      }
      infoHtml += `<span class="note" style="display:block;text-align:left;line-height:1.4;margin-top:6px;">
        ${fields.map(([label,val])=>`<b>${label}:</b> ${val}`).join('<br>')}
      </span>`;
    } else if(!enabled){
      infoHtml = '<span class="note">em breve</span>';
    }
    return `<div class="choice ${enabled?'':'disabled'} ${sel?'selected':''}" ${enabled?`data-pick="${n}" data-fn="${onClickName}"`:''}>
      ${n}${infoHtml}
    </div>`;
  }).join('')}</div>`;
}

/* Agrupa uma lista de perícias pelos 6 atributos (Força, Destreza, ...),
   na mesma ordem de ABILITIES. Grupos sem nenhuma perícia da lista dada
   simplesmente não aparecem — não precisa filtrar manualmente na chamada. */
function skillGroupsByAbility(skillList){
  return ABILITIES.map(ab => ({
    label: ab,
    items: skillList.filter(s => SKILL_ABILITY[s]===ab)
  }));
}

/* Igual ao groupedChoiceList, mas de escolha ÚNICA (radio, não checkbox) —
   usado quando só se pode marcar 1 item no total, como o Hábil do Humano. */
function groupedSinglePick(groups, selected, pickFn){
  return groups.filter(g=>g.items.length>0).map(g=>`
    <div class="group-label">${g.label}</div>
    <div class="check-list" style="margin-bottom:10px;">
      ${g.items.map(item=>`<div class="check-pill ${selected===item?'selected':''}" data-pick="${item}" data-fn="${pickFn}">${item}</div>`).join('')}
    </div>`).join('');
}

  <h3 id="grp-5-tomorituals">Magias Rituais do Pacto do Tomo (escolha 2, 1º círculo, de qualquer classe)</h3>
  ${spellChoiceList(ALL_1ST_RITUAL.filter(r=>!b.spells1.includes(r)), b.tomoRituals, 2, 'toggleTomoRitual')}
  <div class="counter ${b.tomoRituals.length===2?'ok':''}">${b.tomoRituals.length}/2 escolhidas</div>
  `:''}

  <h3 id="grp-5-equipment">Equipamento Inicial</h3>
  <div class="option-block ${b.equipment==='A'?'selected':''}">
    <h3 style="color:var(--gold);margin-top:0;">Opção A</h3><p>${BRUXO.equipmentA.join(', ')}</p>
    <button class="pick-btn" data-pick="A" data-fn="pickBruxoEquip">${b.equipment==='A'?'Selecionado':'Escolher'}</button>
  </div>
  <div class="option-block ${b.equipment==='B'?'selected':''}">
    <h3 style="color:var(--gold);margin-top:0;">Opção B</h3><p>${BRUXO.equipmentB_gold} PO</p>
    <button class="pick-btn" data-pick="B" data-fn="pickBruxoEquip">${b.equipment==='B'?'Selecionado':'Escolher'}</button>
  </div>
  ${nav(canAdvance())}`;
}

function getBonusFor(ability){
  const plan = activeBgData().abilityPlan;
  if(!plan) return 0;
  if(plan.type==='1-1-1'){
    return (plan.plusOnes||[]).includes(ability) ? 1 : 0;
  }
  if(plan.type==='2-1'){
    if(plan.plus2===ability) return 2;
    if(plan.plus1===ability) return 1;
  }
  return 0;
}

function renderAttrs(){
  const used = Object.values(data.attrs);
  return `<h2>Passo — Atributos (Array Padrão)</h2>
  <div class="intro">Distribua 15, 14, 13, 12, 10, 8 entre os seis atributos. Valores já usados aparecem em laranja — se você escolher um deles, ele é retirado de onde estava antes e movido pra cá. O bônus do antecedente (Charlatão) é somado automaticamente.</div>
  ${ABILITIES.map(a=>{
    const chosen = data.attrs[a];
    const bonus = getBonusFor(a);
    const final = chosen!==undefined ? chosen+bonus : null;
    return `<div class="attr-row" id="grp-6-attr-${a}">
      <div class="name">${a}</div>
      <select data-ability="${a}" onchange="setAttr('${a}', this.value)">
        <option value="">—</option>
        ${STANDARD_ARRAY.map(v=>{
          const usedElsewhere = used.includes(v) && chosen!==v;
          const label = usedElsewhere ? `${v} (em uso)` : `${v}`;
          const style = usedElsewhere ? 'style="color:#c98a5a;"' : '';
          return `<option value="${v}" ${chosen===v?'selected':''} ${style}>${label}</option>`;
        }).join('')}
      </select>
      <div class="bonus-tag">${bonus?('antecedente '+fmt(bonus)):''}</div>
      <div class="final">${final!==null?`Total ${final} (mod ${fmt(mod(final))})`:''}</div>
    </div>`;
  }).join('')}
  ${nav(canAdvance())}`;
}

function startingGold(){
  const bGold = data.bruxo.equipment==='B' ? BRUXO.equipmentB_gold : 0;
  const bgConst = data.antecedente==='Nobre' ? NOBRE : CHARLATAO;
  const bg = activeBgData();
  const bgGold = bg.equipment==='B' ? bgConst.equipmentB_gold : (bg.equipment==='A' ? bgConst.equipmentA_gold : 0);
  const bAGold = data.bruxo.equipment==='A' ? 15 : 0;
  return bGold + bgGold + bAGold;
}
function spentGold(){
  let total = 0;
  for(const [name, qty] of Object.entries(data.shop.purchases||{})){
    const item = findShopItem(name);
    if(item) total += item.c * qty;
  }
  return total;
}
function findShopItem(name){
  for(const cat of Object.values(SHOP)){
    const found = cat.items.find(i=>i.n===name);
    if(found) return found;
  }
  return null;
}
function renderShop(){
  const remaining = startingGold() - spentGold();
  const purchases = data.shop.purchases||{};
  let html = `<h2>Loja — Gaste seu Dinheiro Inicial</h2>
  <div class="intro">Itens filtrados pelo que o Bruxo pode usar: só Armas Simples e Armadura Leve aparecem (sem proficiência com armas Marciais ou armaduras Média/Pesada). Equipamento de aventura vale pra qualquer um.</div>
  <div class="wallet">
    <div><div class="label">Ouro Inicial</div><div style="font-size:0.85rem;color:var(--parchment-dim);">${fmtGold(startingGold())} PO</div></div>
    <div style="text-align:right;"><div class="label">Restante</div><div class="value ${remaining<0?'negative':''}">${fmtGold(remaining)} PO</div></div>
  </div>`;

  Object.entries(SHOP).forEach(([catName, cat])=>{
    if(cat.filterProf && cat.filterProf!==BRUXO.weaponProf && cat.filterProf!==BRUXO.armorProf) return;
    html += `<h3>${catName}</h3>
    <table class="shop-table"><thead><tr><th>Item</th><th>Dano/Efeito</th><th>Propriedades</th><th>Custo</th><th>Qtd.</th></tr></thead><tbody>
    ${cat.items.map(it=>{
      const qty = purchases[it.n]||0;
      const maxQty = maxAffordableQty(it.n) + qty; // limite considerando o que já foi gasto neste item
      const atCap = qty>=maxQty;
      const contHtml = it.cont ? `<div style="font-size:0.68rem; color:var(--parchment-dim); font-style:italic; margin-top:2px; max-width:220px;">${it.cont}</div>` : '';
      return `<tr>
        <td>${it.n}${contHtml}</td><td>${it.d}</td><td style="color:var(--parchment-dim);font-size:0.78rem;">${it.p}</td>
        <td>${fmtGold(it.c)} PO</td>
        <td><div class="qty-cell">
          <button class="btn small" data-fn="shopDec" data-pick="${it.n}">−</button>
          <input type="number" min="0" max="${maxQty}" value="${qty}" data-fn="shopSet" data-item="${it.n}">
          <button class="btn small" data-fn="shopInc" data-pick="${it.n}" ${atCap?'disabled title="Ouro insuficiente"':''}>+</button>
        </div></td>
      </tr>`;
    }).join('')}
    </tbody></table>`;
  });

  const cartEntries = Object.entries(purchases).filter(([,q])=>q>0);
  if(cartEntries.length){
    html += `<h3>Carrinho</h3><div class="cart-list">${cartEntries.map(([n,q])=>{
      const item = findShopItem(n);
      return `<div class="cart-item"><span>${n} ×${q}</span><span>${fmtGold(item.c*q)} PO</span></div>`;
    }).join('')}</div>`;
  }

  html += nav(canAdvance());
  return html;
}

function renderSummary(){
  const b = data.bruxo, t = data.tiefling;
  const bg = activeBgData();
  const bgConst = data.antecedente==='Nobre' ? NOBRE : CHARLATAO;
  const bgEquipA = data.antecedente==='Nobre'
    ? [data.nobre.kitJogos || 'Kit de Jogos', ...NOBRE.equipmentA.slice(1)]
    : CHARLATAO.equipmentA;
  const finalScore = a => (data.attrs[a]||0) + getBonusFor(a);
  const prof = 2;
  const carMod = mod(finalScore('Carisma'));
  const conMod = mod(finalScore('Constituição'));
  const dexMod = mod(finalScore('Destreza'));
  const hp = 8 + conMod;
  const ac = 11 + dexMod;
  const dc = 8 + prof + carMod;
  const atkMagic = prof + carMod;
  const remaining = startingGold() - spentGold();
  const purchases = Object.entries(data.shop.purchases||{}).filter(([,q])=>q>0);

  return `<h2>Ficha Concluída</h2>
  <div class="intro">Revise abaixo. Clique em "Editar" pra voltar e mudar qualquer escolha — depois é só confirmar pra voltar aqui direto.</div>

  <div class="summary-section"><h3>Identidade <button class="edit-link" onclick="editSection(0)">Editar</button></h3>
  <div class="content">${data.classe} 1 · ${data.especie}${data.especie==='Tiferino' ? ` (${t.tamanho}, Legado ${t.legado})` : ''}${data.especie==='Aasimar' ? ` (${data.aasimar.tamanho})` : ''} · Antecedente ${data.antecedente}</div></div>

  <div class="summary-section"><h3>Atributos <button class="edit-link" onclick="editSection(6)">Editar</button></h3>
  <div class="content">${ABILITIES.map(a=>`<span class="pill-static">${a} ${finalScore(a)} (${fmt(mod(finalScore(a)))})</span>`).join('')}</div></div>

  <div class="summary-section"><h3>Combate</h3>
  <div class="content">PV: ${hp} (1d8) · CA: ${ac} (Couro + Destreza) · CD de Magia: ${dc} · Ataque Mágico: ${fmt(atkMagic)}</div></div>

  <div class="summary-section"><h3>Perícias <button class="edit-link" onclick="editSection(5)">Editar</button></h3>
  <div class="content">${b.skills.map(s=>`<span class="pill-static">${s}</span>`).join('')}${bgConst.skills.map(s=>`<span class="pill-static">${s}</span>`).join('')}</div></div>

  <div class="summary-section"><h3>Vínculo de Pacto, Truques e Magias <button class="edit-link" onclick="editSection(5)">Editar</button></h3>
  <div class="content">
    <b>${b.pactBoon}</b><br>
    Truques: ${[...b.cantrips, ...b.tomoCantrips].map(s=>`<span class="pill-static">${s}</span>`).join('')}${speciesGrantedCantrips().map(s=>`<span class="pill-static" title="Concedido pela espécie, não conta nas 2 da classe">${s} (espécie)</span>`).join('')}<br>
    Magias: ${[...b.spells1, ...b.tomoRituals.map(r=>r+' (ritual)')].map(s=>`<span class="pill-static">${s}</span>`).join('')}
  </div></div>

  <div class="summary-section"><h3>Talento — Habilidoso <button class="edit-link" onclick="editSection(3)">Editar</button></h3>
  <div class="content">${bg.habilidoso.map(s=>`<span class="pill-static">${s}</span>`).join('')}</div></div>

  <div class="summary-section"><h3>Equipamento Inicial <button class="edit-link" onclick="editSection(3)">Editar</button></h3>
  <div class="content">
    ${(b.equipment==='A'?BRUXO.equipmentA:[BRUXO.equipmentB_gold+' PO']).map(s=>`<span class="pill-static">${s}</span>`).join('')}
    ${(bg.equipment==='A'?[...bgEquipA, bgConst.equipmentA_gold+' PO']:[bgConst.equipmentB_gold+' PO']).map(s=>`<span class="pill-static">${s}</span>`).join('')}
  </div></div>

  <div class="summary-section"><h3>Compras na Loja <button class="edit-link" onclick="editSection(7)">Editar</button></h3>
  <div class="content">
    ${purchases.length ? purchases.map(([n,q])=>`<span class="pill-static">${n} ×${q}</span>`).join('') : '<span style="color:var(--parchment-dim);">Nenhuma compra.</span>'}
    <div style="margin-top:8px;font-family:'Cinzel',serif;color:var(--gold);">Dinheiro restante: ${fmtGold(remaining)} PO</div>
  </div></div>

  <div class="nav">
    <button class="btn" onclick="back()">← Voltar</button>
    <button class="btn primary" onclick="resetWizard()">Criar Outro Personagem</button>
  </div>`;
}

function resetWizard(){
  if(!confirm('Isso apaga o personagem atual e começa do zero. Continuar?')) return;
  step = 0;
  data = { especie:null, antecedente:null, classe:null,
    tiefling:{tamanho:null,legado:null,atributoLegado:null},
    pequenino:{},
    charlatao:{abilityPlan:null,equipment:null,habilidoso:[]},
    nobre:{abilityPlan:null,equipment:null,habilidoso:[],kitJogos:null},
    bruxo:{skills:[],pactBoon:null,cantrips:[],tomoCantrips:[],spells1:[],tomoRituals:[],equipment:null},
    attrs:{}, shop:{purchases:{}}, returnToSummary:false };
  persist(); render();
}

function attachStepHandlers(){
  document.querySelectorAll('[data-fn]').forEach(el=>{
    if(el.tagName==='INPUT'){
      el.addEventListener('input', ()=>{
        const item = el.getAttribute('data-item');
        let v = parseInt(el.value)||0;
        if(v<0) v=0;
        shopSetQty(item, v);
      });
    } else {
      el.addEventListener('click', ()=>{
        const fn = el.getAttribute('data-fn');
        const val = el.getAttribute('data-pick');
        window[fn](val);
      });
    }
  });
}

function pickSpecies(v){ data.especie=v; persist(); render(); }
function pickBackground(v){ data.antecedente=v; persist(); render(); }
function pickClass(v){ data.classe=v; persist(); render(); }

function pickTamanho(v){ data.tiefling.tamanho=v; persist(); render(); }
function pickTamanhoAasimar(v){ data.aasimar.tamanho=v; persist(); render(); }
function pickTamanhoHumano(v){ data.humano.tamanho=v; persist(); render(); }
function pickHumanoPericia(v){ data.humano.pericia=v; persist(); render(); }
function pickHumanoTalento(v){ data.humano.talento=v; persist(); render(); }
function pickHerancaDraconica(v){ data.draconato.heranca=v; persist(); render(); }
function pickElfoPericia(v){ data.elfo.pericia=v; persist(); render(); }
function pickLinhagemElfica(v){ data.elfo.linhagem=v; persist(); render(); }
function pickLegado(v){
  data.tiefling.legado=v;
  const opt = TIEFLING.subespecie.opcoes.find(o=>o.nome===v);
  const grantedItem = opt && opt.nivel1.concede && opt.nivel1.concede[0];
  const granted = grantedItem && grantedItem.nome;
  if(granted){
    // Remove o truque da lista da classe/Tomo se já tinha sido escolhido antes
    // de mudar de legado — senão sobra uma escolha redundante sem efeito.
    data.bruxo.cantrips = data.bruxo.cantrips.filter(c=>c!==granted);
    data.bruxo.tomoCantrips = data.bruxo.tomoCantrips.filter(c=>c!==granted);
  }
  persist(); render();
}
function pickAtributoLegado(v){ data.tiefling.atributoLegado=v; persist(); render(); }

function toggleBruxoSkill(v){ const s=data.bruxo.skills; const i=s.indexOf(v); if(i>=0)s.splice(i,1); else if(s.length<2)s.push(v); persist(); render(); }
function pickPactBoon(v){ data.bruxo.pactBoon=v; if(v!=='Pacto do Tomo'){data.bruxo.tomoCantrips=[];data.bruxo.tomoRituals=[];} persist(); render(); }
function toggleCantrip(v){ const s=data.bruxo.cantrips; const i=s.indexOf(v); if(i>=0)s.splice(i,1); else if(s.length<2)s.push(v); persist(); render(); }
function toggleTomoCantrip(v){ const s=data.bruxo.tomoCantrips; const i=s.indexOf(v); if(i>=0)s.splice(i,1); else if(s.length<3)s.push(v); persist(); render(); }
function toggleSpell1(v){ const s=data.bruxo.spells1; const i=s.indexOf(v); if(i>=0)s.splice(i,1); else if(s.length<2)s.push(v); persist(); render(); }
function toggleTomoRitual(v){ const s=data.bruxo.tomoRituals; const i=s.indexOf(v); if(i>=0)s.splice(i,1); else if(s.length<2)s.push(v); persist(); render(); }
function pickBruxoEquip(v){ data.bruxo.equipment=v; persist(); render(); }

/* Retorna o(s) truque(s) que a ESPÉCIE já concede de graça (ex: Legado Ínfero
   do Tiferino), pra excluir da lista de truques da classe — senão a pessoa
   podia "escolher" de novo um truque que já tem e não ganhar nada com isso
   (ou pior, a lista deixava parecer que ele nem foi concedido). Retorna
   sempre um array (vazio se a espécie não concede nenhum). */
function speciesGrantedCantrips(){
  if(data.especie==='Tiferino' && data.tiefling.legado){
    const opt = TIEFLING.subespecie.opcoes.find(o=>o.nome===data.tiefling.legado);
    const item = opt && opt.nivel1.concede && opt.nivel1.concede[0];
    if(item) return [item.nome];
  }
  return [];
}

/* Retorna o objeto de dados do antecedente ativo (data.charlatao, data.nobre,
   etc.) — os handlers abaixo (plano de atributos, Habilidoso, equipamento)
   são compartilhados entre antecedentes que usam essa mesma estrutura. */
function activeBgData(){
  if(data.antecedente==='Nobre') return data.nobre;
  return data.charlatao;
}

function pickAbilityPlanType(v){ activeBgData().abilityPlan = v==='1-1-1' ? {type:'1-1-1', plusOnes:[]} : {type:'2-1', plus2:null, plus1:null}; persist(); render(); }
function pickPlusOneOf3(v){
  const plan = activeBgData().abilityPlan;
  if(!plan.plusOnes) plan.plusOnes=[];
  const i = plan.plusOnes.indexOf(v);
  if(i>=0) plan.plusOnes.splice(i,1); else if(plan.plusOnes.length<3) plan.plusOnes.push(v);
  persist(); render();
}
function pickPlus2(v){ const bg=activeBgData(); bg.abilityPlan.plus2=v; if(bg.abilityPlan.plus1===v) bg.abilityPlan.plus1=null; persist(); render(); }
function pickPlus1(v){ activeBgData().abilityPlan.plus1=v; persist(); render(); }
function pickBgEquip(v){ activeBgData().equipment=v; persist(); render(); }
function toggleHabilidoso(v){ const s=activeBgData().habilidoso; const i=s.indexOf(v); if(i>=0)s.splice(i,1); else if(s.length<3)s.push(v); persist(); render(); }
function pickKitJogos(v){ data.nobre.kitJogos=v; persist(); render(); }


function setAttr(ability, value){
  if(value===''){
    delete data.attrs[ability];
  } else {
    const v = parseInt(value);
    // se outro atributo já tem esse valor, tira de lá (rouba/troca) antes de atribuir aqui
    for(const other of ABILITIES){
      if(other!==ability && data.attrs[other]===v){
        delete data.attrs[other];
        break;
      }
    }
    data.attrs[ability] = v;
  }
  persist(); render();
}

/* Quantidade máxima que dá pra comprar de um item sem estourar o ouro
   disponível, considerando o que já tá no carrinho pros OUTROS itens. */
function maxAffordableQty(name){
  const item = findShopItem(name);
  if(!item) return 0;
  if(item.c<=0) return 999; // item de custo 0, sem limite prático
  const purchases = data.shop.purchases||{};
  let othersCost = 0;
  for(const [n,q] of Object.entries(purchases)){
    if(n===name) continue;
    const it = findShopItem(n);
    if(it) othersCost += it.c*q;
  }
  const budget = startingGold() - othersCost;
  if(budget<=0) return 0;
  return Math.floor((budget / item.c) + 1e-9); // epsilon evita erro de ponto flutuante
}

function shopSetQty(name, qty){
  if(!data.shop.purchases) data.shop.purchases={};
  if(qty<0) qty=0;
  const maxQty = maxAffordableQty(name);
  if(qty>maxQty) qty=maxQty;
  if(qty<=0) delete data.shop.purchases[name];
  else data.shop.purchases[name]=qty;
  persist(); render();
}
function shopInc(name){ shopSetQty(name, (data.shop.purchases[name]||0)+1); }
function shopDec(name){ shopSetQty(name, Math.max(0,(data.shop.purchases[name]||0)-1)); }

async function init(){
  await restore();
  render();
}
init();
</script>
</body>
</html>
