/* ==========================================================================
   NOTA PARA A PRÓXIMA INSTÂNCIA DO CLAUDE — leia antes de editar este arquivo
   ==========================================================================
   Este é um assistente de criação de personagem D&D 2024 (estilo Roll20):
   passo a passo, só libera "Avançar" quando a etapa está completa, com foco
   automático (scroll + destaque) na primeira seleção faltante.

   ESCOPO ATUAL (funcionando): Bruxo, Bárbaro, Bardo, Mago, Paladino,
   Psiônico, Clérigo, Guerreiro e Ladino (nível 1 apenas), todas as 10
   espécies do PHB 2024, os 16 antecedentes do PHB 2024. FALTAM do PHB:
   Druida, Feiticeiro, Guardião, Monge. Todas já mapeadas na planilha
   classes_phb2024.xlsx.

   ✅ LADINO (nível 1) — CONCLUÍDO. Dados em data/classes/ladino.js.
   Particularidades:
   - PRIMEIRA classe com proficiência de arma FILTRADA por propriedade,
     não só por categoria: Simples (todas) + Marciais que tenham Acuidade
     OU Leve. Isso motivou adicionar um campo novo "propriedades" (array)
     em CADA arma de WEAPON_MASTERY (data/weapon-mastery.js) — reaproveitei
     os dados que já tinha extraído pra planilha classes_phb2024.xlsx (aba
     Maestria — Armas) em vez de reabrir o PDF. A lista de Maestria em
     Arma do Ladino já usa esse filtro de verdade
     (categoria==='Simples' || propriedades.includes('Acuidade'|'Leve')).
     Monge também tem esse tipo de filtro (só Leve) — quando entrar, dá
     pra reusar o mesmo campo "propriedades".
   - CONFERIDO no PDF: Maestria em Arma do Ladino (2 armas) também NÃO se
     restringe a Corpo a Corpo, mesma regra de Paladino/Guerreiro.
   - Especialista (escolha 2 perícias já proficientes) só pode escolher
     entre perícias que o personagem JÁ tem (classe + antecedente +
     Habilidoso) — toggleLadinoSkill() faz cascade removendo do
     Especialista se a perícia de classe for desmarcada depois.
   - PENDÊNCIA REGISTRADA A PEDIDO DO USUÁRIO: Gíria do Ladrão concede
     Gíria dos Ladrões + 1 idioma à escolha, mas o app AINDA NÃO TEM
     nenhum seletor de idiomas (não existe ALL_LANGUAGES nem nada
     parecido). Ficou como texto informativo/placeholder — mesma decisão
     já tomada pros instrumentos musicais do Bardo. Ao revisar isso,
     CONFERIR O LIVRO DO JOGADOR (capítulo 2, tabelas de idiomas) antes
     de codar a lista, não usar de memória. Essa pendência + a dos
     instrumentos do Bardo deviam ser resolvidas juntas numa leva própria
     de "escolhas de idioma/ferramenta" quando o usuário pedir.
   - CA não precisou do tratamento "não calculada automaticamente" (ao
     contrário de Paladino/Clérigo/Guerreiro) — o equipamento padrão do
     Ladino é Armadura de Couro, então a fórmula simplificada de Couro +
     Destreza que já existia serve normalmente.

   ✅ GUERREIRO (nível 1) — CONCLUÍDO. Dados em data/classes/guerreiro.js.
   Duas particularidades novas:
   - PRIMEIRA classe com TRÊS opções de equipamento inicial (A/B/C), não
     só A/B. Schema mudou: equipmentB agora é lista de itens (igual A) +
     equipmentB_gold (sobra), e equipmentC_gold é a opção só-em-ouro (que
     nas outras classes era equipmentB_gold). startingGold() e o bloco de
     equipamento do renderSummary() foram generalizados pra checar 'C'
     também — como nenhuma outra classe tem equipmentC_gold definido,
     isso não afeta nada que já existia.
   - Estilo de Luta (escolha 1 talento entre 10) é um sub-sistema
     transversal (CONFIRMADO: outras classes também concedem Estilo de
     Luta — Paladino no nível 2, por exemplo), mas por enquanto os dados
     estão só dentro de GUERREIRO.estiloDeLuta, extraídos da aba
     "Talentos" da planilha de magias (coluna Categoria="Estilo de Luta").
     Se uma 2ª classe também conceder Estilo de Luta nível 1 (nenhuma
     tem, é sempre nível 2+ nas outras), vale extrair pra um arquivo
     separado tipo data/fighting-styles.js, no mesmo espírito do
     weapon-mastery.js.
   - Maestria em Arma do Guerreiro tem 3 armas (não 2) e, CONFERIDO no PDF
     (pág. 126), também não se restringe a Corpo a Corpo — mesma regra do
     Paladino, diferente do Bárbaro. Já são 2 classes "sem restrição" e 1
     "com restrição" (Bárbaro) — continuar conferindo caso a caso pras que
     faltam (Guardião, Ladino também têm Maestria em Arma nível 1).
   - CA não calculada automaticamente (mesmo tratamento de Paladino/
     Clérigo — Opção A vem com Cota de Malha). Já são 3 classes com esse
     tratamento — Guardião é a 4ª que provavelmente vai precisar (tem
     Escudo), pode valer a pena generalizar numa função só nessa hora.

   ✅ CLÉRIGO (nível 1) — CONCLUÍDO. Dados em data/classes/clerigo.js.
   Particularidade nova: Ordem Divina (Protetor ou Taumaturgo) é uma
   escolha nível 1 que MUDA a contagem de truques disponíveis —
   Taumaturgo dá +1 truque. clerigoEffectiveCantripsCount() calcula esse
   total dinâmico (CLERIGO.cantripsCount + 1 se Taumaturgo) e é usado
   tanto no render quanto em canAdvance/findFirstMissingGroup.
   pickClerigoOrdem() faz cascade: se o jogador trocar de Taumaturgo pra
   Protetor depois de já ter escolhido 4 truques, corta a lista pra 3
   automaticamente (mesmo espírito do cascade do Livro de Magias do Mago,
   adaptado pra um caso de "diminuir o teto", não "remover item
   específico").
   - CA do Clérigo, assim como a do Paladino, NÃO é calculada
     automaticamente (equipamento A vem com Cota de Malha Parcial +
     Escudo, não dá pra usar a fórmula simplificada de couro/sem-armadura
     sem arriscar número errado). Já são 2 classes com esse tratamento —
     se entrar uma 3ª (Guardião tem Escudo também), vale considerar migrar
     pra uma função de CA compartilhada em vez de repetir o texto.
   - Atributo de conjuração é Sabedoria (variável wisMod nova em
     renderSummary, ao lado de carMod/intMod).

   ✅ PSIÔNICO (nível 1) — CONCLUÍDO. Dados em data/classes/psionico.js.
   NÃO é conteúdo oficial do PHB — é Unearthed Arcana 2025 (playtest,
   tradução do Canal do Condado), registrado como tal no CLASS_INFO
   (campo "Fonte" extra nos fields, algo que nenhuma outra classe tem).
   Mesmo formato do Bardo (2 truques + 4 magias preparadas, sem livro
   separado como o Mago) — Poder Psiônico (Dados de Energia Psiônica,
   Impulso Telecinético, Conexão Telepática) e Telecinese Sutil (Mão
   Mágica grátis) são só texto informativo, sem escolha nível 1.
   - CORREÇÃO (feita depois da primeira versão): os nomes de truques/
     magias inicialmente vieram direto do texto do PDF do UA, mas a
     tradução do UA diverge da planilha oficial de magias em pelo menos 3
     casos ("Amizade"→"Amigos", "Prestidigitação"→"Prestidigitação
     Arcana", "Sifão de Vida"→"Sifão Vital" — mesma magia, nome
     diferente). Já corrigido em data/classes/psionico.js, com nota lá
     explicando. Ao usar qualquer nome de magia vindo do PDF do UA de
     novo, MELHOR conferir contra a coluna "Psiônico" da planilha de
     magias antes de usar o texto do UA direto — a planilha já cobre
     "PHB 2024 + UA Psion" no nome, é a fonte de nomes oficiais.
   - 🔜 PENDÊNCIA (não urgente, não afeta o fluxo básico de criação):
     o UA também tem "Talentos de Talento Selvagem" (Wild Talent feats —
     Atmocinese, Biocinese, Clarividência, Criocinese, Empata, Modelador
     de Carne, Sussurrador Mental, Trapaceiro Psiônico, Psicinético,
     Pirocinese) que ainda NÃO estão implementados em lugar nenhum do
     app — nem como talento de antecedente (Nobre/Sábio podem trocar o
     talento de origem por um desses) nem como opção de talento genérico.
     Isso só importa quando a gente for mexer em talentos/antecedentes de
     novo, não trava a criação de personagem Psiônico hoje. Revisar
     nessa hora — não é sobre magias, é sobre feats.

   ✅ PALADINO (nível 1) — CONCLUÍDO. Dados em data/classes/paladino.js.
   Particularidades:
   - Maestria em Arma do Paladino NÃO se restringe a "Corpo a Corpo" (só
     exige proficiência) — diferente do Bárbaro. CONFERIDO NO PDF antes de
     assumir isso (pág. 167), porque o texto do livro só dizia "com as
     quais você tem proficiência", sem repetir a restrição que o Bárbaro
     tem. Guardião/Guerreiro/Ladino também têm Maestria em Arma — checar a
     redação exata de cada um antes de reusar a suposição de um ou outro
     (não assumir que todos seguem o mesmo padrão do Bárbaro OU do
     Paladino sem conferir).
   - Sem truques no nível 1 (só magias preparadas, 2 de uma lista de 16 —
     extraída da planilha de magias, coluna "Paladino").
   - Mãos Consagradas é só texto informativo (baseado no nível, sem
     escolha do jogador).
   - CA do Paladino no resumo NÃO é calculada automaticamente (fica só um
     texto "depende da armadura equipada") — diferente de Bárbaro/Mago/
     Bruxo/Bardo, que assumem sempre o cenário sem-armadura ou com a
     armadura padrão do equipamento A. Como o Paladino tem armadura Pesada
     na Opção A (Cota de Malha) e isso muda MUITO a CA (fixa, sem Destreza,
     ainda por cima com requisito de Força), não dava pra usar a mesma
     fórmula simplificada sem arriscar mostrar um número errado.

   ✅ PENDÊNCIA RESOLVIDA (perícias agrupadas por atributo): as escolhas
   de perícias das 5 classes (Bruxo, Bárbaro, Bardo, Mago, Paladino) agora
   usam groupedChoiceList(skillGroupsByAbility(pool), ...) — mesmo padrão
   já usado no Hábil (Humano) e Habilidoso (antecedentes), agrupado por
   atributo em vez de lista chapada. O usuário reparou que o Bardo tinha
   ficado diferente do resto (a pendência já estava anotada aqui desde a
   migração do Bruxo, mas só foi resolvida agora que tínhamos 5 classes
   pra padronizar de uma vez). O resumo final (renderSummary) CONTINUA
   com lista chapada de perícias — isso é intencional/consistente com o
   resto do app (Habilidoso também mostra flat no resumo, só o PICKER
   agrupa), não confundir com pendência de novo.

   ✅ MAGO (nível 1) — CONCLUÍDO. Dados em data/classes/mago.js. Única
   classe até agora com DOIS níveis de escolha de magia: primeiro o Livro
   de Magias (6 magias de 1º círculo — "estoque" conhecido), depois as
   Magias Preparadas (4, subconjunto do livro). toggleMagoSpellbook()
   remove em cascata da lista de Preparadas se uma magia sair do livro.
   Truques/magias extraídos da planilha de magias (coluna "Mago"), não do
   PDF. Adepto de Ritual e Recuperação Arcana são só texto informativo
   (sem escolha nível 1). Sem armadura (MAGO.armorProf = []) — o filtro de
   SHOP já lida bem com array vazio (nunca dá match, categoria de
   armadura simplesmente não aparece pro Mago).
   - renderSummary() agora calcula o atributo de conjuração por classe
     (spellMod: Inteligência pro Mago, Carisma pra Bruxo/Bardo) em vez de
     fixar Carisma — importante lembrar disso quando entrar Clérigo/
     Druida/Guardião (Sabedoria) ou Guerreiro com truques via talento.

   ✅ BARDO (nível 1) — CONCLUÍDO. Dados em data/classes/bardo.js.
   Particularidades registradas:
   - Perícias: Bardo escolhe 3 QUAISQUER, sem lista restrita (BARDO.skillsAll
     = true, BARDO.skillsCount = 3). renderBardoDetail() usa ALL_SKILLS
     (data/skills.js) direto em vez de um pool fixo tipo BARBARO.skills —
     por isso data/classes/bardo.js foi carregado DEPOIS de
     data/skills.js no <script>, mas mesmo se a ordem mudasse funcionaria
     igual, já que ALL_SKILLS só é lido dentro do corpo da função de
     render (chamada bem depois de todo script já ter carregado), nunca
     no top-level do bardo.js.
   - Truques/magias de 1º círculo: extraídos da planilha
     D_D_5_5_-_Magias_e_Talentos.xlsx (coluna "Bardo"=Sim), NÃO do PDF —
     13 truques, 23 magias de 1º círculo.
   - Ferramentas (Instrumento Musical ×3): registrado só como texto
     informativo (BARDO.toolsNote), SEM seletor de instrumentos
     específicos ainda — decisão combinada com o usuário, mesma pendência
     que já existia no antecedente Artista (e existirá em Guarda/Soldado
     quando entrarem). Revisar tudo isso junto numa leva própria de
     "ferramentas de verdade" quando o usuário pedir.
   - Inspiração de Bardo não tem escolha do jogador no nível 1 (é sempre
     concedida) — só texto informativo, igual Fúria/Defesa sem Armadura
     do Bárbaro.

   ✅ BÁRBARO (nível 1) — CONCLUÍDO. Dados em data/classes/barbaro.js
   (BARBARO const). Maestria em Arma (transversal, também usada por
   Paladino/Guardião/Guerreiro/Ladino quando entrarem) ficou em
   data/weapon-mastery.js (MASTERY_PROPERTIES + WEAPON_MASTERY). Fúria e
   Defesa sem Armadura não têm escolha do jogador nível 1, então aparecem
   só como texto informativo em renderBarbaroDetail() (sem grp- id, não
   entram em canAdvance/findFirstMissingGroup). Maestria em Arma tem
   escolha (2 armas Corpo a Corpo, Simples ou Marcial) — a lista mostra
   TODAS as armas Corpo a Corpo de WEAPON_MASTERY, mesmo as Marciais que
   ainda não estão no SHOP (ver PENDÊNCIA do SHOP mais abaixo), com aviso
   na tela sobre isso.
   - Classe do Bruxo, weaponProf/armorProf agora são ARRAY em vez de
     string (BRUXO.weaponProf era "simples", virou ["simples"]) — decisão
     combinada com o usuário quando o Bárbaro entrou, porque cada classe
     pode ter mais de uma categoria de arma/armadura (Bárbaro tem Simples+
     Marcial, Leve+Média+Escudo). renderShop() usa .includes() nesse array
     via activeClassConst(), não mais comparação direta de string.
   - equipmentA_gold também é campo novo em ambos os CONST de classe
     (antes o "15 PO" do Bruxo tava hardcoded dentro do array equipmentA
     como string solta — foi extraído pra campo próprio, mesmo padrão que
     os antecedentes já usavam com bgConst.equipmentA_gold).

   ✅ ETAPA 2 (generalizar) — CONCLUÍDA junto com o Bárbaro: CLASS_DATA_KEY
   (nome->chave em `data`, ex. "Bárbaro"->"barbaro") e CLASS_CONST
   (nome->objeto de dados fixos, ex. "Bárbaro"->BARBARO), com
   activeClassData()/activeClassConst() — mesmo padrão do
   BACKGROUND_DATA_KEY/BACKGROUND_CONST. Usados em startingGold(),
   renderShop() e renderSummary(). IMPORTANTE: render()/canAdvance()/
   findFirstMissingGroup() do PASSO 1 (detalhe da classe) continuam
   ramificando por if/else de nome de classe (`data.classe==='Bárbaro' ?
   ... : ...`), NÃO viraram um mapa de funções — isso foi decisão
   consciente, não descuido: com só 2 classes de nível 1 muito diferentes
   entre si (uma conjuradora com pactos, outra marcial com Fúria/Maestria)
   ainda não dá pra ver um padrão comum o suficiente pra generalizar sem
   forçar. Mesmo estilo que já era usado no passo 5 (detalhe da espécie,
   também se ramifica por if/else). Reavaliar quando tivermos 3-4 classes
   nível 1 prontas — pode ser que dê pra extrair um "renderClassChoiceList"
   genérico pra perícias e outro pra equipamento A/B, já que essas duas
   partes SÃO idênticas em formato entre Bruxo e Bárbaro.
   - LIÇÃO APRENDIDA (antecedentes, ainda válida): não gaste tempo
     pesquisando no PDF de 397 páginas se já existir um arquivo
     estruturado (planilha, .js, etc) anexado na conversa com os mesmos
     dados prontos.

   🔜 PENDÊNCIA DO SHOP (registrada, não é bug, é escopo adiado com o
   usuário): SHOP só tem Armas Simples e Armadura Leve. Bárbaro (e toda
   futura classe marcial) tem proficiência com Armas Marciais e Armadura
   Média/Escudo/Pesada que não aparecem pra comprar — só dá pra pegar via
   equipamento inicial fixo (opção A). Expandir SHOP com Armas Marciais +
   Armadura Média/Pesada + Escudos fica pra quando o usuário pedir
   explicitamente (ele já disse "resolvemos loja depois" duas vezes).
   - Quando houver 2+ classes, generalizar render()/canAdvance()/
     findFirstMissingGroup() pra classe do mesmo jeito que já foi feito pra
     antecedente: um CLASS_DATA_KEY / CLASS_CONST mapeando nome->chave em
     `data` e nome->objeto de dados fixos, ativado por algo tipo
     activeClassData()/activeClassConst(), em vez de if/else hardcoded
     "data.classe==='Bruxo' ? ...". Aprendemos isso do jeito difícil com
     Charlatão/Nobre — comece já generalizado dessa vez, não espere ter 13
     classes pra perceber que precisa generalizar.

   PENDÊNCIA CONHECIDA (não é sobre classes, mas fica registrada pra não
   esquecer): resetWizard() ("Criar Outro Personagem") só zera
   data.tiefling/data.pequenino entre as espécies — as outras 8 (anao, orc,
   humano, draconato, elfo, gnomo, golias, aasimar) não são resetadas.
   Resolver quando for a vez de revisar espécies de novo, ou aproveitar
   quando mexer no resetWizard() pra classes (mesmo tipo de bug pode já
   nascer ali se não for generalizado desde o início).

   NOTA SOBRE PEQUENINO (Halfling): diferente do Tiferino, essa espécie NÃO
   tem nenhuma escolha própria no PHB 2024 (sem subraça, sem legado, sem
   atributo de conjuração) — todos os traços são fixos (Corajoso, Agilidade
   Pequenina, Sorte, Furtividade Natural). Por isso o step 1 pra essa espécie
   é só informativo e canAdvance()/findFirstMissingGroup() retornam sempre
   liberado quando data.especie==='Pequenino'. Serve de modelo pra outras
   espécies "simples" (Humano, Anão, Elfo, Gnomo, Orc também têm poucas ou
   nenhuma escolha — só Aasimar e Draconato têm escolhas parecidas com o
   legado do Tiferino).

   O usuário provavelmente vai subir de novo, neste novo chat:
   1. O PDF do Livro do Jogador D&D 5e 2024
   2. A planilha "Magias_PHB2024_Completo.xlsx" (abas "Magias PHB 2024 + UA
      Psion" e "Talentos") — já tem TODAS as magias/truques/talentos do
      livro condensados (efeito + escalonamento em português, parafraseado,
      não copiado cru do livro). É a fonte mais rápida pra alimentar
      SPELL_DETAILS de qualquer classe nova.
   3. (Só se for mexer em Psiônico) o PDF do Unearthed Arcana Psiônico 2025

   ONDE MEXER PRA ADICIONAR CONTEÚDO NOVO:
   - Antes de ir atrás no PDF: tem um índice de páginas (por classe/espécie/
     antecedente/talentos) logo depois da declaração de CLASSES/SPECIES/
     BACKGROUNDS, uns 70 linhas abaixo desta nota. Confere ali primeiro.
   - CLASSES / SPECIES / BACKGROUNDS: arrays com os nomes oficiais (12/10/16).
     ENABLED_CLASSES / ENABLED_SPECIES / ENABLED_BACKGROUNDS controlam o que
     já é clicável na tela de seleção (resto fica cinza, "em breve").
   - Nova classe: criar objeto tipo BRUXO (skills, cantrips, spells1,
     equipmentA/B, weaponProf, armorProf...) + função renderXDetail() +
     handlers de toggle, no mesmo padrão do Bruxo. Adicionar entrada em
     CLASS_INFO (descrição + Atributo Principal + Dado de Vida + Complexidade
     — tirado da tabela "Visão Geral das Classes", página 33 do livro).
   - Nova espécie: objeto tipo TIEFLING com os traços/escolhas próprias.
   - Novo antecedente: objeto tipo CHARLATAO + entrada em BACKGROUND_INFO
     (nome do talento + descrição curta do QUE O TALENTO FAZ, não da
     "personalidade" do antecedente + perícias/ferramenta).
   - SPELL_DETAILS: nome -> {tempo, alcance, componentes, duracao, efeito,
     escalonamento}. Usado pelo botão "ⓘ" (spellChoiceList) nas listas de
     magia/truque. Puxar direto da planilha, mesmo texto já condensado.
   - SHOP: itens da loja final, filtrados por proficiência (campo filterProf
     bate com weaponProf/armorProf da classe). Kits com múltiplos itens usam
     o campo "cont" pra listar o conteúdo (evita duplicar comprando 2 kits
     parecidos, tipo Aventureiro + Explorador de Masmorras).
   - Ordem das etapas (mudar com cuidado, tudo sincronizado):

     -> 4 Espécie -> 5 detalhe espécie -> 6 Atributos -> 7 Loja -> 8 Resumo.

     bater com a ordem do livro (Classe->Antecedente->Espécie) — o motivo é
     evitar duplicação de perícias/talentos/proficiências entre as 3 etapas
     (o livro assume que você já sabe a classe e o antecedente antes de
     escolher a espécie, pra não repetir escolha de algo que a espécie
     também poderia dar). Os grupos de campo (id="grp-N-nome") também foram
     renumerados nessa troca: prefixo grp-0- e grp-1- agora são da Classe,
     e prefixo grp-4- e grp-5- agora são da Espécie (Antecedente ficou nos
     prefixos grp-2- e grp-3-, não mudou de posição). Se adicionar/mudar
     etapa, atualizar

     (os 3 têm um switch/case por step).

     pra permitir o scroll+destaque automático. Grupo novo = id novo.
   - editSection(idx) / returnToSummary: sistema de "editar e voltar pro
     resumo" (usado nos links "Editar" da tela final).
   - ALL_SKILLS / ALL_TOOLS: catálogo oficial de perícias e FERRAMENTAS DE
     VERDADE (as que têm ficha de Atributo+Usar Objeto no livro). Cuidado:
     "Kit de Aventureiro", "Kit de Diplomata" etc. NÃO são ferramentas, são
     só pacotes de equipamento — não confundir na hora de montar talentos
     tipo Habilidoso pra outros antecedentes.

let saveTimer;
function persist(){
  clearTimeout(saveTimer);
  document.getElementById('saveText').textContent = 'salvando…';
  document.getElementById('saveDot').style.opacity='1';
  saveTimer = setTimeout(async ()=>{
    try{
      await window.storage.set('char_wizard_state', JSON.stringify({step, data}));
      document.getElementById('saveText').textContent='salvo';
      document.getElementById('saveDot').style.opacity='0.3';
    }catch(e){
      document.getElementById('saveText').textContent='—';
    }
  }, 400);
}
async function restore(){
  try{
    const r = await window.storage.get('char_wizard_state');
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      step = parsed.step || 0;
      data = Object.assign(data, parsed.data);
      if(!data.shop) data.shop = {purchases:{}};
      if(!data.pequenino) data.pequenino = {};
      if(!data.aasimar) data.aasimar = { tamanho: null };
      if(!data.anao) data.anao = {};
      if(!data.orc) data.orc = {};
      if(!data.humano) data.humano = { tamanho: null, pericia: null, talento: null };
      if(!data.draconato) data.draconato = { heranca: null };
      if(!data.elfo) data.elfo = { pericia: null, linhagem: null };
      if(!data.gnomo) data.gnomo = { linhagem: null, atributoLinhagem: null };
      if(!data.golias) data.golias = { ancestralidade: null };
      /* Antecedentes: garante que TODA chave de BACKGROUND_DATA_KEY exista
         em data (evita crash se um save antigo do navegador não tiver o
         antecedente mais recente que a gente adicionou depois). */
      Object.values(BACKGROUND_DATA_KEY).forEach(key=>{
        if(!data[key]) data[key] = { abilityPlan: null, equipment: null, habilidoso: [], ferramentaEscolhida: null, iniciadoCantrips: [], iniciadoSpell1: [] };
        if(!data[key].habilidoso) data[key].habilidoso = [];
        if(data[key].ferramentaEscolhida===undefined) data[key].ferramentaEscolhida = null;
        if(!data[key].iniciadoCantrips) data[key].iniciadoCantrips = [];
        if(!data[key].iniciadoSpell1) data[key].iniciadoSpell1 = [];
      });
      /* Migração de saves antigos: o Nobre usava um campo próprio kitJogos
         antes de virar o padrão genérico ferramentaEscolhida. */
      if(data.nobre.kitJogos && !data.nobre.ferramentaEscolhida){
        data.nobre.ferramentaEscolhida = data.nobre.kitJogos;
        delete data.nobre.kitJogos;
      }
      if(data.returnToSummary===undefined) data.returnToSummary = false;
      if(data.freeAbilityRule===undefined) data.freeAbilityRule = false;
    }
  }catch(e){}
}

  bar.innerHTML='';
  for(let i=0;i<TOTAL_STEPS;i++){
    const seg = document.createElement('div');
    seg.className = 'seg' + (i<step?' done':'') + (i===step?' current':'');
    bar.appendChild(seg);
  }
}
function goTo(newStep){ step = newStep; persist(); render(); }
function next(){
  const missing = findFirstMissingGroup();
  if(!missing){ goTo(step+1); return; }
  scrollToMissing(missing);
}
function back(){ if(step>0) goTo(step-1); }

function findFirstMissingGroup(){
  switch(step){
    case 0: return data.classe ? null : 'grp-0-classe';
    case 1: {
      if(data.classe==='Bárbaro'){
        const bb = data.barbaro;
        if(bb.skills.length!==2) return 'grp-1-skills';
        if(bb.maestria.length!==BARBARO.maestriaCount) return 'grp-1-maestria';
        if(!bb.equipment) return 'grp-1-equipment';
        return null;
      }
      if(data.classe==='Bardo'){
        const bd = data.bardo;
        if(bd.skills.length!==BARDO.skillsCount) return 'grp-1-skills';
        if(bd.cantrips.length!==2) return 'grp-1-cantrips';
        if(bd.spells1.length!==4) return 'grp-1-spells1';
        if(!bd.equipment) return 'grp-1-equipment';
        return null;
      }
      if(data.classe==='Mago'){
        const mg = data.mago;
        if(mg.skills.length!==2) return 'grp-1-skills';
        if(mg.cantrips.length!==MAGO.cantripsCount) return 'grp-1-cantrips';
        if(mg.spellbook.length!==MAGO.spellbookCount) return 'grp-1-spellbook';
        if(mg.prepared.length!==MAGO.preparedCount) return 'grp-1-prepared';
        if(!mg.equipment) return 'grp-1-equipment';
        return null;
      }
      if(data.classe==='Paladino'){
        const pl = data.paladino;
        if(pl.skills.length!==2) return 'grp-1-skills';
        if(pl.prepared.length!==PALADINO.preparedCount) return 'grp-1-prepared';
        if(pl.maestria.length!==PALADINO.maestriaCount) return 'grp-1-maestria';
        if(!pl.equipment) return 'grp-1-equipment';
        return null;
      }
      if(data.classe==='Psiônico'){
        const ps = data.psionico;
        if(ps.skills.length!==2) return 'grp-1-skills';
        if(ps.cantrips.length!==PSIONICO.cantripsCount) return 'grp-1-cantrips';
        if(ps.spells1.length!==PSIONICO.preparedCount) return 'grp-1-spells1';
        if(!ps.equipment) return 'grp-1-equipment';
        return null;
      }
      if(data.classe==='Clérigo'){
        const cl = data.clerigo;
        if(cl.skills.length!==2) return 'grp-1-skills';
        if(!cl.ordem) return 'grp-1-ordem';
        if(cl.cantrips.length!==clerigoEffectiveCantripsCount()) return 'grp-1-cantrips';
        if(cl.spells1.length!==CLERIGO.preparedCount) return 'grp-1-spells1';
        if(!cl.equipment) return 'grp-1-equipment';
        return null;
      }
      if(data.classe==='Guerreiro'){
        const gr = data.guerreiro;
        if(gr.skills.length!==2) return 'grp-1-skills';
        if(!gr.estilo) return 'grp-1-estilo';
        if(gr.maestria.length!==GUERREIRO.maestriaCount) return 'grp-1-maestria';
        if(!gr.equipment) return 'grp-1-equipment';
        return null;
      }
      if(data.classe==='Ladino'){
        const ld = data.ladino;
        if(ld.skills.length!==LADINO.skillsCount) return 'grp-1-skills';
        if(ld.especialista.length!==LADINO.especialistaCount) return 'grp-1-especialista';
        if(ld.maestria.length!==LADINO.maestriaCount) return 'grp-1-maestria';
        if(!ld.equipment) return 'grp-1-equipment';
        return null;
      }
      const b = data.bruxo;
      if(b.skills.length!==2) return 'grp-1-skills';
      if(!b.pactBoon) return 'grp-1-pact';
      if(b.cantrips.length!==2) return 'grp-1-cantrips';
      if(b.pactBoon==='Pacto do Tomo' && b.tomoCantrips.length!==3) return 'grp-1-tomocantrips';
      if(b.spells1.length!==2) return 'grp-1-spells1';
      if(b.pactBoon==='Pacto do Tomo' && b.tomoRituals.length!==2) return 'grp-1-tomorituals';
      if(!b.equipment) return 'grp-1-equipment';
      return null;
    }
    case 2: return data.antecedente ? null : 'grp-2-antecedente';
    case 3: {
      const bg = activeBgData();
      const plan = bg.abilityPlan;
      const planOk = plan && (plan.type==='2-1' ? (!!plan.plus2 && !!plan.plus1) : (plan.plusOnes||[]).length===3);
      if(!planOk) return 'grp-3-abilityplan';
      if(activeBgConst().ferramentaOpcoes && !bg.ferramentaEscolhida) return 'grp-3-ferramenta';
      if(activeBgConst().iniciadoEmMagia){
        if(bg.iniciadoCantrips.length!==2) return 'grp-3-iniciado-truques';
        if(bg.iniciadoSpell1.length!==1) return 'grp-3-iniciado-magia1';
      }
      if(activeBgConst().feat.startsWith('Habilidoso') && bg.habilidoso.length!==3) return 'grp-3-habilidoso';
      if(!bg.equipment) return 'grp-3-equipment';
      return null;
    }
    case 4: return data.especie ? null : 'grp-4-especie';
    case 5:
      if(data.especie==='Pequenino') return null;
      if(data.especie==='Anão') return null;
      if(data.especie==='Orc') return null;
      if(data.especie==='Humano'){
        if(!data.humano.tamanho) return 'grp-5-tamanho';
        if(!data.humano.pericia) return 'grp-5-pericia';
        if(!data.humano.talento) return 'grp-5-talento';
        return null;
      }
      if(data.especie==='Draconato') return data.draconato.heranca ? null : 'grp-5-heranca';
      if(data.especie==='Elfo'){
        if(!data.elfo.pericia) return 'grp-5-pericia';
        if(!data.elfo.linhagem) return 'grp-5-linhagem';
        return null;
      }
      if(data.especie==='Gnomo'){
        if(!data.gnomo.linhagem) return 'grp-5-linhagem';
        if(!data.gnomo.atributoLinhagem) return 'grp-5-atributo';
        return null;
      }
      if(data.especie==='Golias') return data.golias.ancestralidade ? null : 'grp-5-ancestralidade';
      if(data.especie==='Aasimar') return data.aasimar.tamanho ? null : 'grp-5-tamanho';
      if(!data.tiefling.tamanho) return 'grp-5-tamanho';
      if(!data.tiefling.legado) return 'grp-5-legado';
      if(!data.tiefling.atributoLegado) return 'grp-5-atributo';
      return null;
    case 6: {
      const missingAbility = ABILITIES.find(a=>data.attrs[a]===undefined);
      return missingAbility ? 'grp-6-attr-'+missingAbility : null;
    }
    default: return null;
  }
}

function scrollToMissing(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.classList.remove('highlight-missing');
  void el.offsetWidth; // força reflow pra reiniciar a animação se já tiver rodado
  el.classList.add('highlight-missing');
  setTimeout(()=>el.classList.remove('highlight-missing'), 1600);
}

function nav(canNext){
  const summaryBtn = data.returnToSummary ? `<button class="btn primary" onclick="returnToSummaryNow()" style="margin-left:8px;">Voltar ao Resumo ✓</button>` : '';

    <button class="btn" onclick="back()" ${step===0?'style="visibility:hidden"':''}>← Voltar</button>
    <div>
      <button class="btn primary" id="nextBtn" onclick="next()">${step===TOTAL_STEPS-1?'Concluir':'Avançar →'}</button>
      ${summaryBtn}
    </div>
  </div>`;
}
function editSection(idx){ data.returnToSummary=true; goTo(idx); }
function returnToSummaryNow(){
  const missing = findFirstMissingGroup();

  data.returnToSummary=false; goTo(8);
}

function canAdvance(){
  switch(step){
    case 0: return !!data.classe;
    case 1: {
      if(data.classe==='Bárbaro'){
        const bb = data.barbaro;
        return bb.skills.length===2 && bb.maestria.length===BARBARO.maestriaCount && !!bb.equipment;
      }
      if(data.classe==='Bardo'){
        const bd = data.bardo;
        return bd.skills.length===BARDO.skillsCount && bd.cantrips.length===2 && bd.spells1.length===4 && !!bd.equipment;
      }
      if(data.classe==='Mago'){
        const mg = data.mago;
        return mg.skills.length===2 && mg.cantrips.length===MAGO.cantripsCount && mg.spellbook.length===MAGO.spellbookCount && mg.prepared.length===MAGO.preparedCount && !!mg.equipment;
      }
      if(data.classe==='Paladino'){
        const pl = data.paladino;
        return pl.skills.length===2 && pl.prepared.length===PALADINO.preparedCount && pl.maestria.length===PALADINO.maestriaCount && !!pl.equipment;
      }
      if(data.classe==='Psiônico'){
        const ps = data.psionico;
        return ps.skills.length===2 && ps.cantrips.length===PSIONICO.cantripsCount && ps.spells1.length===PSIONICO.preparedCount && !!ps.equipment;
      }
      if(data.classe==='Clérigo'){
        const cl = data.clerigo;
        return cl.skills.length===2 && !!cl.ordem && cl.cantrips.length===clerigoEffectiveCantripsCount() && cl.spells1.length===CLERIGO.preparedCount && !!cl.equipment;
      }
      if(data.classe==='Guerreiro'){
        const gr = data.guerreiro;
        return gr.skills.length===2 && !!gr.estilo && gr.maestria.length===GUERREIRO.maestriaCount && !!gr.equipment;
      }
      if(data.classe==='Ladino'){
        const ld = data.ladino;
        return ld.skills.length===LADINO.skillsCount && ld.especialista.length===LADINO.especialistaCount && ld.maestria.length===LADINO.maestriaCount && !!ld.equipment;
      }
      const b = data.bruxo;
      return b.skills.length===2 && !!b.pactBoon &&
        b.cantrips.length===2 &&
        (b.pactBoon!=='Pacto do Tomo' || b.tomoCantrips.length===3) &&
        b.spells1.length===2 &&
        (b.pactBoon!=='Pacto do Tomo' || b.tomoRituals.length===2) &&
        !!b.equipment;
    }
    case 2: return !!data.antecedente;
    case 3: {
      const bg = activeBgData();
      const plan = bg.abilityPlan;
      const planOk = plan && (plan.type==='2-1' ? (!!plan.plus2 && !!plan.plus1) : (plan.plusOnes||[]).length===3);
      const ferramentaOk = !activeBgConst().ferramentaOpcoes || !!bg.ferramentaEscolhida;
      const iniciadoOk = !activeBgConst().iniciadoEmMagia || (bg.iniciadoCantrips.length===2 && bg.iniciadoSpell1.length===1);
      const habilidosoOk = !activeBgConst().feat.startsWith('Habilidoso') || bg.habilidoso.length===3;
      return planOk && ferramentaOk && iniciadoOk && !!bg.equipment && habilidosoOk;
    }
    case 4: return !!data.especie;
    case 5: return (data.especie==='Pequenino' || data.especie==='Anão' || data.especie==='Orc') ? true : (data.especie==='Humano' ? !!(data.humano.tamanho && data.humano.pericia && data.humano.talento) : (data.especie==='Draconato' ? !!data.draconato.heranca : (data.especie==='Elfo' ? !!(data.elfo.pericia && data.elfo.linhagem) : (data.especie==='Gnomo' ? !!(data.gnomo.linhagem && data.gnomo.atributoLinhagem) : (data.especie==='Golias' ? !!data.golias.ancestralidade : (data.especie==='Aasimar' ? !!data.aasimar.tamanho : !!(data.tiefling.tamanho && data.tiefling.legado && data.tiefling.atributoLegado)))))));
    case 6: return ABILITIES.every(a=>data.attrs[a]!==undefined);
    case 7: return true;
    case 8: return true;
    default: return false;
  }
}

function render(){
  renderProgress();
  const c = document.getElementById('cardContent');
  let html = '';
  if(step===0) html = renderClassStep();
  else if(step===1) html = (data.classe==='Bárbaro') ? renderBarbaroDetail() : (data.classe==='Bardo') ? renderBardoDetail() : (data.classe==='Mago') ? renderMagoDetail() : (data.classe==='Paladino') ? renderPaladinoDetail() : (data.classe==='Psiônico') ? renderPsionicoDetail() : (data.classe==='Clérigo') ? renderClerigoDetail() : (data.classe==='Guerreiro') ? renderGuerreiroDetail() : (data.classe==='Ladino') ? renderLadinoDetail() : renderBruxoDetail();
  else if(step===2) html = renderBackgroundStep();
  else if(step===3) html = renderSimpleBackgroundDetail(activeBgConst());
  else if(step===4) html = renderSpeciesStep();
  else if(step===5) html = (data.especie==='Pequenino') ? renderPequeninoDetail() : (data.especie==='Anão') ? renderAnaoDetail() : (data.especie==='Orc') ? renderOrcDetail() : (data.especie==='Humano') ? renderHumanoDetail() : (data.especie==='Draconato') ? renderDraconatoDetail() : (data.especie==='Elfo') ? renderElfoDetail() : (data.especie==='Gnomo') ? renderGnomoDetail() : (data.especie==='Golias') ? renderGoliasDetail() : (data.especie==='Aasimar') ? renderAasimarDetail() : renderTieflingDetail();
  else if(step===6) html = renderAttrs();
  else if(step===7) html = renderShop();
  else if(step===8) html = renderSummary();
  c.innerHTML = html;
  attachStepHandlers();
}

/* Lista de escolha de truques/magias, com botão "ⓘ" que expande um card de detalhe
   (tempo, alcance, componentes, duração, efeito, escalonamento) sem afetar a seleção. */
function spellChoiceList(items, selectedList, maxTotal, toggleFn){
  return `<div class="check-list" style="margin-bottom:6px;">${items.map(name=>{
    const sel = selectedList.includes(name);
    const disabled = !sel && selectedList.length>=maxTotal;
    const detail = SPELL_DETAILS[name];
    const isExpanded = expandedSpellInfo===name;
    return `<div class="spell-pill-wrap ${isExpanded?'expanded':''}">
      <span class="check-pill ${sel?'selected':''} ${disabled?'disabled':''}" ${disabled?'':`data-pick="${name}" data-fn="${toggleFn}"`}>${name}</span>
      ${detail?`<button class="info-btn ${isExpanded?'active':''}" data-pick="${name}" data-fn="toggleSpellInfo" title="Ver detalhes">ⓘ</button>`:''}
      ${isExpanded && detail ? renderSpellDetailCard(detail) : ''}
    </div>`;
  }).join('')}</div>`;
}

let expandedTraitInfo = null;
function toggleTraitInfo(name){
  expandedTraitInfo = (expandedTraitInfo===name) ? null : name;
  render();
}

/* Pills para itens ESPECÍFICOS concedidos de graça que existem numa lista
   nossa (magia/truque hoje — perícia/talento quando tivermos os bancos
   correspondentes). NÃO usar para o traço inteiro — só para o nome exato
   do item (ex: "Taumaturgia", "Rajada de Veneno"). O botão "ⓘ" só aparece
   se houver detalhe pra mostrar (hoje: banco de magias). */
function grantedItemList(items){
  if(!items || items.length===0) return '';
  return `<div class="check-list" style="margin:8px 0 2px;">${items.map(it=>{
    const isExpanded = expandedTraitInfo===it.nome;
    const spellDetail = SPELL_DETAILS[it.nome];
    return `<div class="spell-pill-wrap ${isExpanded?'expanded':''}">
      <span class="check-pill selected">${it.nome}</span>
      ${spellDetail?`<button class="info-btn ${isExpanded?'active':''}" data-pick="${it.nome}" data-fn="toggleTraitInfo" title="Ver detalhes">ⓘ</button>`:''}
      ${isExpanded && spellDetail ? renderSpellDetailCard(spellDetail) : ''}
    </div>`;
  }).join('')}</div>`;
}

/* Caixa de traço concedido (texto completo + pills dos itens específicos que
   ele concede, se houver). Usada tanto pros traços fixos quanto, dentro da
   escolha de subespécie, pra cada bloco de nível. */
function traitBox(nome, resumo, concede){
  return `<div class="option-block">
    <h3 style="color:var(--gold);margin-top:0;">${nome}</h3>
    ${resumo?`<p>${resumo}</p>`:''}
    ${grantedItemList(concede)}
  </div>`;
}

/* Lista de escolha ÚNICA de talento, filtrada por categoria (ex: só "Origem"
   pro Versátil do Humano), com botão "ⓘ" que mostra a ficha do banco de
   talentos (categoria, pré-requisito, benefícios, página). */
function featPickList(names, selected, pickFn){
  return `<div class="check-list" style="margin-bottom:6px;">${names.map(name=>{
    const sel = selected===name;
    const isExpanded = expandedTraitInfo===name;
    const detail = FEAT_DETAILS[name];
    return `<div class="spell-pill-wrap ${isExpanded?'expanded':''}">
      <span class="check-pill ${sel?'selected':''}" data-pick="${name}" data-fn="${pickFn}">${name}</span>
      ${detail?`<button class="info-btn ${isExpanded?'active':''}" data-pick="${name}" data-fn="toggleTraitInfo" title="Ver detalhes">ⓘ</button>`:''}
      ${isExpanded && detail ? renderFeatDetailCard(detail) : ''}
    </div>`;
  }).join('')}</div>`;
}

function choiceGrid(list, enabledList, selected, onClickName){
  return `<div class="choice-grid">${list.map(n=>{
    const enabled = enabledList.includes(n);
    const sel = selected===n;
    return `<div class="choice ${enabled?'':'disabled'} ${sel?'selected':''}" ${enabled?`data-pick="${n}" data-fn="${onClickName}"`:''}>
      ${n}${enabled?'':'<span class="note">em breve</span>'}
    </div>`;
  }).join('')}</div>`;
}

/* Renderiza uma lista de escolha (checkbox-pill) separada em mini-grupos com cabeçalho,
   pra quando o talento/recurso permite escolher entre categorias diferentes
   (ex: Atributos / Perícias / Ferramentas). Grupos vazios não aparecem. */
function groupedChoiceList(groups, selectedList, maxTotal, toggleFn){
  return groups.filter(g=>g.items.length>0).map(g=>`
    <div class="check-list" style="margin-bottom:10px; align-items:center;">
      <span class="group-label" style="margin:0 2px 0 0;">${g.label}:</span>
      ${g.items.map(item=>{
        const sel = selectedList.includes(item);
        const disabled = !sel && selectedList.length>=maxTotal;
        return `<div class="check-pill ${sel?'selected':''} ${disabled?'disabled':''}" ${disabled?'':`data-pick="${item}" data-fn="${toggleFn}"`}>${item}</div>`;
      }).join('')}
    </div>`).join('');
}

function choiceGridWithInfo(list, enabledList, selected, onClickName, infoMap){
  return `<div class="choice-grid">${list.map(n=>{
    const enabled = enabledList.includes(n);
    const sel = selected===n;
    const info = infoMap && infoMap[n];
    let infoHtml = '';
    if(info){
      const fields = [...(info.fields||[])];
      if(info.talentoNome){
        fields.unshift(["Talento", `${info.talentoNome} <i style="color:var(--parchment-dim);">(${info.talentoDesc})</i>`]);
      }
      if(info.descricao){
        infoHtml += `<span class="note" style="display:block;font-style:italic;text-align:left;margin-top:6px;">${info.descricao}</span>`;
      }
      infoHtml += `<span class="note" style="display:block;text-align:left;line-height:1.4;margin-top:6px;">
        ${fields.map(([label,val])=>`<b>${label}:</b> ${val}`).join('<br>')}
      </span>`;
    } else if(!enabled){
      infoHtml = '<span class="note">em breve</span>';
    }
    return `<div class="choice ${enabled?'':'disabled'} ${sel?'selected':''}" ${enabled?`data-pick="${n}" data-fn="${onClickName}"`:''}>
      ${n}${infoHtml}
    </div>`;
  }).join('')}</div>`;
}

/* Agrupa uma lista de perícias pelos 6 atributos (Força, Destreza, ...),
   na mesma ordem de ABILITIES. Grupos sem nenhuma perícia da lista dada
   simplesmente não aparecem — não precisa filtrar manualmente na chamada. */
function skillGroupsByAbility(skillList){
  return ABILITIES.map(ab => ({
    label: ab,
    items: skillList.filter(s => SKILL_ABILITY[s]===ab)
  }));
}

/* Igual ao groupedChoiceList, mas de escolha ÚNICA (radio, não checkbox) —
   usado quando só se pode marcar 1 item no total, como o Hábil do Humano. */
function groupedSinglePick(groups, selected, pickFn){
  return groups.filter(g=>g.items.length>0).map(g=>`
    <div class="check-list" style="margin-bottom:10px; align-items:center;">
      <span class="group-label" style="margin:0 2px 0 0;">${g.label}:</span>
      ${g.items.map(item=>`<div class="check-pill ${selected===item?'selected':''}" data-pick="${item}" data-fn="${pickFn}">${item}</div>`).join('')}
    </div>`).join('');
}

/* Mostra as opções de tamanho de uma espécie. Se só existe UMA opção, ela
   aparece já pré-selecionada e travada (mesmo padrão de "traço concedido"
   que usamos em outros lugares) — sem texto avisando que é única. Se
   existirem 2+ opções, vira a lista interativa normal. */
function tamanhoPickList(tamanho, selected, pickFn){
  if(tamanho.opcoes.length===1){
    const unica = tamanho.opcoes[0];
    return `<div class="check-list" style="margin-bottom:20px;">
      <div class="check-pill selected">${unica} <span style="opacity:0.65;font-size:0.85em;">(${tamanho.alturas[unica]})</span></div>
    </div>`;
  }
  return `<div class="check-list" style="margin-bottom:20px;">
    ${tamanho.opcoes.map(s=>`<div class="check-pill ${selected===s?'selected':''}" data-pick="${s}" data-fn="${pickFn}">${s} <span style="opacity:0.65;font-size:0.85em;">(${tamanho.alturas[s]})</span></div>`).join('')}
  </div>`;
}

/* Antecedente "genérico": cobre TODO antecedente, incluindo os de
   ferramenta-por-escolha (Nobre, Artesão, Artista, Guarda, Soldado — via

}

function getBonusFor(ability){
  const plan = activeBgData().abilityPlan;
  if(!plan) return 0;
  if(plan.type==='1-1-1'){
    return (plan.plusOnes||[]).includes(ability) ? 1 : 0;
  }
  if(plan.type==='2-1'){
    if(plan.plus2===ability) return 2;
    if(plan.plus1===ability) return 1;
  }
  return 0;
}

function startingGold(){
  const clsConst = activeClassConst();
  const cls = activeClassData();
  const clsGold = cls.equipment==='C' ? clsConst.equipmentC_gold : cls.equipment==='B' ? clsConst.equipmentB_gold : (cls.equipment==='A' ? clsConst.equipmentA_gold : 0);
  const bgConst = activeBgConst();
  const bg = activeBgData();
  const bgGold = bg.equipment==='B' ? bgConst.equipmentB_gold : (bg.equipment==='A' ? bgConst.equipmentA_gold : 0);
  return clsGold + bgGold;
}
function spentGold(){
  let total = 0;
  for(const [name, qty] of Object.entries(data.shop.purchases||{})){
    const item = findShopItem(name);
    if(item) total += item.c * qty;
  }
  return total;
}
function findShopItem(name){
  for(const cat of Object.values(SHOP)){
    const found = cat.items.find(i=>i.n===name);
    if(found) return found;
  }
  return null;
}
function renderShop(){
  const remaining = startingGold() - spentGold();
  const purchases = data.shop.purchases||{};
  const clsConst = activeClassConst();
  let html = `<h2>Loja — Gaste seu Dinheiro Inicial</h2>
  <div class="intro">Itens filtrados pelo que ${data.classe} pode usar (proficiências de arma e armadura da classe). Equipamento de aventura vale pra qualquer um. Armas Marciais e Armadura Média/Pesada ainda não estão na loja deste protótipo, mesmo se a classe tiver proficiência com elas.</div>

  </div>`;

  Object.entries(SHOP).forEach(([catName, cat])=>{
    if(cat.filterProf && !clsConst.weaponProf.includes(cat.filterProf) && !clsConst.armorProf.includes(cat.filterProf)) return;
    html += `<h3>${catName}</h3>
    <table class="shop-table"><thead><tr><th>Item</th><th>Dano/Efeito</th><th>Propriedades</th><th>Custo</th><th>Qtd.</th></tr></thead><tbody>
    ${cat.items.map(it=>{
      const qty = purchases[it.n]||0;
      const maxQty = maxAffordableQty(it.n) + qty; // limite considerando o que já foi gasto neste item
      const atCap = qty>=maxQty;
      const contHtml = it.cont ? `<div style="font-size:0.68rem; color:var(--parchment-dim); font-style:italic; margin-top:2px; max-width:220px;">${it.cont}</div>` : '';
      return `<tr>
        <td>${it.n}${contHtml}</td><td>${it.d}</td><td style="color:var(--parchment-dim);font-size:0.78rem;">${it.p}</td>
        <td>${fmtGold(it.c)} PO</td>
        <td><div class="qty-cell">
          <button class="btn small" data-fn="shopDec" data-pick="${it.n}">−</button>

        </div></td>

  const cartEntries = Object.entries(purchases).filter(([,q])=>q>0);
  if(cartEntries.length){
    html += `<h3>Carrinho</h3><div class="cart-list">${cartEntries.map(([n,q])=>{

      return `<div class="cart-item"><span>${n} ×${q}</span><span>${fmtGold(item.c*q)} PO</span></div>`;

  return html;

function attachStepHandlers(){
  document.querySelectorAll('[data-fn]').forEach(el=>{
    if(el.tagName==='INPUT'){
      el.addEventListener('input', ()=>{
        const item = el.getAttribute('data-item');
        let v = parseInt(el.value)||0;
        if(v<0) v=0;
        shopSetQty(item, v);
      });
    } else {
      el.addEventListener('click', ()=>{
        const fn = el.getAttribute('data-fn');
        const val = el.getAttribute('data-pick');
        window[fn](val);
      });
    }
  });
}

/* Retorna o(s) truque(s) que a ESPÉCIE já concede de graça (ex: Legado Ínfero
   do Tiferino), pra excluir da lista de truques da classe — senão a pessoa
   podia "escolher" de novo um truque que já tem e não ganhar nada com isso
   (ou pior, a lista deixava parecer que ele nem foi concedido). Retorna
   sempre um array (vazio se a espécie não concede nenhum). */
function speciesGrantedCantrips(){
  if(data.especie==='Tiferino' && data.tiefling.legado){
    const opt = TIEFLING.subespecie.opcoes.find(o=>o.nome===data.tiefling.legado);
    const item = opt && opt.nivel1.concede && opt.nivel1.concede[0];
    if(item) return [item.nome];
  }
  return [];
}

/* Retorna o objeto de dados do antecedente ativo (data.charlatao, data.nobre,
   data.andarilho etc.) — os handlers abaixo (plano de atributos, Habilidoso,
   equipamento) são compartilhados entre TODOS os antecedentes, via o mapa
   BACKGROUND_DATA_KEY. Se data.antecedente ainda não tiver sido escolhido,
   cai no charlatao só pra nunca retornar undefined. */
function activeBgData(){
  const key = BACKGROUND_DATA_KEY[data.antecedente] || 'charlatao';
  return data[key];
}
/* Mesma ideia, mas retorna o objeto de dados FIXOS (CHARLATAO, NOBRE,
   ANDARILHO etc.), via BACKGROUND_CONST. */
function activeBgConst(){
  return BACKGROUND_CONST[data.antecedente] || CHARLATAO;
}

/* Regra da casa: por padrão (freeAbilityRule=true) os bônus de atributo do
   antecedente podem ir em qualquer um dos 6 atributos (como o livro já
   permite oficialmente). Se o jogador desmarcar o checkbox, trava a escolha
   só nos 3 atributos sugeridos daquele antecedente específico — uma
   restrição EXTRA, mais dura que a regra oficial. */
function allowedAbilitiesFor(bgConst){ return data.freeAbilityRule ? ABILITIES : bgConst.suggestedAbilities; }

function sanitizeAbilityPlans(){
  Object.keys(BACKGROUND_CONST).map(nome=>[data[BACKGROUND_DATA_KEY[nome]], BACKGROUND_CONST[nome]]).forEach(([bgData, bgConst])=>{
    const plan = bgData.abilityPlan;
    if(!plan) return;
    const allowed = allowedAbilitiesFor(bgConst);
    if(plan.type==='2-1'){
      if(plan.plus2 && !allowed.includes(plan.plus2)) plan.plus2=null;
      if(plan.plus1 && (!allowed.includes(plan.plus1) || plan.plus1===plan.plus2)) plan.plus1=null;
    } else if(plan.type==='1-1-1'){
      plan.plusOnes = (plan.plusOnes||[]).filter(a=>allowed.includes(a));
    }
  });
}
function toggleFreeAbilityRule(){ data.freeAbilityRule = !data.freeAbilityRule; sanitizeAbilityPlans(); persist(); render(); }

/* Bloco de UI "Distribuição de Atributos", compartilhado entre Charlatão e
   Nobre (era duplicado igual nos dois antes desta função existir). */
function renderAbilityPlanBlock(bgConst, plan){
  const allowed = allowedAbilitiesFor(bgConst);
  return `<h3 id="grp-3-abilityplan">Distribuição de Atributos</h3>
  <div style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:10px;" onclick="toggleFreeAbilityRule()">
    <input type="checkbox" style="width:16px;height:16px;flex:none;margin:0;pointer-events:none;" ${data.freeAbilityRule?'checked':''}>
    <span>Regra da casa: Sem restrição de antecedente</span>
  </div>
  <div class="intro" style="margin-bottom:8px;">
    ${data.freeAbilityRule
      ? `Com a regra da casa marcada, você pode colocar os bônus em qualquer um dos 6 atributos.`
      : `Regra oficial do livro: os bônus ficam travados nos atributos sugeridos pra este antecedente — <b>${bgConst.suggestedAbilities.join(', ')}</b>. Marque a regra da casa acima pra liberar todos os 6.`}
    Escolha +2 em um e +1 em outro, OU +1 em três.
  </div>
  <div class="check-list" style="margin-bottom:10px;">
    <div class="check-pill ${plan && plan.type==='2-1'?'selected':''}" data-pick="2-1" data-fn="pickAbilityPlanType">+2 / +1</div>
    <div class="check-pill ${plan && plan.type==='1-1-1'?'selected':''}" data-pick="1-1-1" data-fn="pickAbilityPlanType">+1 / +1 / +1</div>
  </div>
  ${plan && plan.type==='2-1' ? `
    <div style="display:flex; gap:20px; margin-bottom:16px; flex-wrap:wrap;">
      <div>
        <div style="font-size:0.75rem;color:var(--parchment-dim);margin-bottom:6px;">+2 em:</div>
        <div class="check-list">${allowed.map(a=>`<div class="check-pill ${plan.plus2===a?'selected':''}" data-pick="${a}" data-fn="pickPlus2">${a}</div>`).join('')}</div>
      </div>
      <div>
        <div style="font-size:0.75rem;color:var(--parchment-dim);margin-bottom:6px;">+1 em:</div>
        <div class="check-list">${allowed.filter(a=>a!==plan.plus2).map(a=>`<div class="check-pill ${plan.plus1===a?'selected':''}" data-pick="${a}" data-fn="pickPlus1">${a}</div>`).join('')}</div>
      </div>
    </div>` : ''}
  ${plan && plan.type==='1-1-1' ? `
    <div style="margin-bottom:16px;">
      <div style="font-size:0.75rem;color:var(--parchment-dim);margin-bottom:6px;">+1 em (escolha 3):</div>
      <div class="check-list">${allowed.map(a=>{
        const sel = (plan.plusOnes||[]).includes(a);
        const disabled = !sel && (plan.plusOnes||[]).length>=3;
        return `<div class="check-pill ${sel?'selected':''} ${disabled?'disabled':''}" ${disabled?'':`data-pick="${a}" data-fn="pickPlusOneOf3"`}>${a}</div>`;
      }).join('')}</div>
      <div class="counter ${(plan.plusOnes||[]).length===3?'ok':''}">${(plan.plusOnes||[]).length}/3 escolhidos</div>
    </div>` : ''}`;
}

function pickAbilityPlanType(v){ activeBgData().abilityPlan = v==='1-1-1' ? {type:'1-1-1', plusOnes:[]} : {type:'2-1', plus2:null, plus1:null}; persist(); render(); }
function pickPlusOneOf3(v){
  const plan = activeBgData().abilityPlan;
  if(!plan.plusOnes) plan.plusOnes=[];
  const i = plan.plusOnes.indexOf(v);
  if(i>=0) plan.plusOnes.splice(i,1); else if(plan.plusOnes.length<3) plan.plusOnes.push(v);
  persist(); render();
}
function pickPlus2(v){ const bg=activeBgData(); bg.abilityPlan.plus2=v; if(bg.abilityPlan.plus1===v) bg.abilityPlan.plus1=null; persist(); render(); }
function pickPlus1(v){ activeBgData().abilityPlan.plus1=v; persist(); render(); }
function pickBgEquip(v){ activeBgData().equipment=v; persist(); render(); }
function toggleHabilidoso(v){ const s=activeBgData().habilidoso; const i=s.indexOf(v); if(i>=0)s.splice(i,1); else if(s.length<3)s.push(v); persist(); render(); }

function toggleIniciadoSpell1(v){ const s=activeBgData().iniciadoSpell1; const i=s.indexOf(v); if(i>=0)s.splice(i,1); else if(s.length<1)s.push(v); persist(); render(); }

function setAttr(ability, value){
  if(value===''){
    delete data.attrs[ability];
  } else {
    const v = parseInt(value);
    // se outro atributo já tem esse valor, tira de lá (rouba/troca) antes de atribuir aqui
    for(const other of ABILITIES){
      if(other!==ability && data.attrs[other]===v){
        delete data.attrs[other];
        break;
      }
    }
    data.attrs[ability] = v;
  }
  persist(); render();
}

/* Quantidade máxima que dá pra comprar de um item sem estourar o ouro
   disponível, considerando o que já tá no carrinho pros OUTROS itens. */
function maxAffordableQty(name){
  const item = findShopItem(name);
  if(!item) return 0;
  if(item.c<=0) return 999; // item de custo 0, sem limite prático
  const purchases = data.shop.purchases||{};
  let othersCost = 0;
  for(const [n,q] of Object.entries(purchases)){
    if(n===name) continue;
    const it = findShopItem(n);
    if(it) othersCost += it.c*q;
  }
  const budget = startingGold() - othersCost;
  if(budget<=0) return 0;
  return Math.floor((budget / item.c) + 1e-9); // epsilon evita erro de ponto flutuante
}

function shopSetQty(name, qty){
  if(!data.shop.purchases) data.shop.purchases={};
  if(qty<0) qty=0;
  const maxQty = maxAffordableQty(name);
  if(qty>maxQty) qty=maxQty;
  if(qty<=0) delete data.shop.purchases[name];
  else data.shop.purchases[name]=qty;
  persist(); render();
}
function shopInc(name){ shopSetQty(name, (data.shop.purchases[name]||0)+1); }
function shopDec(name){ shopSetQty(name, Math.max(0,(data.shop.purchases[name]||0)-1)); }

async function init(){
  await restore();
  render();
}
init();
