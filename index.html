<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criador de Personagens — D&D 2024</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:ital,wght@0,500,600;1,400&family=Cormorant+Garamond:wght@500;600&display=swap');
  :root{
    --ink:#1b1512; --panel:#241c17; --panel2:#2c2119; --line:#5a4632;
    --parchment:#e8dcc4; --parchment-dim:#b9ac91;
    --wax:#7a1f2b; --wax-bright:#a53040;
    --gold:#c9a15a; --gold-dim:#8a6f3d;
    --green:#5c7a52;
    --disabled:#3a322c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(ellipse at top left, rgba(90,70,50,0.25), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(90,30,40,0.18), transparent 60%),
      var(--ink);
    color:var(--parchment); font-family:'Spectral',serif;
    padding:20px 14px 60px;
  }
  .wrap{max-width:960px;margin:0 auto;}
  header{display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid var(--gold-dim); padding-bottom:12px; margin-bottom:18px;}
  header h1{font-family:'Cinzel',serif; font-weight:900; font-size:1.5rem; letter-spacing:0.03em; color:var(--gold); margin:0;}
  header .sub{font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--parchment-dim); font-size:0.95rem;}
  .progress{display:flex; gap:4px; margin-bottom:22px;}
  .progress .seg{flex:1; height:4px; border-radius:2px; background:var(--disabled);}
  .progress .seg.done{background:var(--gold-dim);}
  .progress .seg.current{background:var(--wax-bright);}
  .card{background:linear-gradient(180deg, var(--panel), var(--panel2)); border:1px solid var(--line); border-radius:5px; padding:22px 24px; position:relative;}
  .card::before{content:"";position:absolute;inset:4px;border:1px solid rgba(201,161,90,0.12);border-radius:3px;pointer-events:none;}
  .card h2{font-family:'Cinzel',serif; font-size:1.05rem; letter-spacing:0.06em; color:var(--gold); margin:0 0 6px;}
  .card h3{font-family:'Cinzel',serif;font-size:0.85rem;color:var(--gold-dim);margin:16px 0 8px;}
  .card .intro{color:var(--parchment-dim); font-size:0.9rem; margin-bottom:18px; line-height:1.5;}
  .choice-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; margin-bottom:6px;}
  .choice{border:1px solid var(--line); border-radius:4px; padding:12px 10px; text-align:center; cursor:pointer; background:rgba(0,0,0,0.2); transition:all .15s; font-family:'Cinzel',serif; font-size:0.82rem; letter-spacing:0.03em;}
  .choice:hover:not(.disabled){border-color:var(--gold-dim); background:rgba(201,161,90,0.08);}
  .choice.selected{border-color:var(--wax-bright); background:rgba(165,48,64,0.18); color:var(--gold);}
  .choice.disabled{color:#5a5148; cursor:not-allowed; opacity:0.45;}
  .choice .note{display:block; font-family:'Spectral',serif; font-size:0.68rem; color:var(--parchment-dim); margin-top:4px; letter-spacing:0;}
  .option-block{border:1px solid var(--line); border-radius:4px; padding:14px; margin-bottom:12px; background:rgba(0,0,0,0.15);}
  .option-block.selected{border-color:var(--gold-dim); background:rgba(201,161,90,0.06);}
  .option-block h3{margin:0 0 6px; font-size:0.85rem;}
  .option-block p{font-size:0.85rem; color:var(--parchment); margin:0; line-height:1.55;}
  .option-block .pick-btn{margin-top:10px; background:none; border:1px solid var(--gold-dim); color:var(--gold-dim); font-family:'Cinzel',serif; font-size:0.68rem; letter-spacing:0.08em; text-transform:uppercase; padding:5px 12px; border-radius:3px; cursor:pointer;}
  .option-block.selected .pick-btn{background:var(--wax); border-color:var(--wax-bright); color:#f0dcc0;}
  .check-list{display:flex; flex-wrap:wrap; gap:8px;}
  .check-pill{border:1px solid var(--line); border-radius:14px; padding:6px 14px; cursor:pointer; font-size:0.85rem; background:rgba(0,0,0,0.2); user-select:none;}
  .check-pill.selected{border-color:var(--wax-bright); background:rgba(165,48,64,0.25); color:var(--gold);}
  .check-pill.disabled{opacity:0.35; cursor:not-allowed;}
  .counter{font-family:'Cinzel',serif; font-size:0.75rem; color:var(--gold-dim); margin:10px 0 14px;}
  .counter.ok{color:var(--green);}
  .group-label{
    font-family:'Cinzel',serif; font-size:0.68rem; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--parchment); background:rgba(201,161,90,0.12); border-left:3px solid var(--gold-dim);
    padding:4px 10px; margin:10px 0 8px; border-radius:0 3px 3px 0;
  }
  @keyframes pulseMissing{
    0%,100%{ box-shadow:0 0 0 0 rgba(165,48,64,0); }
    50%{ box-shadow:0 0 0 6px rgba(165,48,64,0.35); }
  }
  .highlight-missing{
    outline:2px solid var(--wax-bright) !important;
    border-radius:4px;
    animation:pulseMissing 0.5s ease-in-out 3;
  }
  .spell-pill-wrap{display:inline-flex; align-items:center; gap:2px; vertical-align:top;}
  .spell-pill-wrap.expanded{display:block; width:100%; margin-bottom:6px;}
  .info-btn{
    background:none; border:1px solid var(--line); color:var(--gold-dim); cursor:pointer;
    font-size:0.75rem; width:20px; height:20px; border-radius:50%; line-height:1; padding:0;
    display:flex; align-items:center; justify-content:center;
  }
  .info-btn:hover{color:var(--gold); border-color:var(--gold-dim);}
  .info-btn.active{background:var(--wax); border-color:var(--wax-bright); color:#f0dcc0;}
  .spell-detail{
    margin-top:6px; margin-bottom:6px; padding:10px 12px; border:1px solid var(--gold-dim);
    border-radius:4px; background:rgba(0,0,0,0.28); font-size:0.82rem; line-height:1.55;
  }
  .spell-detail .stats{display:flex; flex-wrap:wrap; gap:4px 14px; margin-bottom:8px; font-size:0.72rem; color:var(--parchment-dim);}
  .spell-detail .stats b{color:var(--gold); font-family:'Cinzel',serif; font-weight:700;}
  .spell-detail .escala{margin-top:8px; color:var(--gold-dim); font-style:italic; font-size:0.78rem;}
  .nav{display:flex; justify-content:space-between; margin-top:22px;}
  .btn{font-family:'Cinzel',serif; font-size:0.78rem; letter-spacing:0.08em; text-transform:uppercase; padding:10px 22px; border-radius:4px; cursor:pointer; border:1px solid var(--gold-dim); background:transparent; color:var(--gold-dim);}
  .btn.primary{background:var(--wax); border-color:var(--wax-bright); color:#f5e6d0;}
  .btn.primary:disabled{background:var(--disabled); border-color:var(--disabled); color:#6a6259; cursor:not-allowed;}
  .btn:hover:not(:disabled){filter:brightness(1.15);}
  .btn.small{padding:3px 10px; font-size:0.68rem;}
  .attr-row{display:grid; grid-template-columns: 140px 90px 90px 1fr; gap:12px; align-items:center; margin-bottom:10px;}
  .attr-row .name{font-family:'Cinzel',serif; color:var(--gold); font-size:0.85rem;}
  select, input{background:rgba(0,0,0,0.28); border:1px solid var(--line); border-radius:3px; color:var(--parchment); font-family:'Spectral',serif; font-size:0.9rem; padding:6px 8px; width:100%;}
  .attr-row .bonus-tag{font-size:0.78rem; color:var(--green); font-family:'Cinzel',serif;}
  .attr-row .final{font-family:'Cinzel',serif; color:var(--gold); font-weight:700;}
  .save-indicator{font-family:'Cormorant Garamond',serif; font-size:0.8rem; color:var(--gold-dim); display:flex; align-items:center; gap:6px;}
  .seal-dot{width:7px;height:7px;border-radius:50%;background:var(--wax-bright);opacity:0.3;}
  .summary-section{margin-bottom:16px;}
  .summary-section h3{font-family:'Cinzel',serif; font-size:0.75rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold-dim); border-bottom:1px solid var(--line); padding-bottom:4px; margin-bottom:8px; margin-top:0;}
  .summary-section .content{font-size:0.88rem; line-height:1.6; color:var(--parchment);}
  .pill-static{display:inline-block; border:1px solid var(--line); border-radius:12px; padding:3px 10px; margin:2px 4px 2px 0; font-size:0.8rem; background:rgba(0,0,0,0.2);}
  .edit-link{float:right; font-family:'Cinzel',serif; font-size:0.62rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--gold-dim); cursor:pointer; border:none; background:none; text-decoration:underline; text-underline-offset:2px;}
  .edit-link:hover{color:var(--gold);}
  .wallet{position:sticky; top:8px; z-index:5; display:flex; justify-content:space-between; align-items:center; background:linear-gradient(180deg, #2c2119, #1f1712); border:1px solid var(--gold-dim); border-radius:6px; padding:10px 16px; margin-bottom:16px;}
  .wallet .label{font-family:'Cinzel',serif; font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--parchment-dim);}
  .wallet .value{font-family:'Cinzel',serif; font-size:1.3rem; color:var(--gold); font-weight:900;}
  .wallet .value.negative{color:var(--wax-bright);}
  .shop-table{width:100%; border-collapse:collapse; font-size:0.85rem; margin-bottom:18px;}
  .shop-table th{font-family:'Cinzel',serif; font-size:0.62rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold-dim); text-align:left; border-bottom:1px solid var(--line); padding:5px 6px;}
  .shop-table td{padding:5px 6px; border-bottom:1px solid rgba(255,255,255,0.06); vertical-align:middle;}
  .shop-table .qty-cell{display:flex; align-items:center; gap:6px;}
  .shop-table .qty-cell input{width:44px; text-align:center; padding:3px;}
  .cart-list{font-size:0.85rem; margin-top:6px;}
  .cart-item{display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed rgba(255,255,255,0.08);}
  @media (max-width:700px){
    .attr-row{grid-template-columns:100px 1fr 1fr; row-gap:4px;}
    .attr-row .final{grid-column:1/-1;}
    .shop-table{font-size:0.75rem;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Criador de Personagens</h1>
      <div class="sub">D&D 2024 — Livro do Jogador + Unearthed Arcana</div>
    </div>
    <div class="save-indicator"><span class="seal-dot" id="saveDot"></span><span id="saveText">—</span></div>
  </header>
  <div class="progress" id="progressBar"></div>
  <div class="card" id="cardContent"></div>
</div>
<script>
/* ==========================================================================
   NOTA PARA A PRÓXIMA INSTÂNCIA DO CLAUDE — leia antes de editar este arquivo
   ==========================================================================
   Este é um assistente de criação de personagem D&D 2024 (estilo Roll20):
   passo a passo, só libera "Avançar" quando a etapa está completa, com foco
   automático (scroll + destaque) na primeira seleção faltante.

   ESCOPO ATUAL (funcionando): Bruxo, Tiferino, Charlatão.
   FALTAM: as outras 11 classes, 9 espécies, 14 antecedentes do PHB 2024.

   O usuário provavelmente vai subir de novo, neste novo chat:
   1. O PDF do Livro do Jogador D&D 5e 2024
   2. A planilha "Magias_PHB2024_Completo.xlsx" (abas "Magias PHB 2024 + UA
      Psion" e "Talentos") — já tem TODAS as magias/truques/talentos do
      livro condensados (efeito + escalonamento em português, parafraseado,
      não copiado cru do livro). É a fonte mais rápida pra alimentar
      SPELL_DETAILS de qualquer classe nova.
   3. (Só se for mexer em Psiônico) o PDF do Unearthed Arcana Psiônico 2025

   ONDE MEXER PRA ADICIONAR CONTEÚDO NOVO:
   - CLASSES / SPECIES / BACKGROUNDS: arrays com os nomes oficiais (12/10/15).
     ENABLED_CLASSES / ENABLED_SPECIES / ENABLED_BACKGROUNDS controlam o que
     já é clicável na tela de seleção (resto fica cinza, "em breve").
   - Nova classe: criar objeto tipo BRUXO (skills, cantrips, spells1,
     equipmentA/B, weaponProf, armorProf...) + função renderXDetail() +
     handlers de toggle, no mesmo padrão do Bruxo. Adicionar entrada em
     CLASS_INFO (descrição + Atributo Principal + Dado de Vida + Complexidade
     — tirado da tabela "Visão Geral das Classes", página 33 do livro).
   - Nova espécie: objeto tipo TIEFLING com os traços/escolhas próprias.
   - Novo antecedente: objeto tipo CHARLATAO + entrada em BACKGROUND_INFO
     (nome do talento + descrição curta do QUE O TALENTO FAZ, não da
     "personalidade" do antecedente + perícias/ferramenta).
   - SPELL_DETAILS: nome -> {tempo, alcance, componentes, duracao, efeito,
     escalonamento}. Usado pelo botão "ⓘ" (spellChoiceList) nas listas de
     magia/truque. Puxar direto da planilha, mesmo texto já condensado.
   - SHOP: itens da loja final, filtrados por proficiência (campo filterProf
     bate com weaponProf/armorProf da classe). Kits com múltiplos itens usam
     o campo "cont" pra listar o conteúdo (evita duplicar comprando 2 kits
     parecidos, tipo Aventureiro + Explorador de Masmorras).
   - Ordem das etapas (mudar com cuidado, tudo sincronizado):
     0 Espécie -> 1 detalhe espécie -> 2 Antecedente -> 3 detalhe antecedente
     -> 4 Classe -> 5 detalhe classe -> 6 Atributos -> 7 Loja -> 8 Resumo.
     Se adicionar/mudar etapa, atualizar TOTAL_STEPS, render(), canAdvance()
     E findFirstMissingGroup() juntos (os 3 têm um switch/case por step).
   - findFirstMissingGroup(): cada grupo de escolha tem id="grp-{step}-nome"
     pra permitir o scroll+destaque automático. Grupo novo = id novo.
   - editSection(idx) / returnToSummary: sistema de "editar e voltar pro
     resumo" (usado nos links "Editar" da tela final).
   - ALL_SKILLS / ALL_TOOLS: catálogo oficial de perícias e FERRAMENTAS DE
     VERDADE (as que têm ficha de Atributo+Usar Objeto no livro). Cuidado:
     "Kit de Aventureiro", "Kit de Diplomata" etc. NÃO são ferramentas, são
     só pacotes de equipamento — não confundir na hora de montar talentos
     tipo Habilidoso pra outros antecedentes.

   PADRÕES A MANTER:
   - Nunca copiar parágrafo cru do livro — sempre parafrasear (mesma regra
     de direitos autorais usada nas outras conversas/planilha).
   - Todo texto em português, mesmo tom já usado no resto do arquivo.
   - Testar com Playwright headless (clicando o fluxo inteiro) depois de
     qualquer edição, antes de entregar — erro de sintaxe JS às vezes só
     aparece assim, o resto do app quebra silenciosamente.
   ========================================================================== */

const CLASSES = ["Bárbaro","Bardo","Bruxo","Clérigo","Druida","Feiticeiro","Guardião","Guerreiro","Ladino","Mago","Monge","Paladino"];
const ENABLED_CLASSES = ["Bruxo"];
const SPECIES = ["Aasimar","Anão","Draconato","Elfo","Gnomo","Golias","Humano","Orc","Pequenino","Tiferino"];
const ENABLED_SPECIES = ["Tiferino"];
const BACKGROUNDS = ["Acólito","Artesão","Artista","Charlatão","Criminoso","Eremita","Fazendeiro","Guarda","Guia","Marinheiro","Mercador","Nobre","Órfão","Sábio","Soldado"];
const ENABLED_BACKGROUNDS = ["Charlatão"];

const BRUXO = {
  skills: ["Arcanismo","Enganação","História","Intimidação","Investigação","Natureza","Religião"],
  pactBoons: {
    "Pacto do Tomo": "Ao final de um Descanso Curto ou Longo, você conjura um Livro das Sombras (aparência à sua escolha) na mão. Escolha 3 truques e 2 magias de 1º círculo com o marcador Ritual, de qualquer lista de classe (que você ainda não tenha preparadas). Enquanto tiver o livro, essas magias ficam sempre preparadas e funcionam como magias de Bruxo. O livro também serve como Foco de Conjuração.",
    "Pacto da Lâmina": "Como Ação Bônus, conjura uma arma de pacto na mão (Corpo a Corpo Simples ou Marcial à escolha) ou vincula-se a uma arma mágica tocada. Tem proficiência com ela e pode usá-la como Foco de Conjuração. Ao atacar com ela, pode usar Carisma no ataque/dano em vez de Força/Destreza, e causar dano Necrótico, Psíquico ou Radiante em vez do tipo normal.",
    "Pacto da Corrente": "Aprende Convocar Familiar e pode conjurá-la sem gastar espaço de magia. Pode escolher formas especiais de familiar (Cobra Peçonhenta, Diabrete, Esfinge Maravilhosa, Esqueleto, Pseudodragão, Quasit, Slaad Girino, Sprite). Ao executar a ação Atacar, pode abrir mão de um ataque seu para o familiar atacar como Reação dele."
  },
  cantrips: ["Amigos","Badalar Fúnebre","Golpe Certeiro","Ilusão Menor","Mãos Mágicas","Prestidigitação Arcana","Proteção Contra Lâminas","Raio Místico","Rajada de Veneno","Talho Mental","Toque Necrótico","Trovão"],
  spells1: ["Armadura de Agathys","Braços de Hadar","Compreender Idiomas","Danação","Detectar Magia","Enfeitiçar Pessoa","Escrita Ilusória","Falar com Animais","Gargalhada Nefasta de Tasha","Perdição","Proteção Contra o Bem e o Mal","Raio de Bruxa","Repreensão Diabólica","Retirada Acelerada","Servo Invisível"],
  equipmentA: ["Armadura de Couro", "Foice", "2 Adagas", "Foco Arcano (orbe)", "Livro (conhecimento oculto)", "Kit de Erudito", "15 PO"],
  equipmentB_gold: 100,
  weaponProf: "simples",
  armorProf: "leve"
};

const ALL_CANTRIPS = ["Acudir os Moribundos","Amigos","Arremesso Telecinético","Arte Druídica","Badalar Fúnebre","Bolha Ácida","Bordão Místico","Chama Sagrada","Chicote de Espinhos","Criar Chamas","Elementalismo","Explosão Elemental","Fagulha Estelar","Golpe Certeiro","Ilusão Menor","Luz","Luzes Dançantes","Mensagem","Mãos Mágicas","Orientação","Palavra de Radiância","Prestidigitação Arcana","Proteção Contra Lâminas","Raio Místico","Raio de Fogo","Raio de Gelo","Rajada de Veneno","Reparar","Resistência","Talho Mental","Taumaturgia","Toque Chocante","Toque Necrótico","Trovão","Zombaria Perversa"];
const ALL_1ST_RITUAL = ["Alarme","Compreender Idiomas","Convocar Familiar","Detectar Magia","Detectar Veneno e Doença","Disco Flutuante de Tenser","Escrita Ilusória","Falar com Animais","Identificar","Purificar Alimentos e Bebidas","Servo Invisível"];

const SPELL_DETAILS = {
"Acudir os Moribundos": {tempo:"Ação", alcance:"4,5 metros", componentes:"V, S", duracao:"Instantânea", efeito:"Você estabiliza à distância uma criatura caída a 0 PV (sem curar). Alcance dobra nos níveis 5/11/17.", escalonamento:"—"},
"Alarme": {tempo:"1 minuto ou Ritual", alcance:"9 metros", componentes:"V, S, M (um sino e um fio de prata)", duracao:"8 horas", efeito:"Define um alarme de intrusão numa porta/janela/área (até cubo de 6m). Escolha: alarme mental (acorda você a até 1,5km) ou sonoro (sino audível 18m por 10s). Pode isentar criaturas específicas.", escalonamento:"—"},
"Amigos": {tempo:"Ação", alcance:"3 metros", componentes:"S, M (um pouco de maquiagem)", duracao:"Concentração, até 1 minuto", efeito:"Você emana um sentimento mágico de amizade. Salv. Sabedoria ou fica Enfeitiçado pela duração (falha automática se não for Humanoide, já estiver lutando com você, ou já sofreu essa magia sua nas últimas 24h). Encerra se sofrer dano ou você atacar/causar dano/forçar salvaguarda. Ao acabar, o alvo sabe que foi enfeitiçado — risco de criar um inimigo.", escalonamento:"—"},
"Armadura de Agathys": {tempo:"Ação Bônus", alcance:"Pessoal", componentes:"V, S, M (um caco de vidro azul)", duracao:"1 hora", efeito:"Frio mágico te envolve: +5 PV temporários; quem te acertar corpo a corpo sofre 5 dano Gélido. Encerra ao perder os PV temp.", escalonamento:"Upcast: +5 PV temp e +5 dano por círculo."},
"Arremesso Telecinético": {tempo:"1 ação", alcance:"18 metros", componentes:"S", duracao:"Instantânea", efeito:"Você arremessa um objeto não mágico solto (0,5-2,5 kg, a até 3m de você) contra uma criatura no alcance — ataque mágico à distância: 1d10 dano de Força; o objeto cai intacto (acerto ou erro).", escalonamento:"Escala: 2d10 (nível 5), 3d10 (nível 11), 4d10 (nível 17)."},
"Arte Druídica": {tempo:"Ação", alcance:"9 metros", componentes:"V, S", duracao:"Instantânea", efeito:"Sussurra aos espíritos da natureza pra um efeito pequeno à escolha: acender/apagar chama; efeito sensorial inofensivo (folhas, brisa, som, cheiro); flor desabrochando; ou previsão do clima nas próximas 24h (efeito visual dura 1 rodada).", escalonamento:"—"},
"Badalar Fúnebre": {tempo:"Ação", alcance:"18 metros", componentes:"V, S", duracao:"Instantânea", efeito:"Um sino sombrio soa perto do alvo. Salv. Sabedoria ou 1d8 dano Necrótico (1d12 se o alvo já estiver ferido).", escalonamento:"Escala nos níveis de personagem 5, 11 e 17: dano sobe pra 2d8, 3d8 e 4d8 respectivamente."},
"Bolha Ácida": {tempo:"Ação", alcance:"18 metros", componentes:"V, S", duracao:"Instantânea", efeito:"Uma bolha de ácido explode numa esfera de 1,5m. Salv. Destreza (área) ou 1d6 dano Ácido.", escalonamento:"Escala nos níveis de personagem 5, 11 e 17: dano sobe pra 2d6, 3d6 e 4d6 respectivamente."},

let step = 0;
const TOTAL_STEPS = 9;
let data = {
  especie: null, antecedente: null, classe: null,
  tiefling: { tamanho: null, legado: null, atributoLegado: null },
  charlatao: { abilityPlan: null, equipment: null, habilidoso: [] },
  bruxo: { skills: [], pactBoon: null, cantrips: [], tomoCantrips: [], spells1: [], tomoRituals: [], equipment: null },
  attrs: {},
  shop: { purchases: {} },
  returnToSummary: false
};

function mod(score){ return Math.floor((score-10)/2); }
function fmt(n){ return (n>=0?'+':'')+n; }
function fmtGold(n){ return (Math.round(n*100)/100).toString().replace('.',','); }

let saveTimer;
function persist(){
  clearTimeout(saveTimer);
  document.getElementById('saveText').textContent = 'salvando…';
  document.getElementById('saveDot').style.opacity='1';
  saveTimer = setTimeout(async ()=>{
    try{
      await window.storage.set('char_wizard_state', JSON.stringify({step, data}));
      document.getElementById('saveText').textContent='salvo';
      document.getElementById('saveDot').style.opacity='0.3';
    }catch(e){
      document.getElementById('saveText').textContent='—';
    }
  }, 400);
}
async function restore(){
  try{
    const r = await window.storage.get('char_wizard_state');
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      step = parsed.step || 0;
      data = Object.assign(data, parsed.data);
      if(!data.shop) data.shop = {purchases:{}};
      if(!data.charlatao.habilidoso) data.charlatao.habilidoso = [];
      if(data.returnToSummary===undefined) data.returnToSummary = false;
    }
  }catch(e){}
}

function renderProgress(){
  const bar = document.getElementById('progressBar');
  bar.innerHTML='';
  for(let i=0;i<TOTAL_STEPS;i++){
    const seg = document.createElement('div');
    seg.className = 'seg' + (i<step?' done':'') + (i===step?' current':'');
    bar.appendChild(seg);
  }
}
function goTo(newStep){ step = newStep; persist(); render(); }
function next(){
  const missing = findFirstMissingGroup();
  if(!missing){ goTo(step+1); return; }
  scrollToMissing(missing);
}
function back(){ if(step>0) goTo(step-1); }

function findFirstMissingGroup(){
  switch(step){
    case 0: return data.especie ? null : 'grp-0-especie';
    case 1:
      if(!data.tiefling.tamanho) return 'grp-1-tamanho';
      if(!data.tiefling.legado) return 'grp-1-legado';
      if(!data.tiefling.atributoLegado) return 'grp-1-atributo';
      return null;
    case 2: return data.antecedente ? null : 'grp-2-antecedente';
    case 3: {
      const plan = data.charlatao.abilityPlan;
      const planOk = plan && (plan.type==='2-1' ? (!!plan.plus2 && !!plan.plus1) : (plan.plusOnes||[]).length===3);
      if(!planOk) return 'grp-3-abilityplan';
      if(data.charlatao.habilidoso.length!==3) return 'grp-3-habilidoso';
      if(!data.charlatao.equipment) return 'grp-3-equipment';
      return null;
    }
    case 4: return data.classe ? null : 'grp-4-classe';
    case 5: {
      const b = data.bruxo;
      if(b.skills.length!==2) return 'grp-5-skills';
      if(!b.pactBoon) return 'grp-5-pact';
      if(b.cantrips.length!==2) return 'grp-5-cantrips';
      if(b.pactBoon==='Pacto do Tomo' && b.tomoCantrips.length!==3) return 'grp-5-tomocantrips';
      if(b.spells1.length!==2) return 'grp-5-spells1';
      if(b.pactBoon==='Pacto do Tomo' && b.tomoRituals.length!==2) return 'grp-5-tomorituals';
      if(!b.equipment) return 'grp-5-equipment';
      return null;
    }
    case 6: {
      const missingAbility = ABILITIES.find(a=>data.attrs[a]===undefined);
      return missingAbility ? 'grp-6-attr-'+missingAbility : null;
    }
    default: return null;
  }
}

function scrollToMissing(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.classList.remove('highlight-missing');
  void el.offsetWidth; // força reflow pra reiniciar a animação se já tiver rodado
  el.classList.add('highlight-missing');
  setTimeout(()=>el.classList.remove('highlight-missing'), 1600);
}

function nav(canNext){
  const summaryBtn = data.returnToSummary ? `<button class="btn primary" onclick="returnToSummaryNow()" style="margin-left:8px;">Voltar ao Resumo ✓</button>` : '';
  return `<div class="nav">
    <button class="btn" onclick="back()" ${step===0?'style="visibility:hidden"':''}>← Voltar</button>
    <div>
      <button class="btn primary" id="nextBtn" onclick="next()">${step===TOTAL_STEPS-1?'Concluir':'Avançar →'}</button>
      ${summaryBtn}
    </div>
  </div>`;
}
function editSection(idx){ data.returnToSummary=true; goTo(idx); }
function returnToSummaryNow(){
  const missing = findFirstMissingGroup();
  if(missing){ scrollToMissing(missing); return; }
  data.returnToSummary=false; goTo(8);
}

function canAdvance(){
  switch(step){
    case 0: return !!data.especie;
    case 1: return !!(data.tiefling.tamanho && data.tiefling.legado && data.tiefling.atributoLegado);
    case 2: return !!data.antecedente;
    case 3: {
      const plan = data.charlatao.abilityPlan;
      const planOk = plan && (plan.type==='2-1' ? (!!plan.plus2 && !!plan.plus1) : (plan.plusOnes||[]).length===3);
      return planOk && !!data.charlatao.equipment && data.charlatao.habilidoso.length===3;
    }
    case 4: return !!data.classe;
    case 5: {
      const b = data.bruxo;
      return b.skills.length===2 && !!b.pactBoon &&
        b.cantrips.length===2 &&
        (b.pactBoon!=='Pacto do Tomo' || b.tomoCantrips.length===3) &&
        b.spells1.length===2 &&
        (b.pactBoon!=='Pacto do Tomo' || b.tomoRituals.length===2) &&
        !!b.equipment;
    }
    case 6: return ABILITIES.every(a=>data.attrs[a]!==undefined);
    case 7: return true;
    case 8: return true;
    default: return false;
  }
}

function render(){
  renderProgress();
  const c = document.getElementById('cardContent');
  let html = '';
  if(step===0) html = renderSpeciesStep();
  else if(step===1) html = renderTieflingDetail();
  else if(step===2) html = renderBackgroundStep();
  else if(step===3) html = renderCharlatanDetail();
  else if(step===4) html = renderClassStep();
  else if(step===5) html = renderBruxoDetail();
  else if(step===6) html = renderAttrs();
  else if(step===7) html = renderShop();
  else if(step===8) html = renderSummary();
  c.innerHTML = html;
  attachStepHandlers();
}

  expandedSpellInfo = (expandedSpellInfo===name) ? null : name;

  return `<div class="spell-detail">

/* Lista de escolha de truques/magias, com botão "ⓘ" que expande um card de detalhe
   (tempo, alcance, componentes, duração, efeito, escalonamento) sem afetar a seleção. */
function spellChoiceList(items, selectedList, maxTotal, toggleFn){
  return `<div class="check-list" style="margin-bottom:6px;">${items.map(name=>{
    const sel = selectedList.includes(name);
    const disabled = !sel && selectedList.length>=maxTotal;
    const detail = SPELL_DETAILS[name];
    const isExpanded = expandedSpellInfo===name;
    return `<div class="spell-pill-wrap ${isExpanded?'expanded':''}">
      <span class="check-pill ${sel?'selected':''} ${disabled?'disabled':''}" ${disabled?'':`data-pick="${name}" data-fn="${toggleFn}"`}>${name}</span>
      ${detail?`<button class="info-btn ${isExpanded?'active':''}" data-pick="${name}" data-fn="toggleSpellInfo" title="Ver detalhes">ⓘ</button>`:''}
      ${isExpanded && detail ? renderSpellDetailCard(detail) : ''}
    </div>`;
  }).join('')}</div>`;
}

function choiceGrid(list, enabledList, selected, onClickName){
  return `<div class="choice-grid">${list.map(n=>{
    const enabled = enabledList.includes(n);
    const sel = selected===n;
    return `<div class="choice ${enabled?'':'disabled'} ${sel?'selected':''}" ${enabled?`data-pick="${n}" data-fn="${onClickName}"`:''}>
      ${n}${enabled?'':'<span class="note">em breve</span>'}
    </div>`;
  }).join('')}</div>`;
}

/* Renderiza uma lista de escolha (checkbox-pill) separada em mini-grupos com cabeçalho,
   pra quando o talento/recurso permite escolher entre categorias diferentes
   (ex: Atributos / Perícias / Ferramentas). Grupos vazios não aparecem. */
function groupedChoiceList(groups, selectedList, maxTotal, toggleFn){
  return groups.filter(g=>g.items.length>0).map(g=>`
    <div class="group-label">${g.label}</div>
    <div class="check-list" style="margin-bottom:10px;">
      ${g.items.map(item=>{
        const sel = selectedList.includes(item);
        const disabled = !sel && selectedList.length>=maxTotal;
        return `<div class="check-pill ${sel?'selected':''} ${disabled?'disabled':''}" ${disabled?'':`data-pick="${item}" data-fn="${toggleFn}"`}>${item}</div>`;
      }).join('')}
    </div>`).join('');
}

  <div class="intro">Atributo Primário: Carisma · Dado de Vida: d8 · Salvaguardas: Sabedoria e Carisma · Armas Simples · Armadura Leve</div>

  <h3 id="grp-5-skills">Perícias (escolha 2)</h3>
  <div class="intro" style="margin-bottom:8px;">Perícias que você já tem por outro recurso não aparecem aqui (escolhê-las de novo não dá benefício extra).</div>
  <div class="check-list" style="margin-bottom:6px;">
    ${(()=>{
      const alreadyHave = [...CHARLATAO.skills, ...data.charlatao.habilidoso];
      const available = BRUXO.skills.filter(s=>!alreadyHave.includes(s));
      return available.map(s=>{
        const sel = b.skills.includes(s);
        const disabled = !sel && b.skills.length>=2;
        return `<div class="check-pill ${sel?'selected':''} ${disabled?'disabled':''}" ${disabled?'':`data-pick="${s}" data-fn="toggleBruxoSkill"`}>${s}</div>`;
      }).join('');
    })()}
  </div>
  <div class="counter ${b.skills.length===2?'ok':''}">${b.skills.length}/2 escolhidas</div>

  <h3 id="grp-5-pact">Vínculo de Pacto</h3>
  ${Object.entries(BRUXO.pactBoons).map(([name,desc])=>`
    <div class="option-block ${b.pactBoon===name?'selected':''}">
      <h3 style="color:var(--gold);margin-top:0;">${name}</h3><p>${desc}</p>
      <button class="pick-btn" data-pick="${name}" data-fn="pickPactBoon">${b.pactBoon===name?'Selecionado':'Escolher'}</button>
    </div>
  `).join('')}

  <h3 id="grp-5-cantrips">Truques da Classe (escolha 2, da lista de Bruxo)</h3>
  ${spellChoiceList(BRUXO.cantrips, b.cantrips, 2, 'toggleCantrip')}
  <div class="counter ${b.cantrips.length===2?'ok':''}">${b.cantrips.length}/2 escolhidos</div>

  ${b.pactBoon==='Pacto do Tomo' ? `
  <h3 id="grp-5-tomocantrips">Truques do Pacto do Tomo (escolha 3, de qualquer classe)</h3>
  ${spellChoiceList(ALL_CANTRIPS.filter(c=>!b.cantrips.includes(c)), b.tomoCantrips, 3, 'toggleTomoCantrip')}
  <div class="counter ${b.tomoCantrips.length===3?'ok':''}">${b.tomoCantrips.length}/3 escolhidos</div>
  `:''}

  <h3 id="grp-5-spells1">Magias Preparadas de 1º Círculo (escolha 2, da lista de Bruxo)</h3>
  ${spellChoiceList(BRUXO.spells1, b.spells1, 2, 'toggleSpell1')}
  <div class="counter ${b.spells1.length===2?'ok':''}">${b.spells1.length}/2 escolhidas</div>

  ${b.pactBoon==='Pacto do Tomo' ? `
  <h3 id="grp-5-tomorituals">Magias Rituais do Pacto do Tomo (escolha 2, 1º círculo, de qualquer classe)</h3>
  ${spellChoiceList(ALL_1ST_RITUAL.filter(r=>!b.spells1.includes(r)), b.tomoRituals, 2, 'toggleTomoRitual')}
  <div class="counter ${b.tomoRituals.length===2?'ok':''}">${b.tomoRituals.length}/2 escolhidas</div>
  `:''}

  <h3 id="grp-5-equipment">Equipamento Inicial</h3>
  <div class="option-block ${b.equipment==='A'?'selected':''}">
    <h3 style="color:var(--gold);margin-top:0;">Opção A</h3><p>${BRUXO.equipmentA.join(', ')}</p>
    <button class="pick-btn" data-pick="A" data-fn="pickBruxoEquip">${b.equipment==='A'?'Selecionado':'Escolher'}</button>
  </div>
  <div class="option-block ${b.equipment==='B'?'selected':''}">
    <h3 style="color:var(--gold);margin-top:0;">Opção B</h3><p>${BRUXO.equipmentB_gold} PO</p>
    <button class="pick-btn" data-pick="B" data-fn="pickBruxoEquip">${b.equipment==='B'?'Selecionado':'Escolher'}</button>
  </div>
  ${nav(canAdvance())}`;
}

function getBonusFor(ability){
  const plan = data.charlatao.abilityPlan;
  if(!plan) return 0;
  if(plan.type==='1-1-1'){
    return (plan.plusOnes||[]).includes(ability) ? 1 : 0;
  }
  if(plan.type==='2-1'){
    if(plan.plus2===ability) return 2;
    if(plan.plus1===ability) return 1;
  }
  return 0;
}

function renderAttrs(){
  const used = Object.values(data.attrs);
  return `<h2>Passo — Atributos (Array Padrão)</h2>
  <div class="intro">Distribua 15, 14, 13, 12, 10, 8 entre os seis atributos. Valores já usados aparecem em laranja — se você escolher um deles, ele é retirado de onde estava antes e movido pra cá. O bônus do antecedente (Charlatão) é somado automaticamente.</div>
  ${ABILITIES.map(a=>{
    const chosen = data.attrs[a];
    const bonus = getBonusFor(a);
    const final = chosen!==undefined ? chosen+bonus : null;
    return `<div class="attr-row" id="grp-6-attr-${a}">
      <div class="name">${a}</div>
      <select data-ability="${a}" onchange="setAttr('${a}', this.value)">
        <option value="">—</option>
        ${STANDARD_ARRAY.map(v=>{
          const usedElsewhere = used.includes(v) && chosen!==v;
          const label = usedElsewhere ? `${v} (em uso)` : `${v}`;
          const style = usedElsewhere ? 'style="color:#c98a5a;"' : '';
          return `<option value="${v}" ${chosen===v?'selected':''} ${style}>${label}</option>`;
        }).join('')}
      </select>
      <div class="bonus-tag">${bonus?('antecedente '+fmt(bonus)):''}</div>
      <div class="final">${final!==null?`Total ${final} (mod ${fmt(mod(final))})`:''}</div>
    </div>`;
  }).join('')}
  ${nav(canAdvance())}`;
}

function startingGold(){
  const bGold = data.bruxo.equipment==='B' ? BRUXO.equipmentB_gold : 0;
  const chGold = data.charlatao.equipment==='B' ? CHARLATAO.equipmentB_gold : (data.charlatao.equipment==='A' ? CHARLATAO.equipmentA_gold : 0);
  const bAGold = data.bruxo.equipment==='A' ? 15 : 0;
  return bGold + chGold + bAGold;
}
function spentGold(){
  let total = 0;
  for(const [name, qty] of Object.entries(data.shop.purchases||{})){
    const item = findShopItem(name);
    if(item) total += item.c * qty;
  }
  return total;
}
function findShopItem(name){
  for(const cat of Object.values(SHOP)){
    const found = cat.items.find(i=>i.n===name);
    if(found) return found;
  }
  return null;
}
function renderShop(){
  const remaining = startingGold() - spentGold();
  const purchases = data.shop.purchases||{};
  let html = `<h2>Loja — Gaste seu Dinheiro Inicial</h2>
  <div class="intro">Itens filtrados pelo que o Bruxo pode usar: só Armas Simples e Armadura Leve aparecem (sem proficiência com armas Marciais ou armaduras Média/Pesada). Equipamento de aventura vale pra qualquer um.</div>
  <div class="wallet">
    <div><div class="label">Ouro Inicial</div><div style="font-size:0.85rem;color:var(--parchment-dim);">${fmtGold(startingGold())} PO</div></div>
    <div style="text-align:right;"><div class="label">Restante</div><div class="value ${remaining<0?'negative':''}">${fmtGold(remaining)} PO</div></div>
  </div>`;

  Object.entries(SHOP).forEach(([catName, cat])=>{
    if(cat.filterProf && cat.filterProf!==BRUXO.weaponProf && cat.filterProf!==BRUXO.armorProf) return;
    html += `<h3>${catName}</h3>
    <table class="shop-table"><thead><tr><th>Item</th><th>Dano/Efeito</th><th>Propriedades</th><th>Custo</th><th>Qtd.</th></tr></thead><tbody>
    ${cat.items.map(it=>{
      const qty = purchases[it.n]||0;
      const contHtml = it.cont ? `<div style="font-size:0.68rem; color:var(--parchment-dim); font-style:italic; margin-top:2px; max-width:220px;">${it.cont}</div>` : '';
      return `<tr>
        <td>${it.n}${contHtml}</td><td>${it.d}</td><td style="color:var(--parchment-dim);font-size:0.78rem;">${it.p}</td>
        <td>${fmtGold(it.c)} PO</td>
        <td><div class="qty-cell">
          <button class="btn small" data-fn="shopDec" data-pick="${it.n}">−</button>
          <input type="number" min="0" value="${qty}" data-fn="shopSet" data-item="${it.n}">
          <button class="btn small" data-fn="shopInc" data-pick="${it.n}">+</button>
        </div></td>
      </tr>`;
    }).join('')}
    </tbody></table>`;
  });

  const cartEntries = Object.entries(purchases).filter(([,q])=>q>0);
  if(cartEntries.length){
    html += `<h3>Carrinho</h3><div class="cart-list">${cartEntries.map(([n,q])=>{
      const item = findShopItem(n);
      return `<div class="cart-item"><span>${n} ×${q}</span><span>${fmtGold(item.c*q)} PO</span></div>`;
    }).join('')}</div>`;
  }

  html += nav(canAdvance());
  return html;
}

function renderSummary(){
  const b = data.bruxo, t = data.tiefling, ch = data.charlatao;
  const finalScore = a => (data.attrs[a]||0) + getBonusFor(a);
  const prof = 2;
  const carMod = mod(finalScore('Carisma'));
  const conMod = mod(finalScore('Constituição'));
  const dexMod = mod(finalScore('Destreza'));
  const hp = 8 + conMod;
  const ac = 11 + dexMod;
  const dc = 8 + prof + carMod;
  const atkMagic = prof + carMod;
  const remaining = startingGold() - spentGold();
  const purchases = Object.entries(data.shop.purchases||{}).filter(([,q])=>q>0);

  return `<h2>Ficha Concluída</h2>
  <div class="intro">Revise abaixo. Clique em "Editar" pra voltar e mudar qualquer escolha — depois é só confirmar pra voltar aqui direto.</div>

  <div class="summary-section"><h3>Identidade <button class="edit-link" onclick="editSection(0)">Editar</button></h3>
  <div class="content">${data.classe} 1 · ${data.especie} (${t.tamanho}, Legado ${t.legado}) · Antecedente ${data.antecedente}</div></div>

  <div class="summary-section"><h3>Atributos <button class="edit-link" onclick="editSection(6)">Editar</button></h3>
  <div class="content">${ABILITIES.map(a=>`<span class="pill-static">${a} ${finalScore(a)} (${fmt(mod(finalScore(a)))})</span>`).join('')}</div></div>

  <div class="summary-section"><h3>Combate</h3>
  <div class="content">PV: ${hp} (1d8) · CA: ${ac} (Couro + Destreza) · CD de Magia: ${dc} · Ataque Mágico: ${fmt(atkMagic)}</div></div>

  <div class="summary-section"><h3>Perícias <button class="edit-link" onclick="editSection(5)">Editar</button></h3>
  <div class="content">${b.skills.map(s=>`<span class="pill-static">${s}</span>`).join('')}${CHARLATAO.skills.map(s=>`<span class="pill-static">${s}</span>`).join('')}</div></div>

  <div class="summary-section"><h3>Vínculo de Pacto, Truques e Magias <button class="edit-link" onclick="editSection(5)">Editar</button></h3>
  <div class="content">
    <b>${b.pactBoon}</b><br>
    Truques: ${[...b.cantrips, ...b.tomoCantrips].map(s=>`<span class="pill-static">${s}</span>`).join('')}<br>
    Magias: ${[...b.spells1, ...b.tomoRituals.map(r=>r+' (ritual)')].map(s=>`<span class="pill-static">${s}</span>`).join('')}
  </div></div>

  <div class="summary-section"><h3>Talento — Habilidoso <button class="edit-link" onclick="editSection(3)">Editar</button></h3>
  <div class="content">${ch.habilidoso.map(s=>`<span class="pill-static">${s}</span>`).join('')}</div></div>

  <div class="summary-section"><h3>Equipamento Inicial <button class="edit-link" onclick="editSection(3)">Editar</button></h3>
  <div class="content">
    ${(b.equipment==='A'?BRUXO.equipmentA:[BRUXO.equipmentB_gold+' PO']).map(s=>`<span class="pill-static">${s}</span>`).join('')}
    ${(ch.equipment==='A'?[...CHARLATAO.equipmentA, CHARLATAO.equipmentA_gold+' PO']:[CHARLATAO.equipmentB_gold+' PO']).map(s=>`<span class="pill-static">${s}</span>`).join('')}
  </div></div>

  <div class="summary-section"><h3>Compras na Loja <button class="edit-link" onclick="editSection(7)">Editar</button></h3>
  <div class="content">
    ${purchases.length ? purchases.map(([n,q])=>`<span class="pill-static">${n} ×${q}</span>`).join('') : '<span style="color:var(--parchment-dim);">Nenhuma compra.</span>'}
    <div style="margin-top:8px;font-family:'Cinzel',serif;color:var(--gold);">Dinheiro restante: ${fmtGold(remaining)} PO</div>
  </div></div>

  <div class="nav">
    <button class="btn" onclick="back()">← Voltar</button>
    <button class="btn primary" onclick="resetWizard()">Criar Outro Personagem</button>
  </div>`;
}

function resetWizard(){
  if(!confirm('Isso apaga o personagem atual e começa do zero. Continuar?')) return;
  step = 0;
  data = { especie:null, antecedente:null, classe:null,
    tiefling:{tamanho:null,legado:null,atributoLegado:null},
    charlatao:{abilityPlan:null,equipment:null,habilidoso:[]},
    bruxo:{skills:[],pactBoon:null,cantrips:[],tomoCantrips:[],spells1:[],tomoRituals:[],equipment:null},
    attrs:{}, shop:{purchases:{}}, returnToSummary:false };
  persist(); render();
}

function attachStepHandlers(){
  document.querySelectorAll('[data-fn]').forEach(el=>{
    if(el.tagName==='INPUT'){
      el.addEventListener('input', ()=>{
        const item = el.getAttribute('data-item');
        let v = parseInt(el.value)||0;
        if(v<0) v=0;
        shopSetQty(item, v);
      });
    } else {
      el.addEventListener('click', ()=>{
        const fn = el.getAttribute('data-fn');
        const val = el.getAttribute('data-pick');
        window[fn](val);
      });
    }
  });
}

function pickSpecies(v){ data.especie=v; persist(); render(); }
function pickBackground(v){ data.antecedente=v; persist(); render(); }
function pickClass(v){ data.classe=v; persist(); render(); }

function pickTamanho(v){ data.tiefling.tamanho=v; persist(); render(); }
function pickLegado(v){ data.tiefling.legado=v; persist(); render(); }
function pickAtributoLegado(v){ data.tiefling.atributoLegado=v; persist(); render(); }

function toggleBruxoSkill(v){ const s=data.bruxo.skills; const i=s.indexOf(v); if(i>=0)s.splice(i,1); else if(s.length<2)s.push(v); persist(); render(); }
function pickPactBoon(v){ data.bruxo.pactBoon=v; if(v!=='Pacto do Tomo'){data.bruxo.tomoCantrips=[];data.bruxo.tomoRituals=[];} persist(); render(); }
function toggleCantrip(v){ const s=data.bruxo.cantrips; const i=s.indexOf(v); if(i>=0)s.splice(i,1); else if(s.length<2)s.push(v); persist(); render(); }
function toggleTomoCantrip(v){ const s=data.bruxo.tomoCantrips; const i=s.indexOf(v); if(i>=0)s.splice(i,1); else if(s.length<3)s.push(v); persist(); render(); }
function toggleSpell1(v){ const s=data.bruxo.spells1; const i=s.indexOf(v); if(i>=0)s.splice(i,1); else if(s.length<2)s.push(v); persist(); render(); }
function toggleTomoRitual(v){ const s=data.bruxo.tomoRituals; const i=s.indexOf(v); if(i>=0)s.splice(i,1); else if(s.length<2)s.push(v); persist(); render(); }
function pickBruxoEquip(v){ data.bruxo.equipment=v; persist(); render(); }

function pickAbilityPlanType(v){ data.charlatao.abilityPlan = v==='1-1-1' ? {type:'1-1-1', plusOnes:[]} : {type:'2-1', plus2:null, plus1:null}; persist(); render(); }
function pickPlusOneOf3(v){
  const plan = data.charlatao.abilityPlan;
  if(!plan.plusOnes) plan.plusOnes=[];
  const i = plan.plusOnes.indexOf(v);
  if(i>=0) plan.plusOnes.splice(i,1); else if(plan.plusOnes.length<3) plan.plusOnes.push(v);
  persist(); render();
}
function pickPlus2(v){ data.charlatao.abilityPlan.plus2=v; if(data.charlatao.abilityPlan.plus1===v) data.charlatao.abilityPlan.plus1=null; persist(); render(); }
function pickPlus1(v){ data.charlatao.abilityPlan.plus1=v; persist(); render(); }
function pickCharEquip(v){ data.charlatao.equipment=v; persist(); render(); }
function toggleHabilidoso(v){ const s=data.charlatao.habilidoso; const i=s.indexOf(v); if(i>=0)s.splice(i,1); else if(s.length<3)s.push(v); persist(); render(); }

function setAttr(ability, value){
  if(value===''){
    delete data.attrs[ability];
  } else {
    const v = parseInt(value);
    // se outro atributo já tem esse valor, tira de lá (rouba/troca) antes de atribuir aqui
    for(const other of ABILITIES){
      if(other!==ability && data.attrs[other]===v){
        delete data.attrs[other];
        break;
      }
    }
    data.attrs[ability] = v;
  }
  persist(); render();
}

function shopSetQty(name, qty){
  if(!data.shop.purchases) data.shop.purchases={};
  if(qty<=0) delete data.shop.purchases[name];
  else data.shop.purchases[name]=qty;
  persist(); render();
}
function shopInc(name){ shopSetQty(name, (data.shop.purchases[name]||0)+1); }
function shopDec(name){ shopSetQty(name, Math.max(0,(data.shop.purchases[name]||0)-1)); }

async function init(){
  await restore();
  render();
}
init();
</script>
</body>
</html>
