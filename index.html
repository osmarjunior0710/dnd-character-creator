   🎓 LIÇÕES APRENDIDAS (aplicar sempre, não só quando alguém lembrar):
   - Antes de sair pesquisando algo no livro, perguntar se já existe um
     arquivo/planilha/anexo com a mesma informação — já aconteceu mais de
     uma vez de reprocessar o PDF quando a planilha de magias/talentos ou
     a de classes já tinha tudo parafraseado.
   - Se precisar abrir o livro mesmo assim, extrair só a página necessária
     (pdftotext -f/-l com o número certo do PDF, calculado contando
     marcadores de página \f no texto já extraído) em vez de reprocessar
     as 397 páginas de novo — funcionou bem quando a extração em coluna
     saiu bagunçada (caso da Ordem Primal do Druida).
   - Nomes vindos de fontes alternativas (ex: Unearthed Arcana) podem
     divergir da tradução "oficial" já usada no resto do app — sempre
     conferir contra a planilha oficial antes de assumir que é a mesma
     coisa ou uma coisa nova (caso do Psiônico: "Amizade"/"Prestidigitação"
     /"Sifão de Vida" do UA eram a mesma magia que "Amigos"/"Prestidigitação
     Arcana"/"Sifão Vital" já usados em outras classes).
   - Ao adicionar algo que parece seguir um padrão já visto em outra classe
     (Maestria em Arma, Ordem Divina/Primal, Estilo de Luta etc.), NÃO
     assumir que a redação é idêntica — conferir o texto exato no livro.
     Já rendeu descobertas reais: Bárbaro restringe Maestria em Arma a
     Corpo a Corpo, mas Paladino/Guerreiro/Ladino/Guardião não.
   - Fazer checagem cruzada por grep (campo usado no código vs. campo
     definido no const) depois de cada leva antes de entregar — pegou
     vários erros de digitação/campo esquecido ao longo da conversa.
   - Rodar `node --check` no bundle combinado (todos os data/*.js + o
     <script> principal extraído) antes de entregar — pega erro de
     sintaxe sem precisar de navegador (que não está disponível aqui).
   - Quando um arquivo de dados (classe, antecedente, espécie) não estiver
     disponível na conversa, NÃO recriar de memória — pedir pro usuário
     anexar, mesmo que pareça simples (risco de sobrescrever algo que já
     funciona com dados errados).
   - Depois de qualquer mudança estrutural (ex: inserir uma etapa nova no
     wizard), fazer uma varredura completa por TODOS os lugares que
     dependem de números de step/id (render(), canAdvance(),
     findFirstMissingGroup(), editSection(), goTo() hardcoded, ids
     grp-N-*) — é fácil esquecer um e deixar um botão "Editar" quebrado.

/* CLASSES = lista MESTRE pra grade de seleção (todas as 12 do PHB + qualquer
   homebrew/UA, como Psiônico). ENABLED_CLASSES = quais dessas já têm nível 1
   implementado. Adicionar uma classe nova em ENABLED_CLASSES sem também
   colocar em CLASSES faz ela nunca aparecer na tela (bug já aconteceu com
   o Psiônico — CLASSES só tinha as 12 do PHB por padrão). */
const CLASSES = ["Bárbaro","Bardo","Bruxo","Clérigo","Druida","Feiticeiro","Guardião","Guerreiro","Ladino","Mago","Monge","Paladino","Psiônico"];
const ENABLED_CLASSES = ["Bruxo","Bárbaro","Bardo","Mago","Paladino","Psiônico","Clérigo","Guerreiro","Ladino","Druida","Feiticeiro","Monge","Guardião"];

/* Mesmo padrão do BACKGROUND_DATA_KEY/BACKGROUND_CONST, mas pra classes.
   NUNCA hardcodar "data.classe==='Bárbaro' ? BARBARO : BRUXO" de novo em
   lugar nenhum novo — adicionar aqui em vez disso. Funções de RENDER e de
   validação (canAdvance/findFirstMissingGroup) do passo 1 continuam
   se ramificando por nome de classe (if/else), porque cada classe nível 1
   tem recursos bem diferentes entre si — só os campos COMUNS (equipamento,
   proficiências de arma/armadura, perícias) usam esses mapas. */
const CLASS_DATA_KEY = { "Bruxo":"bruxo", "Bárbaro":"barbaro", "Bardo":"bardo", "Mago":"mago", "Paladino":"paladino", "Psiônico":"psionico", "Clérigo":"clerigo", "Guerreiro":"guerreiro", "Ladino":"ladino", "Druida":"druida", "Feiticeiro":"feiticeiro", "Monge":"monge", "Guardião":"guardiao" };
const CLASS_CONST = { "Bruxo":BRUXO, "Bárbaro":BARBARO, "Bardo":BARDO, "Mago":MAGO, "Paladino":PALADINO, "Psiônico":PSIONICO, "Clérigo":CLERIGO, "Guerreiro":GUERREIRO, "Ladino":LADINO, "Druida":DRUIDA, "Feiticeiro":FEITICEIRO, "Monge":MONGE, "Guardião":GUARDIAO };
function activeClassData(){

function computeMaxPossibleGold(){
  const classMax = Math.max(...Object.values(CLASS_CONST).map(c =>
    Math.max(c.equipmentA_gold||0, c.equipmentB_gold||0, c.equipmentC_gold||0)));
  const bgMax = Math.max(...Object.values(BACKGROUND_CONST).map(b =>
    Math.max(b.equipmentA_gold||0, b.equipmentB_gold||0)));
  return classMax + bgMax;
}

async function restore(){
  try{
    const raw = localStorage.getItem('char_wizard_state');
    if(raw){
      const parsed = JSON.parse(raw);
      step = parsed.step || 0;
      data = Object.assign(data, parsed.data);
      if(!data.shop) data.shop = {purchases:{}};
      if(data.shop.filterByProf===undefined) data.shop.filterByProf = false;
      /* Migração de saves antigos: data.shop.purchases costumava ser
         chaveado pelo NOME de exibição do item (frágil — ver nota em
         data/shop-items.js), agora é chaveado pelo "id" estável. Se a
         chave já bate com um id válido, mantém; senão, tenta achar o
         item pelo NOME antigo e reescreve com o id certo. Chave que não
         bate com nada (item removido/renomeado sem deixar rastro) é
         descartada — mais seguro que manter uma compra órfã. */
      if(data.shop.purchases){
        const migrated = {};
        Object.entries(data.shop.purchases).forEach(([key, qty])=>{
          if(findShopItem(key)){ migrated[key] = qty; return; }
          const found = findShopItemByName(key);
          if(found) migrated[found.id] = qty;
        });
        data.shop.purchases = migrated;
      }
      /* Monge: save antigo pode não ter os campos de escolha de
         Ferramenta/Instrumento (adicionados quando o seletor de verdade
         foi implementado). */
      if(data.monge.toolCategory===undefined) data.monge.toolCategory = null;
      if(data.monge.toolChoice===undefined) data.monge.toolChoice = null;
      if(data.characterName===undefined) data.characterName = '';
      /* Espécies: garante que TODA chave de freshSpeciesData() exista em
         data (evita crash se um save antigo do navegador não tiver uma
         espécie mais recente que a gente adicionou depois) — mesma função
         usada por resetWizard(), pra não duplicar os defaults em dois
         lugares. */
      const speciesDefaults = freshSpeciesData();
      Object.keys(speciesDefaults).forEach(key=>{
        if(!data[key]) data[key] = speciesDefaults[key];
      });
      /* Antecedentes: garante que TODA chave de BACKGROUND_DATA_KEY exista
         em data (evita crash se um save antigo do navegador não tiver o
         antecedente mais recente que a gente adicionou depois). */
      Object.values(BACKGROUND_DATA_KEY).forEach(key=>{
        if(!data[key]) data[key] = { abilityPlan: null, equipment: null, habilidoso: [], ferramentaEscolhida: null, iniciadoCantrips: [], iniciadoSpell1: [] };
        if(!data[key].habilidoso) data[key].habilidoso = [];
        if(data[key].ferramentaEscolhida===undefined) data[key].ferramentaEscolhida = null;
        if(!data[key].iniciadoCantrips) data[key].iniciadoCantrips = [];
        if(!data[key].iniciadoSpell1) data[key].iniciadoSpell1 = [];
      });
      /* Migração de saves antigos: o Nobre usava um campo próprio kitJogos
         antes de virar o padrão genérico ferramentaEscolhida. */
      if(data.nobre.kitJogos && !data.nobre.ferramentaEscolhida){
        data.nobre.ferramentaEscolhida = data.nobre.kitJogos;
        delete data.nobre.kitJogos;
      }
      if(data.returnToSummary===undefined) data.returnToSummary = false;
      if(data.freeAbilityRule===undefined) data.freeAbilityRule = false;
    }
  }catch(e){}
}

function renderProgress(){
  const bar = document.getElementById('progressBar');
  bar.innerHTML='';
  for(let i=0;i<TOTAL_STEPS;i++){
    const seg = document.createElement('div');
    seg.className = 'seg' + (i<step?' done':'') + (i===step?' current':'');
    bar.appendChild(seg);
  }
}
function goTo(newStep){ step = newStep; persist(); render(); }
function next(){
  const missing = findFirstMissingGroup();
  if(!missing){ goTo(step+1); return; }
  scrollToMissing(missing);
}
function back(){ if(step>0) goTo(step-1); }

function findFirstMissingGroup(){
  switch(step){
    case 0: return data.classe ? null : 'grp-0-classe';
    case 1: {
      if(data.classe==='Bárbaro'){
        const bb = data.barbaro;
        if(bb.skills.length!==2) return 'grp-1-skills';
        if(bb.maestria.length!==BARBARO.maestriaCount) return 'grp-1-maestria';
        if(!bb.equipment) return 'grp-1-equipment';
        return null;
      }
      if(data.classe==='Bardo'){
        const bd = data.bardo;
        if(bd.skills.length!==BARDO.skillsCount) return 'grp-1-skills';
        if(bd.instruments.length!==BARDO.toolsCount) return 'grp-1-instruments';
        if(bd.cantrips.length!==2) return 'grp-1-cantrips';
        if(bd.spells1.length!==4) return 'grp-1-spells1';
        if(!bd.equipment) return 'grp-1-equipment';
        return null;
      }
      if(data.classe==='Mago'){
        const mg = data.mago;
        if(mg.skills.length!==2) return 'grp-1-skills';
        if(mg.cantrips.length!==MAGO.cantripsCount) return 'grp-1-cantrips';
        if(mg.spellbook.length!==MAGO.spellbookCount) return 'grp-1-spellbook';
        if(mg.prepared.length!==MAGO.preparedCount) return 'grp-1-prepared';
        if(!mg.equipment) return 'grp-1-equipment';
        return null;
      }
      if(data.classe==='Paladino'){
        const pl = data.paladino;
        if(pl.skills.length!==2) return 'grp-1-skills';
        if(pl.prepared.length!==PALADINO.preparedCount) return 'grp-1-prepared';
        if(pl.maestria.length!==PALADINO.maestriaCount) return 'grp-1-maestria';
        if(!pl.equipment) return 'grp-1-equipment';
        return null;
      }
      if(data.classe==='Psiônico'){
        const ps = data.psionico;
        if(ps.skills.length!==2) return 'grp-1-skills';
        if(ps.cantrips.length!==PSIONICO.cantripsCount) return 'grp-1-cantrips';
        if(ps.spells1.length!==PSIONICO.preparedCount) return 'grp-1-spells1';
        if(!ps.equipment) return 'grp-1-equipment';
        return null;
      }
      if(data.classe==='Clérigo'){
        const cl = data.clerigo;
        if(cl.skills.length!==2) return 'grp-1-skills';
        if(!cl.ordem) return 'grp-1-ordem';
        if(cl.cantrips.length!==clerigoEffectiveCantripsCount()) return 'grp-1-cantrips';
        if(cl.spells1.length!==CLERIGO.preparedCount) return 'grp-1-spells1';
        if(!cl.equipment) return 'grp-1-equipment';
        return null;
      }
      if(data.classe==='Guerreiro'){
        const gr = data.guerreiro;
        if(gr.skills.length!==2) return 'grp-1-skills';
        if(!gr.estilo) return 'grp-1-estilo';
        if(gr.maestria.length!==GUERREIRO.maestriaCount) return 'grp-1-maestria';
        if(!gr.equipment) return 'grp-1-equipment';
        return null;
      }
      if(data.classe==='Ladino'){
        const ld = data.ladino;
        if(ld.skills.length!==LADINO.skillsCount) return 'grp-1-skills';
        if(ld.especialista.length!==LADINO.especialistaCount) return 'grp-1-especialista';
        if(ld.maestria.length!==LADINO.maestriaCount) return 'grp-1-maestria';
        if(!ld.equipment) return 'grp-1-equipment';
        return null;
      }
      if(data.classe==='Druida'){
        const dr = data.druida;
        if(dr.skills.length!==2) return 'grp-1-skills';
        if(!dr.ordem) return 'grp-1-ordem';
        if(dr.cantrips.length!==druidaEffectiveCantripsCount()) return 'grp-1-cantrips';
        if(dr.spells1.length!==DRUIDA.preparedCount) return 'grp-1-spells1';
        if(!dr.equipment) return 'grp-1-equipment';
        return null;
      }
      if(data.classe==='Feiticeiro'){
        const ft = data.feiticeiro;
        if(ft.skills.length!==2) return 'grp-1-skills';
        if(ft.cantrips.length!==FEITICEIRO.cantripsCount) return 'grp-1-cantrips';
        if(ft.spells1.length!==FEITICEIRO.preparedCount) return 'grp-1-spells1';
        if(!ft.equipment) return 'grp-1-equipment';
        return null;
      }
      if(data.classe==='Monge'){
        const mk = data.monge;
        if(mk.skills.length!==2) return 'grp-1-skills';
        if(!mk.toolCategory) return 'grp-1-toolcategory';
        if(!mk.toolChoice) return 'grp-1-toolchoice';
        if(!mk.equipment) return 'grp-1-equipment';
        return null;
      }
      if(data.classe==='Guardião'){
        const gd = data.guardiao;
        if(gd.skills.length!==GUARDIAO.skillsCount) return 'grp-1-skills';
        if(gd.spells1.length!==GUARDIAO.preparedCount) return 'grp-1-spells1';
        if(gd.maestria.length!==GUARDIAO.maestriaCount) return 'grp-1-maestria';
        if(!gd.equipment) return 'grp-1-equipment';
        return null;
      }
      const b = data.bruxo;
      if(b.skills.length!==2) return 'grp-1-skills';
      if(!b.pactBoon) return 'grp-1-pact';
      if(b.cantrips.length!==2) return 'grp-1-cantrips';
      if(b.pactBoon==='Pacto do Tomo' && b.tomoCantrips.length!==3) return 'grp-1-tomocantrips';
      if(b.spells1.length!==2) return 'grp-1-spells1';
      if(b.pactBoon==='Pacto do Tomo' && b.tomoRituals.length!==2) return 'grp-1-tomorituals';
      if(!b.equipment) return 'grp-1-equipment';
      return null;
    }
    case 2: return data.antecedente ? null : 'grp-2-antecedente';
    case 3: {
      const bg = activeBgData();
      const plan = bg.abilityPlan;
      const planOk = plan && (plan.type==='2-1' ? (!!plan.plus2 && !!plan.plus1) : (plan.plusOnes||[]).length===3);
      if(!planOk) return 'grp-3-abilityplan';
      if(activeBgConst().ferramentaOpcoes && !bg.ferramentaEscolhida) return 'grp-3-ferramenta';
      if(activeBgConst().iniciadoEmMagia){
        if(bg.iniciadoCantrips.length!==2) return 'grp-3-iniciado-truques';
        if(bg.iniciadoSpell1.length!==1) return 'grp-3-iniciado-magia1';
      }
      if(activeBgConst().feat.startsWith('Habilidoso') && bg.habilidoso.length!==3) return 'grp-3-habilidoso';
      if(!bg.equipment) return 'grp-3-equipment';
      return null;
    }
    case 4: return data.especie ? null : 'grp-4-especie';
    case 5:
      if(data.especie==='Pequenino') return null;
      if(data.especie==='Anão') return null;
      if(data.especie==='Orc') return null;
      if(data.especie==='Humano'){
        if(!data.humano.tamanho) return 'grp-5-tamanho';
        if(!data.humano.pericia) return 'grp-5-pericia';
        if(!data.humano.talento) return 'grp-5-talento';
        return null;
      }
      if(data.especie==='Draconato') return data.draconato.heranca ? null : 'grp-5-heranca';
      if(data.especie==='Elfo'){
        if(!data.elfo.pericia) return 'grp-5-pericia';
        if(!data.elfo.linhagem) return 'grp-5-linhagem';
        return null;
      }
      if(data.especie==='Gnomo'){
        if(!data.gnomo.linhagem) return 'grp-5-linhagem';
        if(!data.gnomo.atributoLinhagem) return 'grp-5-atributo';
        return null;
      }
      if(data.especie==='Golias') return data.golias.ancestralidade ? null : 'grp-5-ancestralidade';
      if(data.especie==='Aasimar') return data.aasimar.tamanho ? null : 'grp-5-tamanho';
      if(!data.tiefling.tamanho) return 'grp-5-tamanho';
      if(!data.tiefling.legado) return 'grp-5-legado';
      if(!data.tiefling.atributoLegado) return 'grp-5-atributo';
      return null;
    case 6: {
      if(data.idiomas.comuns.length!==2) return 'grp-6-comuns';
      if(data.classe==='Ladino' && data.idiomas.extra.length!==1) return 'grp-6-extra';
      return null;
    }
    case 7: {
      const missingAbility = ABILITIES.find(a=>data.attrs[a]===undefined);
      return missingAbility ? 'grp-7-attr-'+missingAbility : null;
    }
    default: return null;
  }
}

function scrollToMissing(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.classList.remove('highlight-missing');
  void el.offsetWidth; // força reflow pra reiniciar a animação se já tiver rodado
  el.classList.add('highlight-missing');
  setTimeout(()=>el.classList.remove('highlight-missing'), 1600);
}

function nav(canNext){
  const summaryBtn = data.returnToSummary ? `<button class="btn primary" onclick="returnToSummaryNow()" style="margin-left:8px;">Voltar ao Resumo ✓</button>` : '';
  return `<div class="nav"><div class="nav-inner">
    <button class="btn" onclick="back()" ${step===0?'style="visibility:hidden"':''}>← Voltar</button>
    <div>
      <button class="btn primary" id="nextBtn" onclick="next()">${step===TOTAL_STEPS-1?'Concluir':'Avançar →'}</button>
      ${summaryBtn}
    </div>
  </div></div>`;
}
function editSection(idx){ data.returnToSummary=true; goTo(idx); }
function returnToSummaryNow(){
  const missing = findFirstMissingGroup();
  if(missing){ scrollToMissing(missing); return; }
  data.returnToSummary=false; goTo(9);
}

/* Antes disso era um switch(step) de ~80 linhas reimplementando, campo por
   campo, exatamente a mesma validação de findFirstMissingGroup() (só que
   devolvendo bool em vez do id do grupo faltante) — toda classe/espécie
   nova precisava ser atualizada nas DUAS funções, em dois formatos
   diferentes, e era fácil esquecer uma. Verificado caso a caso (steps 0-7)
   que as duas eram logicamente equivalentes; steps 8 (Loja) e 9 (Resumo)
   não têm campo obrigatório nas duas (findFirstMissingGroup cai no
   default:null igual canAdvance caía em true). */
function canAdvance(){
  return findFirstMissingGroup()===null;
}

/* ==========================================================================
   RANDOMIZAR (botão flutuante do lado esquerdo, mesma ideia/altura da
   Mochila) — pedido do usuário pra acelerar o preenchimento: escolhe
   aleatoriamente TODAS as escolhas da tela ATUAL (não do wizard inteiro).
   Reaproveita as MESMAS pools/filtros já usados por cada render*Detail()
   (skillsGrantedElsewhere, chosenCantripsElsewhere, chosenSpells1Elsewhere,
   speciesGrantedCantrips/Spells etc.) — nunca é sorteado algo que a UI não
   deixaria o jogador escolher manualmente (perícia/truque/magia duplicada
   entre fontes, por exemplo). Sempre faz um reroll completo do passo
   (zera os campos daquele passo antes de sortear de novo), não só preenche
   o que estiver vazio — clicar de novo sorteia tudo de novo. Não aparece
   na Loja (passo 8) nem no Resumo (passo 9): nenhum dos dois tem campo
   obrigatório (findFirstMissingGroup() sempre null ali), então não haveria
   o que randomizar. */
function randPick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randPickN(arr, n){
  const pool = [...arr];
  const out = [];
  while(out.length<n && pool.length){
    out.push(pool.splice(Math.floor(Math.random()*pool.length), 1)[0]);
  }
  return out;
}

function randomizeCurrentStep(){
  switch(step){
    case 0: data.classe = randPick(ENABLED_CLASSES); break;
    case 1: randomizeClassDetail(); break;
    case 2: data.antecedente = randPick(ENABLED_BACKGROUNDS); break;
    case 3: randomizeBackgroundDetail(); break;
    case 4: data.especie = randPick(ENABLED_SPECIES); break;
    case 5: randomizeSpeciesDetail(); break;
    case 6: randomizeIdiomasStep(); break;
    case 7: randomizeAttrsStep(); break;
    default: return;
  }
  persist();
  render();
}

function randomizeClassDetail(){
  const already = skillsGrantedElsewhere('classe');
  const alreadyCantrips = chosenCantripsElsewhere('classe');
  const alreadySpells1 = chosenSpells1Elsewhere('classe');
  const speciesCantrips = speciesGrantedCantrips();
  const speciesSpells = speciesGrantedSpells();

  if(data.classe==='Bárbaro'){
    const bb = data.barbaro;
    bb.skills = randPickN(BARBARO.skills.filter(s=>!already.includes(s)), 2);
    bb.maestria = randPickN(Object.keys(WEAPON_MASTERY).filter(n=>WEAPON_MASTERY[n].tipo==='Corpo a Corpo'), BARBARO.maestriaCount);
    bb.equipment = randPick(['A','B']);
  } else if(data.classe==='Bardo'){
    const bd = data.bardo;
    bd.skills = randPickN(ALL_SKILLS.filter(s=>!already.includes(s)), BARDO.skillsCount);
    bd.instruments = randPickN(ALL_INSTRUMENTS, BARDO.toolsCount);
    bd.cantrips = randPickN(BARDO.cantrips.filter(c=>!speciesCantrips.includes(c) && !alreadyCantrips.includes(c)), 2);
    bd.spells1 = randPickN(BARDO.spells1.filter(s=>!speciesSpells.includes(s) && !alreadySpells1.includes(s)), 4);
    bd.equipment = randPick(['A','B']);
  } else if(data.classe==='Mago'){
    const mg = data.mago;
    mg.skills = randPickN(MAGO.skills.filter(s=>!already.includes(s)), 2);
    mg.cantrips = randPickN(MAGO.cantrips.filter(c=>!speciesCantrips.includes(c) && !alreadyCantrips.includes(c)), MAGO.cantripsCount);
    mg.spellbook = randPickN(MAGO.spells1.filter(s=>!speciesSpells.includes(s) && !alreadySpells1.includes(s)), MAGO.spellbookCount);
    mg.prepared = randPickN(mg.spellbook, MAGO.preparedCount);
    mg.equipment = randPick(['A','B']);
  } else if(data.classe==='Paladino'){
    const pl = data.paladino;
    pl.skills = randPickN(PALADINO.skills.filter(s=>!already.includes(s)), 2);
    pl.prepared = randPickN(PALADINO.spells1.filter(s=>!speciesSpells.includes(s) && !alreadySpells1.includes(s)), PALADINO.preparedCount);

  } else if(data.classe==='Psiônico'){
    const ps = data.psionico;

    ps.cantrips = randPickN(PSIONICO.cantrips.filter(c=>!speciesCantrips.includes(c) && !alreadyCantrips.includes(c)), PSIONICO.cantripsCount);
    ps.spells1 = randPickN(PSIONICO.spells1.filter(s=>!speciesSpells.includes(s) && !alreadySpells1.includes(s)), PSIONICO.preparedCount);
    ps.equipment = randPick(['A','B']);
  } else if(data.classe==='Clérigo'){
    const cl = data.clerigo;
    cl.skills = randPickN(CLERIGO.skills.filter(s=>!already.includes(s)), 2);
    cl.ordem = randPick(Object.keys(CLERIGO.ordemDivina));
    const cantripsMax = clerigoEffectiveCantripsCount();
    cl.cantrips = randPickN(CLERIGO.cantrips.filter(c=>!speciesCantrips.includes(c) && !alreadyCantrips.includes(c)), cantripsMax);
    cl.spells1 = randPickN(CLERIGO.spells1.filter(s=>!speciesSpells.includes(s) && !alreadySpells1.includes(s)), CLERIGO.preparedCount);
    cl.equipment = randPick(['A','B']);
  } else if(data.classe==='Guerreiro'){
    const gr = data.guerreiro;

    gr.estilo = randPick(Object.keys(GUERREIRO.estiloDeLuta));
    gr.maestria = randPickN(Object.keys(WEAPON_MASTERY), GUERREIRO.maestriaCount);
    gr.equipment = randPick(['A','B','C']);
  } else if(data.classe==='Ladino'){
    const ld = data.ladino;
    ld.skills = randPickN(LADINO.skills.filter(s=>!already.includes(s)), LADINO.skillsCount);
    const bgConst = activeBgConst();
    const jaProficiente = [...new Set([...ld.skills, ...bgConst.skills, ...activeBgData().habilidoso])].filter(s=>ALL_SKILLS.includes(s));
    ld.especialista = randPickN(jaProficiente, LADINO.especialistaCount);
    ld.maestria = randPickN(Object.keys(WEAPON_MASTERY).filter(n=>{
      const w = WEAPON_MASTERY[n];
      return w.categoria==='Simples' || w.propriedades.includes('Acuidade') || w.propriedades.includes('Leve');
    }), LADINO.maestriaCount);
    ld.equipment = randPick(['A','B']);
  } else if(data.classe==='Druida'){
    const dr = data.druida;
    dr.skills = randPickN(DRUIDA.skills.filter(s=>!already.includes(s)), 2);
    dr.ordem = randPick(Object.keys(DRUIDA.ordemPrimal));
    const cantripsMax = druidaEffectiveCantripsCount();
    dr.cantrips = randPickN(DRUIDA.cantrips.filter(c=>!speciesCantrips.includes(c) && !alreadyCantrips.includes(c)), cantripsMax);
    dr.spells1 = randPickN(DRUIDA.spells1.filter(s=>s!=='Falar com Animais' && !speciesSpells.includes(s) && !alreadySpells1.includes(s)), DRUIDA.preparedCount);
    dr.equipment = randPick(['A','B']);
  } else if(data.classe==='Feiticeiro'){
    const ft = data.feiticeiro;
    ft.skills = randPickN(FEITICEIRO.skills.filter(s=>!already.includes(s)), 2);
    ft.cantrips = randPickN(FEITICEIRO.cantrips.filter(c=>!speciesCantrips.includes(c) && !alreadyCantrips.includes(c)), FEITICEIRO.cantripsCount);

    mk.skills = randPickN(MONGE.skills.filter(s=>!already.includes(s)), 2);
    mk.toolCategory = randPick(MONGE.toolCategories);
    mk.toolChoice = randPick(mk.toolCategory==='Instrumento Musical' ? ALL_INSTRUMENTS : ALL_ARTISAN_TOOLS);
    mk.equipment = randPick(['A','B']);
  } else if(data.classe==='Guardião'){
    const gd = data.guardiao;
    gd.skills = randPickN(GUARDIAO.skills.filter(s=>!already.includes(s)), GUARDIAO.skillsCount);
    gd.spells1 = randPickN(GUARDIAO.spells1.filter(s=>s!=='Marca do Predador' && !speciesSpells.includes(s) && !alreadySpells1.includes(s)), GUARDIAO.preparedCount);
    gd.maestria = randPickN(Object.keys(WEAPON_MASTERY), GUARDIAO.maestriaCount);
    gd.equipment = randPick(['A','B']);
  } else {
    const b = data.bruxo;
    b.skills = randPickN(BRUXO.skills.filter(s=>!already.includes(s)), 2);
    b.pactBoon = randPick(Object.keys(BRUXO.pactBoons));
    b.cantrips = randPickN(BRUXO.cantrips.filter(c=>!speciesCantrips.includes(c) && !alreadyCantrips.includes(c)), 2);
    b.tomoCantrips = b.pactBoon==='Pacto do Tomo' ? randPickN(ALL_CANTRIPS.filter(c=>!b.cantrips.includes(c) && !speciesCantrips.includes(c) && !alreadyCantrips.includes(c)), 3) : [];
    b.spells1 = randPickN(BRUXO.spells1.filter(s=>!speciesSpells.includes(s) && !alreadySpells1.includes(s)), 2);
    b.tomoRituals = b.pactBoon==='Pacto do Tomo' ? randPickN(ALL_1ST_RITUAL.filter(r=>!b.spells1.includes(r) && !speciesSpells.includes(r) && !alreadySpells1.includes(r)), 2) : [];
    b.equipment = randPick(['A','B']);
  }
}

function randomizeBackgroundDetail(){
  const bgConst = activeBgConst();
  const bg = activeBgData();
  const allowed = allowedAbilitiesFor(bgConst);
  const planType = randPick(['2-1','1-1-1']);
  if(planType==='2-1'){
    const [plus2, plus1] = randPickN(allowed, 2);
    bg.abilityPlan = {type:'2-1', plus2, plus1};
  } else {
    bg.abilityPlan = {type:'1-1-1', plusOnes: randPickN(allowed, 3)};
  }
  if(bgConst.ferramentaOpcoes) bg.ferramentaEscolhida = randPick(bgConst.ferramentaOpcoes);
  if(bgConst.iniciadoEmMagia){
    bg.iniciadoCantrips = randPickN(bgConst.iniciadoEmMagia.cantrips.filter(c=>!speciesGrantedCantrips().includes(c) && !chosenCantripsElsewhere('iniciadoEmMagia').includes(c)), 2);
    bg.iniciadoSpell1 = randPickN(bgConst.iniciadoEmMagia.spells1.filter(s=>!speciesGrantedSpells().includes(s) && !chosenSpells1Elsewhere('iniciadoEmMagia').includes(s)), 1);
  }
  if(bgConst.feat.startsWith('Habilidoso')){
    const excludedTool = bgConst.ferramentaOpcoes ? (bg.ferramentaEscolhida || bgConst.ferramentaCategoria) : bgConst.tool;

  }

}

function randomizeSpeciesDetail(){
  if(data.especie==='Pequenino' || data.especie==='Anão' || data.especie==='Orc') return;
  if(data.especie==='Humano'){
    const h = data.humano;
    h.tamanho = randPick(HUMANO.tamanho.opcoes);
    h.pericia = randPick(ALL_SKILLS.filter(s=>!skillsGrantedElsewhere('humano').includes(s)));
    const talentosOrigem = Object.keys(FEAT_DETAILS).filter(n=>FEAT_DETAILS[n].categoria==='Origem' && n!==backgroundFeatBaseName());
    const talentosSelvagens = Object.keys(FEAT_DETAILS).filter(n=>FEAT_DETAILS[n].categoria==='Talento Selvagem' && n!==backgroundFeatBaseName());
    h.talento = randPick([...talentosOrigem, ...talentosSelvagens]);
  } else if(data.especie==='Draconato'){
    data.draconato.heranca = randPick(DRACONATO.subespecie.opcoes.map(o=>o.nome));
  } else if(data.especie==='Elfo'){
    const e = data.elfo;
    e.pericia = randPick(ELFO.sentidosAgucados.opcoes.filter(s=>!skillsGrantedElsewhere('elfo').includes(s)));
    e.linhagem = randPick(ELFO.subespecie.opcoes.map(o=>o.nome));
  } else if(data.especie==='Gnomo'){
    data.gnomo.linhagem = randPick(GNOMO.subespecie.opcoes.map(o=>o.nome));
    data.gnomo.atributoLinhagem = randPick(['Inteligência','Sabedoria','Carisma']);
  } else if(data.especie==='Golias'){
    data.golias.ancestralidade = randPick(GOLIAS.subespecie.opcoes.map(o=>o.nome));
  } else if(data.especie==='Aasimar'){
    data.aasimar.tamanho = randPick(AASIMAR.tamanho.opcoes);
  } else {
    const t = data.tiefling;
    t.tamanho = randPick(TIEFLING.tamanho.opcoes);
    t.legado = randPick(TIEFLING.subespecie.opcoes.map(o=>o.nome));
    t.atributoLegado = randPick(['Inteligência','Sabedoria','Carisma']);
  }
}

function randomizeIdiomasStep(){
  const id = data.idiomas;
  id.comuns = randPickN(COMMON_LANGUAGES, 2);
  if(data.classe==='Ladino'){
    const pool = [...COMMON_LANGUAGES, ...RARE_LANGUAGES].filter(l => l!=='Gíria dos Ladrões' && !id.comuns.includes(l));
    id.extra = randPickN(pool, 1);
  } else {
    id.extra = [];
  }
}

function randomizeAttrsStep(){
  const shuffled = randPickN(STANDARD_ARRAY, STANDARD_ARRAY.length);
  data.attrs = {};
  ABILITIES.forEach((a,i)=>{ data.attrs[a] = shuffled[i]; });
}

function render(){
  renderProgress();
  const c = document.getElementById('cardContent');
  let html = '';
  if(step===0) html = renderClassStep();
  else if(step===1) html = (data.classe==='Bárbaro') ? renderBarbaroDetail() : (data.classe==='Bardo') ? renderBardoDetail() : (data.classe==='Mago') ? renderMagoDetail() : (data.classe==='Paladino') ? renderPaladinoDetail() : (data.classe==='Psiônico') ? renderPsionicoDetail() : (data.classe==='Clérigo') ? renderClerigoDetail() : (data.classe==='Guerreiro') ? renderGuerreiroDetail() : (data.classe==='Ladino') ? renderLadinoDetail() : (data.classe==='Druida') ? renderDruidaDetail() : (data.classe==='Feiticeiro') ? renderFeiticeiroDetail() : (data.classe==='Monge') ? renderMongeDetail() : (data.classe==='Guardião') ? renderGuardiaoDetail() : renderBruxoDetail();
  else if(step===2) html = renderBackgroundStep();
  else if(step===3) html = renderSimpleBackgroundDetail(activeBgConst());
  else if(step===4) html = renderSpeciesStep();
  else if(step===5) html = (data.especie==='Pequenino') ? renderPequeninoDetail() : (data.especie==='Anão') ? renderAnaoDetail() : (data.especie==='Orc') ? renderOrcDetail() : (data.especie==='Humano') ? renderHumanoDetail() : (data.especie==='Draconato') ? renderDraconatoDetail() : (data.especie==='Elfo') ? renderElfoDetail() : (data.especie==='Gnomo') ? renderGnomoDetail() : (data.especie==='Golias') ? renderGoliasDetail() : (data.especie==='Aasimar') ? renderAasimarDetail() : renderTieflingDetail();
  else if(step===6) html = renderIdiomasStep();
  else if(step===7) html = renderAttrs();
  else if(step===8) html = renderShop();
  else if(step===9) html = renderSummary();
  c.innerHTML = html + renderMochilaFloater() + renderRandomizarFloater() + renderChangelogPopup();
  attachStepHandlers();
  positionMochilaFloater();
  positionRandomizarFloater();
}

/* Lista de escolha de truques/magias, com botão "ⓘ" que expande um card de detalhe
   (tempo, alcance, componentes, duração, efeito, escalonamento) sem afetar a seleção.
   `items` já vem filtrado pelo chamador (tira o que outra fonte já concede/escolheu —
   ver chosenCantripsElsewhere()/speciesGrantedCantrips() etc.), mas esse filtro é
   sobre o ESTADO ATUAL, que pode mudar DEPOIS de uma escolha já feita (ex: escolher
   um truque no Passo 1 e só depois, no Passo 5, escolher uma espécie que passa a
   conceder esse mesmo truque de graça). Achado real de usuário: se o nome
   escolhido não está mais em `items`, a pill sumia da tela inteira, sem aviso, e a
   contagem "X/N escolhidas" ficava presa (ocupando uma vaga invisível, sem dar pra
   trocar por outra coisa). Agora QUALQUER nome de `selectedList` sempre aparece,
   mesmo se caiu fora de `items` — marcado como "extra" (pill-orphan) pra deixar
   claro que precisa de atenção, mas continua clicável pra desmarcar e liberar a
   vaga. */
function spellChoiceList(items, selectedList, maxTotal, toggleFn){
  const orphans = selectedList.filter(name=>!items.includes(name));
  const allNames = [...items, ...orphans];
  return `<div class="check-list" style="margin-bottom:6px;">${allNames.map(name=>{
    const sel = selectedList.includes(name);
    const disabled = !sel && selectedList.length>=maxTotal;
    const isOrphan = orphans.includes(name);
    const detail = SPELL_DETAILS[name];
    const isExpanded = expandedSpellInfo===name;
    return `<div class="spell-pill-wrap ${isExpanded?'expanded':''}">
      <span class="check-pill ${sel?'selected':''} ${disabled?'disabled':''} ${isOrphan?'pill-orphan':''}" ${disabled?'':`data-pick="${name}" data-fn="${toggleFn}"`} ${isOrphan?'title="Já vem de outra fonte agora (ex: espécie) — considere trocar por outro"':''}>${name}${isOrphan?' ⚠️':''}</span>
      ${detail?`<button class="info-btn ${isExpanded?'active':''}" data-pick="${name}" data-fn="toggleSpellInfo" title="Ver detalhes">ⓘ</button>`:''}
      ${isExpanded && detail ? renderSpellDetailCard(detail) : ''}
    </div>`;
  }).join('')}</div>`;
}

/* Pills para itens ESPECÍFICOS concedidos de graça que existem numa lista
   nossa (magia/truque hoje — perícia/talento quando tivermos os bancos
   correspondentes). NÃO usar para o traço inteiro — só para o nome exato
   do item (ex: "Taumaturgia", "Rajada de Veneno"). O botão "ⓘ" só aparece
   se houver detalhe pra mostrar (hoje: banco de magias). */
function grantedItemList(items){
  if(!items || items.length===0) return '';
  return `<div class="check-list" style="margin:8px 0 2px;">${items.map(it=>{
    const isExpanded = expandedTraitInfo===it.nome;
    const spellDetail = SPELL_DETAILS[it.nome];
    return `<div class="spell-pill-wrap ${isExpanded?'expanded':''}">
      <span class="check-pill selected">${it.nome}</span>
      ${spellDetail?`<button class="info-btn ${isExpanded?'active':''}" data-pick="${it.nome}" data-fn="toggleTraitInfo" title="Ver detalhes">ⓘ</button>`:''}
      ${isExpanded && spellDetail ? renderSpellDetailCard(spellDetail) : ''}
    </div>`;
  }).join('')}</div>`;
}

/* Caixa de traço concedido (texto completo + pills dos itens específicos que
   ele concede, se houver). Usada tanto pros traços fixos quanto, dentro da
   escolha de subespécie, pra cada bloco de nível. */
function traitBox(nome, resumo, concede){
  return `<div class="option-block">
    <h3 style="color:var(--gold);margin-top:0;">${nome}</h3>
    ${resumo?`<p>${resumo}</p>`:''}

}

/* Lista de escolha ÚNICA de talento, filtrada por categoria (ex: só "Origem"
   pro Versátil do Humano), com botão "ⓘ" que mostra a ficha do banco de
   talentos (categoria, pré-requisito, benefícios, página). */
function featPickList(names, selected, pickFn){
  return `<div class="check-list" style="margin-bottom:6px;">${names.map(name=>{
    const sel = selected===name;
    const isExpanded = expandedTraitInfo===name;
    const detail = FEAT_DETAILS[name];
    return `<div class="spell-pill-wrap ${isExpanded?'expanded':''}">
      <span class="check-pill ${sel?'selected':''}" data-pick="${name}" data-fn="${pickFn}">${name}</span>
      ${detail?`<button class="info-btn ${isExpanded?'active':''}" data-pick="${name}" data-fn="toggleTraitInfo" title="Ver detalhes">ⓘ</button>`:''}
      ${isExpanded && detail ? renderFeatDetailCard(detail) : ''}
    </div>`;
  }).join('')}</div>`;
}

function choiceGrid(list, enabledList, selected, onClickName){
  return `<div class="choice-grid">${list.map(n=>{
    const enabled = enabledList.includes(n);
    const sel = selected===n;
    return `<div class="choice ${enabled?'':'disabled'} ${sel?'selected':''}" ${enabled?`data-pick="${n}" data-fn="${onClickName}"`:''}>
      ${n}${enabled?'':'<span class="note">em breve</span>'}
    </div>`;
  }).join('')}</div>`;
}

/* Renderiza uma lista de escolha (checkbox-pill) separada em mini-grupos com cabeçalho,
   pra quando o talento/recurso permite escolher entre categorias diferentes
   (ex: Atributos / Perícias / Ferramentas). Grupos vazios não aparecem.
   Mesma correção de spellChoiceList(): se uma perícia já escolhida caiu fora de
   TODOS os grupos (porque outra fonte passou a concedê-la depois, filtrada via
   skillsGrantedElsewhere() no chamador), não pode simplesmente sumir da tela —
   isso escondia a escolha E prendia a vaga (contagem "X/N" sem dar pra trocar).
   Aparece num grupo extra no fim, marcada, ainda clicável pra desmarcar. */
function groupedChoiceList(groups, selectedList, maxTotal, toggleFn){
  const groupedNames = new Set();
  groups.forEach(g=>g.items.forEach(item=>groupedNames.add(item)));
  const orphans = selectedList.filter(item=>!groupedNames.has(item));
  const allGroups = orphans.length ? [...groups, {label:'⚠️ Verifique — já vem de outra fonte', items:orphans, orphan:true}] : groups;
  return allGroups.filter(g=>g.items.length>0).map(g=>`
    <div class="check-list" style="margin-bottom:10px; align-items:center;">
      <span class="group-label" style="margin:0 2px 0 0;">${g.label}:</span>
      ${g.items.map(item=>{
        const sel = selectedList.includes(item);
        const disabled = !sel && selectedList.length>=maxTotal;
        const isOrphan = !!g.orphan;
        return `<div class="check-pill ${sel?'selected':''} ${disabled?'disabled':''} ${isOrphan?'pill-orphan':''}" ${disabled?'':`data-pick="${item}" data-fn="${toggleFn}"`} ${isOrphan?'title="Já vem de outra fonte agora — considere trocar por outra"':''}>${item}</div>`;
      }).join('')}
    </div>`).join('');
}

function choiceGridWithInfo(list, enabledList, selected, onClickName, infoMap){
  return `<div class="choice-grid">${list.map(n=>{
    const enabled = enabledList.includes(n);
    const sel = selected===n;
    const info = infoMap && infoMap[n];
    let infoHtml = '';
    if(info){
      const fields = [...(info.fields||[])];
      if(info.talentoNome){
        fields.unshift(["Talento", `${info.talentoNome} <i style="color:var(--parchment-dim);">(${info.talentoDesc})</i>`]);
      }
      if(info.descricao){
        infoHtml += `<span class="note" style="display:block;font-style:italic;text-align:left;margin-top:6px;">${info.descricao}</span>`;
      }
      infoHtml += `<span class="note" style="display:block;text-align:left;line-height:1.4;margin-top:6px;">
        ${fields.map(([label,val])=>`<b>${label}:</b> ${val}`).join('<br>')}
      </span>`;
    } else if(!enabled){
      infoHtml = '<span class="note">em breve</span>';
    }
    return `<div class="choice ${enabled?'':'disabled'} ${sel?'selected':''}" ${enabled?`data-pick="${n}" data-fn="${onClickName}"`:''}>
      ${n}${infoHtml}
    </div>`;
  }).join('')}</div>`;
}

/* Agrupa uma lista de perícias pelos 6 atributos (Força, Destreza, ...),
   na mesma ordem de ABILITIES. Grupos sem nenhuma perícia da lista dada
   simplesmente não aparecem — não precisa filtrar manualmente na chamada. */
function skillGroupsByAbility(skillList){
  return ABILITIES.map(ab => ({
    label: ab,
    items: skillList.filter(s => SKILL_ABILITY[s]===ab)
  }));
}

/* Mesma ideia do skillGroupsByAbility, mas agrupando idiomas em Comuns/
   Raros em vez de por atributo — usado no passo de Idiomas. */
function languageGroupsByCategory(pool){
  return [
    { label: "Comuns", items: pool.filter(l => COMMON_LANGUAGES.includes(l)) },
    { label: "Raros", items: pool.filter(l => RARE_LANGUAGES.includes(l)) }
  ];
}

/* Igual ao groupedChoiceList, mas de escolha ÚNICA (radio, não checkbox) —
   usado quando só se pode marcar 1 item no total, como o Hábil do Humano. */
function groupedSinglePick(groups, selected, pickFn){
  return groups.filter(g=>g.items.length>0).map(g=>`
    <div class="check-list" style="margin-bottom:10px; align-items:center;">
      <span class="group-label" style="margin:0 2px 0 0;">${g.label}:</span>
      ${g.items.map(item=>`<div class="check-pill ${selected===item?'selected':''}" data-pick="${item}" data-fn="${pickFn}">${item}</div>`).join('')}
    </div>`).join('');
}

/* Mostra as opções de tamanho de uma espécie. Se só existe UMA opção, ela
   aparece já pré-selecionada e travada (mesmo padrão de "traço concedido"
   que usamos em outros lugares) — sem texto avisando que é única. Se
   existirem 2+ opções, vira a lista interativa normal. */
function tamanhoPickList(tamanho, selected, pickFn){
  if(tamanho.opcoes.length===1){
    const unica = tamanho.opcoes[0];
    return `<div class="check-list" style="margin-bottom:20px;">
      <div class="check-pill selected">${unica} <span style="opacity:0.65;font-size:0.85em;">(${tamanho.alturas[unica]})</span></div>
    </div>`;
  }
  return `<div class="check-list" style="margin-bottom:20px;">
    ${tamanho.opcoes.map(s=>`<div class="check-pill ${selected===s?'selected':''}" data-pick="${s}" data-fn="${pickFn}">${s} <span style="opacity:0.65;font-size:0.85em;">(${tamanho.alturas[s]})</span></div>`).join('')}
  </div>`;
}

/* Antecedente "genérico": cobre TODO antecedente, incluindo os de
   ferramenta-por-escolha (Nobre, Artesão, Artista, Guarda, Soldado — via
   bgConst.ferramentaCategoria/ferramentaOpcoes) e os de talento fixo sem
   escolha nenhuma (Sortudo, Alerta, Curandeiro, Vigoroso, Valentão de
   Taverna etc. — nesse caso o bloco de Habilidoso simplesmente não
   aparece). O placeholder "{ferramenta}" dentro de bgConst.equipmentA é
   substituído pelo tipo escolhido (ou pelo nome da categoria, se ainda não
   escolheu) — ver resolvedEquipmentA(). */
function resolvedEquipmentA(bgConst, bg){
  if(!bgConst.ferramentaOpcoes) return bgConst.equipmentA;
  const chosen = bg.ferramentaEscolhida || bgConst.ferramentaCategoria;
  return bgConst.equipmentA.map(item => item==='{ferramenta}' ? chosen : item);
}

/* Mesma ideia de resolvedEquipmentA(), mas pro lado da CLASSE: só o
   Bardo ("Instrumento Musical à escolha") e o Monge ("Ferramenta/
   Instrumento escolhido") têm placeholder de equipamento — reaproveita
   a escolha que o jogador já fez em outro lugar (Bardo: o 1º dos 3
   instrumentos de data.bardo.instruments; Monge: data.monge.toolChoice,
   escolhido no próprio passo 1). Funciona pra equipmentA/B/C de
   qualquer classe — é um no-op pras que não têm esses textos. */
function resolvedClassEquipmentList(list){
  if(!list) return [];
  return list.map(item => {
    if(item==='Instrumento Musical à escolha') return (data.bardo.instruments && data.bardo.instruments.length) ? data.bardo.instruments[0] : item;
    if(item==='Ferramenta/Instrumento escolhido') return data.monge.toolChoice || item;
    return item;
  });
}

/* Acha um item da Loja pelo NOME de exibição (não pelo id) — usado só
   pra RESOLVER equipamento inicial contra a Loja (equipamento inicial é
   texto livre, então o cruzamento tem que ser por nome mesmo) e na
   migração de saves antigos em restore(). Em qualquer outro lugar do
   código, usar findShopItem(id). */
function findShopItemByName(name){
  for(const cat of Object.values(SHOP)){
    const found = cat.items.find(i=>i.n===name);
    if(found) return found;
  }
  return null;
}

/* Resolve UM texto de equipamento inicial (já com qualquer placeholder
   de classe/antecedente substituído, ver resolvedClassEquipmentList()/
   resolvedEquipmentA() acima) pro id real da Loja, quando existir.
   Ordem: 1) EQUIPMENT_ALIASES (data/equipment-aliases.js — cobre
   quantidade embutida tipo "20 Flechas" e formatação diferente tipo
   "Foco Arcano (orbe)"); 2) match exato de nome; 3) variante de Kit de
   Jogos escolhida via {ferramenta} (Guarda/Nobre/Soldado — a Loja só
   vende 1 item genérico "Kit de Jogos", nenhuma variante bate sozinha);
   4) sem resolução — vira item de sabor na mochila, sem id (ex:
   "Símbolo Sagrado" sozinho, ambíguo entre as 3 variantes vendidas). */
function resolveEquipmentText(text){
  if(Object.prototype.hasOwnProperty.call(EQUIPMENT_ALIASES, text)){
    const alias = EQUIPMENT_ALIASES[text];
    return alias ? {label:text, id:alias.id, qty:alias.qty} : {label:text, id:null, qty:1};
  }
  const exact = findShopItemByName(text);
  if(exact) return {label:text, id:exact.id, qty:1};
  if(ALL_GAME_SETS.includes(text)) return {label:text, id:'kit-de-jogos', qty:1};
  return {label:text, id:null, qty:1};
}

/* Todos os itens que o personagem já TEM antes de entrar na Loja —
   resolvidos da Opção de equipamento escolhida na classe (A/B/C — C só
   dá ouro, sem itens) e do antecedente (A só, B só dá ouro). Cada item
   vem como {label, id, qty}; id é null quando o texto não bate com
   nenhum item real da Loja (item de sabor, ver resolveEquipmentText()).
   Base da "mochila do jogador" (renderMochilaFloater()/renderMochilaPopup()). */
function characterStartingItems(){
  const clsConst = activeClassConst();
  const cls = activeClassData();
  const bgConst = activeBgConst();
  const bg = activeBgData();
  const items = [];
  const clsList = cls.equipment==='A' ? clsConst.equipmentA : cls.equipment==='B' ? clsConst.equipmentB : null;
  resolvedClassEquipmentList(clsList).forEach(text => items.push(resolveEquipmentText(text)));
  if(bg.equipment==='A'){
    resolvedEquipmentA(bgConst, bg).forEach(text => items.push(resolveEquipmentText(text)));
  }
  return items;
}

/* Agrupa characterStartingItems() por item (soma quantidade se a mesma
   coisa vier de duas fontes) e resolve o nome de EXIBIÇÃO pro nome
   canônico da Loja quando tem id (senão usa o texto original). */
function mochilaItems(){
  const grouped = {};
  characterStartingItems().forEach(({label, id, qty})=>{
    const key = id || ('flavor:'+label);
    if(!grouped[key]) grouped[key] = {label: id ? findShopItem(id).n : label, qty:0};
    grouped[key].qty += qty;
  });
  return Object.values(grouped);
}

/* Floater "Mochila" (canto superior direito, sempre visível a partir do
   momento em que há classe ou antecedente escolhido) + popup — itens
   herdados da escolha de equipamento de classe/antecedente + o que já
   foi comprado na Loja. Fecha o gap que existia antes: o equipamento
   inicial só aparecia no passo em que era escolhido e de novo no
   Resumo final, sumindo do resto do fluxo (incluindo a Loja inteira).
   Ao contrário da 1ª versão (painel embutido só na Loja), agora é
   global — dá pra conferir a qualquer momento do wizard, não só na
   hora de comprar. mochilaOpen é estado de UI puro (não entra em
   `data`/persist() — fechar sozinho ao recarregar a página é aceitável,
   mesmo padrão de expandedSpellInfo/expandedTraitInfo). */
let mochilaOpen = false;
function toggleMochilaOpen(){ mochilaOpen = !mochilaOpen; render(); }

/* Posiciona o floater (e o popup, se estiver aberto) logo abaixo do
   <header> de verdade, medindo a altura real dele em vez de cravar um
   "top" fixo no CSS — o cabeçalho muda de altura conforme a largura da
   tela (o título "Criador de Personagens" quebra em 1 ou 2 linhas
   dependendo do aparelho), então um número fixo ficava certo numa
   largura e em cima do título ou do resumo em outra (bug relatado pelo
   usuário com print do celular). Chamada depois de todo render() e no
   resize da janela (rotação de tela, redimensionar o browser). */
function positionMochilaFloater(){
  const header = document.querySelector('header');
  const floater = document.querySelector('.mochila-floater');
  if(!header || !floater) return;
  const topBase = header.offsetTop + header.offsetHeight + 10;
  floater.style.top = topBase + 'px';
  const popup = document.querySelector('.mochila-popup');
  if(popup) popup.style.top = (topBase + floater.offsetHeight + 8) + 'px';
}
window.addEventListener('resize', positionMochilaFloater);

/* Ícone só (sem rótulo/subtítulo permanentes) — achado numa revisão
   geral: a versão anterior (pílula "🎒 Mochila" + "(clique pra abrir/
   fechar)") cobria conteúdo real da tela ao rolar em listas longas
   (Classe/Antecedente/Espécie/Loja), porque é position:fixed e não
   reage a scroll. Reduzido pra um círculo de 44px (.floater-fab no CSS)
   — cobre bem menos, mantém alvo de toque acessível, e a explicação
   agora é só o title/aria-label (tooltip), não texto sempre visível. */
function renderMochilaFloater(){
  if(!data.classe && !data.antecedente) return ''; // nada pra mostrar ainda
  return `<div class="floater-fab mochila-floater" onclick="toggleMochilaOpen()" title="Mochila — ver itens" aria-label="Mochila — ver itens">🎒</div>
  ${mochilaOpen ? renderMochilaPopup() : ''}`;
}

/* Botão "Randomizar" — mesma ideia/altura da Mochila, mas do lado
   esquerdo (mochila-floater.css é reaproveitado quase todo, só a
   posição/left muda — ver .randomizar-floater no CSS). Só aparece nos
   passos 0-7 (os únicos com campo obrigatório de verdade, mesmo critério
   de findFirstMissingGroup()/canAdvance()) — não aparece na Loja (8) nem
   no Resumo (9), pedido explícito do usuário pra Loja, e o Resumo nunca
   teve campo pra randomizar mesmo. */
function positionRandomizarFloater(){
  const header = document.querySelector('header');
  const floater = document.querySelector('.randomizar-floater');
  if(!header || !floater) return;
  floater.style.top = (header.offsetTop + header.offsetHeight + 10) + 'px';
}
window.addEventListener('resize', positionRandomizarFloater);

function renderRandomizarFloater(){
  if(step>7) return '';
  return `<div class="floater-fab randomizar-floater" onclick="randomizeCurrentStep()" title="Randomizar — preenche esta tela" aria-label="Randomizar — preenche esta tela">🎲</div>`;
}

function renderMochilaPopup(){
  const inherited = mochilaItems();
  const purchases = data.shop.purchases||{};
  const purchasedEntries = Object.entries(purchases).filter(([,q])=>q>0).map(([id,q])=>({label: findShopItem(id).n, qty:q}));
  const total = inherited.length + purchasedEntries.length;
  return `<div class="mochila-overlay" onclick="toggleMochilaOpen()">
    <div class="mochila-popup" onclick="event.stopPropagation()">
      <div class="mochila-popup-header">
        <h3>Sua Mochila</h3>
        <button class="btn small" onclick="toggleMochilaOpen()">✕</button>
      </div>
      ${inherited.length ? `<div style="margin-bottom:10px;"><div class="group-label" style="margin-bottom:4px;">Herdado da Classe/Antecedente</div>${inherited.map(it=>`<span class="pill-static">${it.label}${it.qty>1?` ×${it.qty}`:''}</span>`).join('')}</div>` : ''}
      ${purchasedEntries.length ? `<div><div class="group-label" style="margin-bottom:4px;">Comprado na Loja</div>${purchasedEntries.map(it=>`<span class="pill-static">${it.label} ×${it.qty}</span>`).join('')}</div>` : ''}
      ${total===0 ? '<span style="color:var(--parchment-dim);">Nada ainda — escolha o equipamento inicial na Classe/Antecedente, ou compre algo na Loja.</span>' : ''}
    </div>
  </div>`;
}

/* Popup "Novidades" — resumo das últimas atualizações, mostrado uma vez
   na 1ª tela (Passo 1) quando há update novo desde a última vez que o
   jogador fechou o popup (guardado em localStorage numa chave própria,
   separada da chave 'char_wizard_state' do persist() — é preferência do
   navegador sobre o QUE JÁ VIU, não estado de ficha). Sempre só os 3
   mais recentes: ao adicionar um
   novo no topo, apaga o mais antigo do array em vez de deixar crescer.
   changelogOpen decidido 1x em init() (ver final do arquivo) comparando
   CHANGELOG[0].id salvo; fechar (✕ ou clique fora) grava esse id como
   visto, então só reaparece sozinho quando o item mais novo mudar. */
const CHANGELOG_SEEN_KEY = 'char_wizard_changelog_seen';
const CHANGELOG = [
  { id:'2026-08-06-c', titulo:'Resumo e Loja mais completos', bullets:[
    '⚠️ Aviso quando algo foi adquirido em dois lugares diferentes (perícia, ferramenta, magia...)',
    'Loja mostra o Mod. de Ataque de cada arma antes de comprar'
  ]},
  { id:'2026-08-06-b', titulo:'Botão Randomizar', bullets:[
    '🎲 Sorteia automaticamente as escolhas da tela atual'
  ]},
  { id:'2026-08-06-a', titulo:'Resumo mais claro', bullets:[
    'Botão ⓘ mostra de onde vem cada número (Atributo/Salvaguarda/Perícia)',
    'Corrige CA do Monge com Escudo e Iniciativa com o talento Alerta'
  ]}
];

let changelogOpen = false;
function closeChangelog(){
  changelogOpen = false;
  try{ localStorage.setItem(CHANGELOG_SEEN_KEY, CHANGELOG[0].id); }catch(e){}
  render();
}
function renderChangelogPopup(){
  if(!changelogOpen) return '';
  return `<div class="changelog-overlay" onclick="closeChangelog()">
    <div class="changelog-popup" onclick="event.stopPropagation()">

function getBonusFor(ability){
  const plan = activeBgData().abilityPlan;
  if(!plan) return 0;
  if(plan.type==='1-1-1'){
    return (plan.plusOnes||[]).includes(ability) ? 1 : 0;
  }
  if(plan.type==='2-1'){
    if(plan.plus2===ability) return 2;
    if(plan.plus1===ability) return 1;
  }
  return 0;
}

  const bgGold = bg.equipment==='B' ? bgConst.equipmentB_gold : (bg.equipment==='A' ? bgConst.equipmentA_gold : 0);

function spentGold(){
  let total = 0;
  for(const [id, qty] of Object.entries(data.shop.purchases||{})){
    const item = findShopItem(id);
    if(item) total += item.c * qty;
  }
  return total;
}
/* Busca por ID (não mais por nome de exibição — nome pode mudar sem
   quebrar compras salvas, ver nota em data/shop-items.js). */
function findShopItem(id){
  for(const cat of Object.values(SHOP)){
    const found = cat.items.find(i=>i.id===id);
    if(found) return found;
  }
  return null;
}
/* Checa se um item de Arma (categoria "simples"/"marcial" do SHOP) bate
   com a proficiência FINA da classe (não só a categoria) — cruza por nome
   com WEAPON_MASTERY (que tem tipo Corpo a Corpo/À Distância e a lista de
   propriedades de cada arma). weaponProfMeleeOnly e weaponProfFiltroMarcial
   são campos opcionais no CONST da classe (hoje só Monge e Ladino têm),
   ausentes = sem restrição extra além da categoria. Se o nome do item não
   bater com nada em WEAPON_MASTERY (não deveria acontecer — os 28 nomes de
   Armas Simples/Marciais do SHOP foram conferidos 1 a 1 contra
   WEAPON_MASTERY), falha fechado (esconde) em vez de aberto, pra nunca
   mostrar uma arma que a classe não usa bem só por causa de um typo futuro
   de nome entre os dois arquivos. */
function itemMatchesWeaponProf(clsConst, itemName){
  const wm = WEAPON_MASTERY[itemName];
  if(!wm) return false;
  if(clsConst.weaponProfMeleeOnly && wm.tipo!=='Corpo a Corpo') return false;
  if(wm.categoria==='Marcial' && clsConst.weaponProfFiltroMarcial){
    return wm.propriedades.some(p=>clsConst.weaponProfFiltroMarcial.includes(p));
  }
  return true;
}
function toggleShopProfFilter(){ data.shop.filterByProf = !data.shop.filterByProf; persist(); render(); }

function renderShop(){

  const purchases = data.shop.purchases||{};
  const clsConst = activeClassConst();
  const maxGold = computeMaxPossibleGold();
  const filtering = data.shop.filterByProf;
  /* Preview do Mod. de Ataque nas categorias de arma — mesma fórmula de
     computeAttacks()/computeCharacterSheet(), só que ANTES de comprar
     (não depende de posse do item), pro jogador comparar armas na hora
     de decidir a compra em vez de só descobrir no Resumo depois. */
  const finalScore = a => (data.attrs[a]||0) + getBonusFor(a);
  const atkStrMod = mod(finalScore('Força'));
  const atkDexMod = mod(finalScore('Destreza'));
  const atkProf = PROF_BONUS_BY_LEVEL[1];
  let html = `<h2>Loja — Gaste seu Dinheiro Inicial</h2>
  <div class="intro">Por padrão a Loja mostra TODAS as armas e armaduras, pra você conhecer as opções — ferramentas, focos, munição e equipamento de aventura valem pra qualquer um sempre. Itens mais caros que ${fmtGold(maxGold)} PO (o máximo possível de ouro inicial, somando classe + antecedente) não aparecem, porque nunca dá pra comprá-los na criação do personagem.</div>
  <div style="display:flex;align-items:center;gap:8px;cursor:pointer;margin:10px 0;" onclick="toggleShopProfFilter()">

  </div>`;

  Object.entries(SHOP).forEach(([catName, cat])=>{
    const isWeaponCat = cat.filterProf==='simples' || cat.filterProf==='marcial';
    if(filtering && cat.filterProf && !clsConst.weaponProf.includes(cat.filterProf) && !clsConst.armorProf.includes(cat.filterProf)) return;
    const visibleItems = cat.items.filter(it => it.c <= maxGold && (!filtering || !isWeaponCat || itemMatchesWeaponProf(clsConst, it.n)));
    if(visibleItems.length===0) return;
    const isOpen = !data.shop.collapsedCats[catName]; // aberto por padrão, fechado só se o usuário já minimizou antes
    html += `<details class="shop-category" data-cat="${catName}" ontoggle="toggleShopCategory(this)" ${isOpen?'open':''}>
    <summary>${catName} <span class="cat-count">(${visibleItems.length} ${visibleItems.length===1?'item':'itens'})</span></summary>
    <table class="shop-table"><thead><tr><th>Item</th><th>Dano/Efeito</th><th>Propriedades</th>${isWeaponCat?'<th>Mod. de Ataque</th>':''}<th>Custo</th><th>Qtd.</th></tr></thead><tbody>
    ${visibleItems.map(it=>{
      const qty = purchases[it.id]||0;
      const maxQty = maxAffordableQty(it.id) + qty; // limite considerando o que já foi gasto neste item
      const atCap = qty>=maxQty;
      const contHtml = it.cont ? `<div style="font-size:0.68rem; color:var(--parchment-dim); font-style:italic; margin-top:2px;">${it.cont}</div>` : '';
      const atk = isWeaponCat ? weaponAttackBonus(clsConst, atkStrMod, atkDexMod, atkProf, it.n) : null;
      const atkHtml = atk ? `<td data-label="Mod. de Ataque"><b style="color:var(--gold);">${fmt(atk.bonus)}</b>${atk.proficient?'':' <span style="color:var(--parchment-dim);font-size:0.75rem;">(sem proficiência)</span>'}</td>` : (isWeaponCat ? '<td data-label="Mod. de Ataque">—</td>' : '');
      return `<tr>
        <td data-label="Item">${it.n}${contHtml}</td>
        <td data-label="Dano/Efeito">${it.d}</td>
        <td data-label="Propriedades" style="color:var(--parchment-dim);font-size:0.78rem;">${it.p}</td>

  if(cartEntries.length){
    html += `<h3>Carrinho</h3><div class="cart-list">${cartEntries.map(([id,q])=>{
      const item = findShopItem(id);

    }).join('')}</div>`;
